<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shopling A21 수정전송</title>
<style>
*{box-sizing:border-box}body{width:420px;margin:0;padding:16px;font:13px/1.45 Arial,sans-serif;color:#0f172a;background:#f8fafc}h1{font-size:16px;margin:0 0 4px}p{margin:0;color:#64748b}.card{margin-top:12px;padding:12px;border:1px solid #e2e8f0;border-radius:12px;background:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.metric{padding:9px;border-radius:9px;background:#f1f5f9}.metric b{display:block;font-size:16px;margin-top:2px}.ok{color:#047857}.bad{color:#b91c1c}.warn{color:#b45309}.safe{padding:9px;border-radius:8px;background:#ecfdf5;color:#065f46;font-weight:700}.test{background:#fff7ed;color:#9a3412;border:1px solid #fed7aa}button{width:100%;margin-top:10px;border:0;border-radius:10px;padding:10px 12px;font-weight:700;cursor:pointer}.primary{background:#0f172a;color:#fff}.stop{background:#fee2e2;color:#991b1b}.muted{background:#e2e8f0;color:#334155}button:disabled{opacity:.45;cursor:not-allowed}#jobs{max-height:300px;overflow:auto;margin-top:8px}.job{padding:8px 0;border-top:1px solid #f1f5f9}.job:first-child{border-top:0}.job strong{font-size:12px}.job small{display:block;color:#64748b;margin-top:2px}.pill{display:inline-block;border-radius:999px;padding:2px 6px;font-size:10px;font-weight:700;background:#e2e8f0}.pill.SUCCEEDED{background:#d1fae5;color:#065f46}.pill.FAILED{background:#fee2e2;color:#991b1b}.pill.RUNNING{background:#dbeafe;color:#1d4ed8}.pill.QUEUED{background:#fef3c7;color:#92400e}
</style>
</head>
<body>
<h1>Shopling A21 가격·옵션 수정전송</h1>
<p>v0.2.5 · 배송정보 수정안함 고정 · 모든 쇼핑몰 결과 합산 검증 · 동시 1개</p>
<div class="card" id="planCard">대상 확인 중...</div>
<div class="card">
  <div class="safe">판매가: 쇼핑몰별판매가(J) + 판매가만 수정 · 배송정보는 실제 ‘수정안함’ 라디오 재검증 · 결과: 각 쇼핑몰의 총건수/성공건수/실패건수를 모두 합산한 뒤에만 완료 판정 · 옵션: goods_stock + 옵션송신(1)만</div>
  <div id="runState" style="margin-top:10px">실행 대기</div>
  <div id="jobs"></div>
  <button id="test" class="test" disabled>1 GOODSKEY 안전 테스트</button>
  <button id="start" class="primary" disabled>전체 가격·옵션 수정전송 시작</button>
  <button id="stop" class="stop" style="display:none">안전 중지</button>
  <button id="refresh" class="muted">상태 새로고침</button>
</div>
<script src="popup-run.js"></script>
</body>
</html>
