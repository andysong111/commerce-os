<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Shopling 재고상태 전환</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <p class="eyebrow">COMMERCE OS · v0.1.0</p>
      <h1>Shopling 품절·판매중 전환</h1>
      <p id="summary" class="summary">상태 확인 중...</p>
      <section id="card" class="card" hidden>
        <div class="grid">
          <span>B코드</span><strong id="barcode">-</strong>
          <span>상품형태</span><strong id="mode">-</strong>
          <span>목표상태</span><strong id="target">-</strong>
          <span>진행단계</span><strong id="stage">-</strong>
        </div>
        <p id="message" class="message"></p>
      </section>
      <button id="stop" type="button" hidden>안전 중지</button>
      <p class="note">옵션상품은 A6→A22, 단품은 A6→A21 순서로 직렬 실행합니다.</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
