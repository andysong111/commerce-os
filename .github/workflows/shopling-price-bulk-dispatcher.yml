name: Shopling price bulk dispatcher
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Advance one bulk chunk
        env:
          BASE_URL: ${{ secrets.OPS_CENTER_BASE_URL }}
          CRON_SECRET: ${{ secrets.SHOPLING_PRICE_BULK_CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            "${BASE_URL%/}/api/cron/shopling-price-bulk"
