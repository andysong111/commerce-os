name: Apply Live Refresh Fingerprint Patch

on:
  push:
    branches:
      - agent/product-decision-live-refresh-worker
    paths:
      - .github/workflows/apply-live-refresh-content-fingerprint.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/product-decision-live-refresh-worker
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Apply exact source replacements
        run: node scripts/apply-live-refresh-content-fingerprint.mjs

      - name: Commit patched worker
        run: |
          if git diff --quiet -- src/lib/productDecisionLiveRefresh.ts; then
            echo "No patch changes produced"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/productDecisionLiveRefresh.ts
          git commit -m "Freeze live refresh planning by content fingerprint"
          git push origin HEAD:agent/product-decision-live-refresh-worker
