name: Temporary Stage8 Sales Event Canary

on:
  pull_request:

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wait for Product Master migration and run one canonical event canary
        shell: bash
        run: |
          set -euo pipefail
          base='https://commerce-os-ops-center.vercel.app'
          page="$base/stage8-sales-events"
          api="$base/api/product-master/shopling-sales-events"
          text=''
          for i in $(seq 1 12); do
            echo "--- readiness probe $i ---"
            text="$(curl -L -sS --connect-timeout 10 --max-time 60 "$page" \
              | python -c 'import html,re,sys; raw=sys.stdin.read(); raw=re.sub(r"<script[\s\S]*?</script>"," ",raw,flags=re.I); raw=re.sub(r"<style[\s\S]*?</style>"," ",raw,flags=re.I); raw=re.sub(r"<[^>]+>"," ",raw); print(re.sub(r"\s+"," ",html.unescape(raw)).strip()[:20000])')"
            echo "$text"
            if echo "$text" | grep -q 'READY_CANARY'; then
              break
            fi
            if echo "$text" | grep -Eq 'BLOCKED|FAILED'; then
              echo 'Stage8 is blocked or failed; refusing canary.' >&2
              exit 1
            fi
            sleep 5
          done
          echo "$text" | grep -q 'READY_CANARY'
          plan="$(echo "$text" | grep -oE 'plan sha256:[a-f0-9]{64}' | head -1 | awk '{print $2}')"
          test -n "$plan"
          echo "Using plan fingerprint: $plan"
          payload="$(printf '{\"action\":\"canary\",\"planFingerprint\":\"%s\",\"confirmation\":\"CANARY\"}' "$plan")"
          response="$(curl -L -sS --connect-timeout 10 --max-time 120 \
            -X POST "$api" \
            -H 'content-type: application/json' \
            -H "origin: $base" \
            -H "referer: $page" \
            --data "$payload")"
          echo "$response"
          RESPONSE="$response" python - <<'PY'
          import json, os, sys
          data=json.loads(os.environ['RESPONSE'])
          if data.get('ok') is not True:
              print(data, file=sys.stderr)
              raise SystemExit(1)
          result=data.get('result') or {}
          if result.get('mode') != 'canary' or result.get('written') != 1 or result.get('selected') != 1:
              print(data, file=sys.stderr)
              raise SystemExit(1)
          PY
          sleep 3
          after="$(curl -L -sS --connect-timeout 10 --max-time 60 "$page" \
            | python -c 'import html,re,sys; raw=sys.stdin.read(); raw=re.sub(r"<script[\s\S]*?</script>"," ",raw,flags=re.I); raw=re.sub(r"<style[\s\S]*?</style>"," ",raw,flags=re.I); raw=re.sub(r"<[^>]+>"," ",raw); print(re.sub(r"\s+"," ",html.unescape(raw)).strip()[:20000])')"
          echo "$after"
          echo "$after" | grep -q 'READY_FULL'
