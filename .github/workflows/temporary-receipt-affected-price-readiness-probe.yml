name: Temporary Receipt Affected Price Readiness Probe

on:
  push:
    branches:
      - ops/receipt-affected-price-readiness-probe-20260809
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  probe:
    if: >-
      ${{
        (github.event_name == 'push' && github.ref_name == 'ops/receipt-affected-price-readiness-probe-20260809') ||
        (github.event_name == 'pull_request' && github.head_ref == 'ops/receipt-affected-price-readiness-probe-20260809')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Wait for production and require affected-only lookup
        shell: bash
        run: |
          set -euo pipefail
          url='https://commerce-os-ops-center.vercel.app/stage8-shopling-receipt-price-readiness'
          ready=0
          for i in $(seq 1 50); do
            body="$(mktemp)"
            metrics="$(mktemp)"
            code="$(curl -L -sS --connect-timeout 10 --max-time 120 \
              -o "$body" -w '%{http_code} %{time_total}' "$url" || true)"
            http="$(echo "$code" | awk '{print $1}')"
            elapsed="$(echo "$code" | awk '{print $2}')"
            text="$(cat "$body" | python -c 'import html,re,sys; raw=sys.stdin.read(); raw=re.sub(r"<script[\s\S]*?</script>"," ",raw,flags=re.I); raw=re.sub(r"<style[\s\S]*?</style>"," ",raw,flags=re.I); raw=re.sub(r"<[^>]+>"," ",raw); print(re.sub(r"\s+"," ",html.unescape(raw)).strip()[:120000])')"
            echo "PROBE $i HTTP=$http ELAPSED=${elapsed}s"
            if [ "$http" = '200' ] && echo "$text" | grep -q 'RECEIPT-AFFECTED LIVE PRICE'; then
              echo '--- RECEIPT AFFECTED PRICE READINESS ---'
              echo "$text"
              echo "ELAPSED_SECONDS=$elapsed"
              echo "$text" | grep -q 'RECEIPT_AFFECTED_ONLY'
              echo "$text" | grep -q '실제 가격 write 0 · READ ONLY'
              echo "$text" | grep -Eq '새 입고 없음 · 조회 생략|새 입고 SKU만 LIVE 조회'
              ready=1
              break
            fi
            sleep 8
          done
          test "$ready" = '1'
