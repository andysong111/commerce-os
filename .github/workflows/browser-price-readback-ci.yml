name: Browser Price Readback CI

on:
  push:
    paths:
      - "src/lib/internalChinaBrowserMallPriceReadback.ts"
      - "src/app/api/shopling-price-readback-bridge/route.ts"
      - "src/app/api/china-order-manager/price-review/browser-readback/route.ts"
      - "src/app/api/china-order-manager/price-review/group-aware-execute/route.ts"
      - "src/components/china-order-manager/InternalChinaBrowserMallPriceReadbackButton.tsx"
      - "public/shopling-account-title-bridge/background-shopling-price-readback.js"
      - "public/shopling-account-title-bridge/content-shopling-price-readback.js"
      - "public/shopling-account-title-bridge/background-shopling-root.js"
      - "src/app/api/shopling-account-title-bridge/download/route.ts"
      - "tests/internalChinaBrowserMallPriceReadback.test.mjs"
      - ".github/workflows/browser-price-readback-ci.yml"
  pull_request:
    paths:
      - "src/lib/internalChinaBrowserMallPriceReadback.ts"
      - "src/app/api/shopling-price-readback-bridge/route.ts"
      - "src/app/api/china-order-manager/price-review/browser-readback/route.ts"
      - "src/app/api/china-order-manager/price-review/group-aware-execute/route.ts"
      - "src/components/china-order-manager/InternalChinaBrowserMallPriceReadbackButton.tsx"
      - "public/shopling-account-title-bridge/background-shopling-price-readback.js"
      - "public/shopling-account-title-bridge/content-shopling-price-readback.js"
      - "public/shopling-account-title-bridge/background-shopling-root.js"
      - "src/app/api/shopling-account-title-bridge/download/route.ts"
      - "tests/internalChinaBrowserMallPriceReadback.test.mjs"
      - ".github/workflows/browser-price-readback-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Browser price readback safety regressions
        run: node --experimental-strip-types --test tests/internalChinaBrowserMallPriceReadback.test.mjs
      - name: Lint browser price readback integration
        run: >-
          npx eslint
          src/lib/internalChinaBrowserMallPriceReadback.ts
          src/app/api/shopling-price-readback-bridge/route.ts
          src/app/api/china-order-manager/price-review/browser-readback/route.ts
          src/app/api/china-order-manager/price-review/group-aware-execute/route.ts
          src/components/china-order-manager/InternalChinaBrowserMallPriceReadbackButton.tsx
