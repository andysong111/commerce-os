name: Temporary Stage8 Extra Persisted Diagnostic Patcher

on:
  push:
    branches:
      - feat/stage8-extra-persisted-sku-diagnostic
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: >-
      ${{
        (github.event_name == 'push' && github.ref_name == 'feat/stage8-extra-persisted-sku-diagnostic' && !contains(github.event.head_commit.message, '[extra-persisted-diagnostic-patched]')) ||
        (github.event_name == 'pull_request' && github.head_ref == 'feat/stage8-extra-persisted-sku-diagnostic')
      }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/stage8-extra-persisted-sku-diagnostic
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Add exact extra persisted SKU diagnostics
        shell: python
        run: |
          from pathlib import Path

          engine = Path('src/lib/stage8PostApplyCanonicalReconciliation.ts')
          text = engine.read_text(encoding='utf-8')

          type_marker = '''export type PostApplyCanonicalReconciliation = {\n'''
          type_block = '''export type ExtraPersistedSkuPlanningMatch = {\n  skuId: string;\n  modelNo: string | null;\n  productName: string;\n  skuActive: boolean | null;\n  listingCount: number;\n  activeListingCount: number;\n};\n\nexport type ExtraPersistedSkuDiagnostic = {\n  barcode: string;\n  persistedHasDemand: boolean;\n  persistedValidEventCount: number;\n  persistedMonthlyUnits: number[];\n  persistedMonthlyRevenue: number[];\n  persistedLastSaleAt: string | null;\n  planningMatchCount: number;\n  activePlanningMatchCount: number;\n  candidateOmissionReason:\n    | "NO_PLANNING_ROW"\n    | "ALL_PLANNING_ROWS_INACTIVE"\n    | "DUPLICATE_ACTIVE_PLANNING_ROWS"\n    | "UNKNOWN_CANDIDATE_INDEX_EXCLUSION";\n  planningMatches: ExtraPersistedSkuPlanningMatch[];\n};\n\n'''
          if type_block.strip() not in text:
              if type_marker not in text: raise SystemExit('type marker missing')
              text = text.replace(type_marker, type_block + type_marker, 1)

          field_marker = '  extraPersistedBarcodes: string[];\n  rowMismatchSamples: PostApplyCanonicalRowMismatch[];'
          field_repl = '  extraPersistedBarcodes: string[];\n  extraPersistedDiagnostics: ExtraPersistedSkuDiagnostic[];\n  rowMismatchSamples: PostApplyCanonicalRowMismatch[];'
          if field_repl not in text:
              if field_marker not in text: raise SystemExit('field marker missing')
              text = text.replace(field_marker, field_repl, 1)

          waiting_marker = '    extraPersistedBarcodes: [],\n    rowMismatchSamples: [],'
          waiting_repl = '    extraPersistedBarcodes: [],\n    extraPersistedDiagnostics: [],\n    rowMismatchSamples: [],'
          if waiting_repl not in text:
              if waiting_marker not in text: raise SystemExit('waiting marker missing')
              text = text.replace(waiting_marker, waiting_repl, 1)

          calc_marker = '''  const extraPersistedNonZeroCount = extraPersistedBarcodes.filter((barcode) => {\n    const row = persistedByBarcode.get(barcode);\n    return row ? !persistedRowIsZero(row) : false;\n  }).length;\n'''
          calc_block = '''  const extraPersistedDiagnostics: ExtraPersistedSkuDiagnostic[] =\n    extraPersistedBarcodes.map((barcode) => {\n      const persistedRow = persistedByBarcode.get(barcode)!;\n      const planningMatches = (planning.products ?? [])\n        .filter((product) => text(product.barcode).toUpperCase() === barcode)\n        .map((product) => ({\n          skuId: text(product.skuId),\n          modelNo: text(product.modelNo) || null,\n          productName: text(product.productName) || barcode,\n          skuActive:\n            typeof product.skuActive === "boolean" ? product.skuActive : null,\n          listingCount: Array.isArray(product.listings) ? product.listings.length : 0,\n          activeListingCount: Array.isArray(product.listings)\n            ? product.listings.filter((listing) => listing.active !== false).length\n            : 0,\n        }));\n      const activePlanningMatchCount = planningMatches.filter(\n        (row) => row.skuActive !== false,\n      ).length;\n      const candidateOmissionReason: ExtraPersistedSkuDiagnostic["candidateOmissionReason"] =\n        planningMatches.length === 0\n          ? "NO_PLANNING_ROW"\n          : activePlanningMatchCount === 0\n            ? "ALL_PLANNING_ROWS_INACTIVE"\n            : activePlanningMatchCount > 1\n              ? "DUPLICATE_ACTIVE_PLANNING_ROWS"\n              : "UNKNOWN_CANDIDATE_INDEX_EXCLUSION";\n      return {\n        barcode,\n        persistedHasDemand: !persistedRowIsZero(persistedRow),\n        persistedValidEventCount: integer(persistedRow.validEventCount),\n        persistedMonthlyUnits: normalizedArray(persistedRow.monthlyUnits),\n        persistedMonthlyRevenue: normalizedArray(persistedRow.monthlyRevenue),\n        persistedLastSaleAt: persistedRow.lastSaleAt,\n        planningMatchCount: planningMatches.length,\n        activePlanningMatchCount,\n        candidateOmissionReason,\n        planningMatches,\n      };\n    });\n'''
          if calc_block.strip() not in text:
              if calc_marker not in text: raise SystemExit('calc marker missing')
              text = text.replace(calc_marker, calc_marker + calc_block, 1)

          return_marker = '    extraPersistedBarcodes,\n    rowMismatchSamples,'
          return_repl = '    extraPersistedBarcodes,\n    extraPersistedDiagnostics,\n    rowMismatchSamples,'
          if return_repl not in text:
              if return_marker not in text: raise SystemExit('return marker missing')
              text = text.replace(return_marker, return_repl, 1)

          engine.write_text(text, encoding='utf-8')

          page = Path('src/app/stage8-postapply-canonical-reconciliation/page.tsx')
          ptext = page.read_text(encoding='utf-8')
          page_marker = '''      {result.rowMismatchSamples.length ? (\n'''
          page_block = '''      {result.extraPersistedDiagnostics.length ? (\n        <section className="rounded-2xl border border-amber-200 bg-white p-5 shadow-sm">\n          <h2 className="text-lg font-black text-slate-950">Candidate에 없는 Persisted active SKU 진단</h2>\n          <p className="mt-2 text-sm leading-6 text-slate-600">Product Master는 active인데 frozen planning candidate에는 없었던 SKU를 그대로 펼칩니다. 판매값이 있는 SKU는 planning의 active 상태·중복 여부를 확인하기 전까지 다음 전환을 차단합니다.</p>\n          <div className="mt-4 overflow-x-auto">\n            <table className="min-w-[1500px] text-left text-xs">\n              <thead className="text-slate-500"><tr><th className="px-3 py-2">바코드</th><th className="px-3 py-2">판매값</th><th className="px-3 py-2">정상 이벤트</th><th className="px-3 py-2">12구간 수량</th><th className="px-3 py-2">최근판매</th><th className="px-3 py-2">Planning 행</th><th className="px-3 py-2">active Planning 행</th><th className="px-3 py-2">Candidate 제외 이유</th><th className="px-3 py-2">Planning 상세</th></tr></thead>\n              <tbody>{result.extraPersistedDiagnostics.map((row) => (\n                <tr key={row.barcode} className="border-t border-slate-100 align-top">\n                  <td className="px-3 py-2 font-black text-slate-950">{row.barcode}</td>\n                  <td className={`px-3 py-2 font-black ${row.persistedHasDemand ? "text-rose-700" : "text-slate-500"}`}>{row.persistedHasDemand ? "있음" : "0"}</td>\n                  <td className="px-3 py-2">{number.format(row.persistedValidEventCount)}</td>\n                  <td className="px-3 py-2">{row.persistedMonthlyUnits.join(" / ")}</td>\n                  <td className="px-3 py-2">{row.persistedLastSaleAt ?? "-"}</td>\n                  <td className="px-3 py-2">{number.format(row.planningMatchCount)}</td>\n                  <td className="px-3 py-2">{number.format(row.activePlanningMatchCount)}</td>\n                  <td className="px-3 py-2 font-bold">{row.candidateOmissionReason}</td>\n                  <td className="px-3 py-2">{row.planningMatches.length ? row.planningMatches.map((match) => `${match.skuId || "-"} · ${match.modelNo || "-"} · ${match.productName} · skuActive=${String(match.skuActive)} · listing ${match.activeListingCount}/${match.listingCount}`).join(" | ") : "없음"}</td>\n                </tr>\n              ))}</tbody>\n            </table>\n          </div>\n        </section>\n      ) : null}\n\n'''
          if page_block.strip() not in ptext:
              if page_marker not in ptext: raise SystemExit('page marker missing')
              ptext = ptext.replace(page_marker, page_block + page_marker, 1)
          page.write_text(ptext, encoding='utf-8')

          test = Path('tests/stage8PostApplyCanonicalReconciliation.test.mjs')
          t = test.read_text(encoding='utf-8')
          addition = '''\n\ntest("blocked extra persisted SKUs expose planning state and nonzero demand evidence", () => {\n  assert.match(engine, /extraPersistedDiagnostics/);\n  assert.match(engine, /persistedHasDemand/);\n  assert.match(engine, /planningMatchCount/);\n  assert.match(engine, /activePlanningMatchCount/);\n  assert.match(engine, /ALL_PLANNING_ROWS_INACTIVE/);\n  assert.match(engine, /DUPLICATE_ACTIVE_PLANNING_ROWS/);\n  assert.match(engine, /UNKNOWN_CANDIDATE_INDEX_EXCLUSION/);\n  assert.match(page, /Candidate에 없는 Persisted active SKU 진단/);\n  assert.match(page, /Candidate 제외 이유/);\n});\n'''
          if addition.strip() not in t:
              t += addition
          test.write_text(t, encoding='utf-8')
      - name: Focused tests
        run: node --experimental-strip-types --test tests/stage8PostApplyCanonicalReconciliation.test.mjs
      - name: Lint
        run: npx eslint src/lib/stage8PostApplyCanonicalReconciliation.ts src/app/stage8-postapply-canonical-reconciliation/page.tsx
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://price-auth-build-check.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_price_auth_build_check
          PRICE_ADJUSTMENT_ENGINE_INTEGRATION_SECRET: ci-price-adjustment-secret
          PRICE_ADJUSTMENT_AUTOMATION_OWNER_ID: 0c23a96b-1cda-44b6-9c08-1fa1c1b45a36
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/stage8PostApplyCanonicalReconciliation.ts src/app/stage8-postapply-canonical-reconciliation/page.tsx tests/stage8PostApplyCanonicalReconciliation.test.mjs
          if git diff --cached --quiet; then echo 'No diagnostic patch needed.'; exit 0; fi
          git commit -m "Expose extra persisted SKU diagnostics [extra-persisted-diagnostic-patched]"
          git push origin HEAD:feat/stage8-extra-persisted-sku-diagnostic
