name: Temporary Stage8 Stable Preflight Production Probe

on:
  push:
    branches:
      - ops/stage8-stable-preflight-probe-20260809
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  probe:
    if: ${{ github.event_name == 'push' || github.head_ref == 'ops/stage8-stable-preflight-probe-20260809' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Print current production preflight
        run: |
          set -euo pipefail
          url='https://commerce-os-ops-center.vercel.app/stage8-stocktake-canary-preflight'
          body="$(mktemp)"
          code="$(curl -L -sS --connect-timeout 10 --max-time 90 -o "$body" -w '%{http_code}' "$url")"
          text="$(cat "$body" | python -c 'import html,re,sys; raw=sys.stdin.read(); raw=re.sub(r"<script[\s\S]*?</script>"," ",raw,flags=re.I); raw=re.sub(r"<style[\s\S]*?</style>"," ",raw,flags=re.I); raw=re.sub(r"<[^>]+>"," ",raw); print(re.sub(r"\s+"," ",html.unescape(raw)).strip()[:120000])')"
          echo "HTTP=$code"
          echo '--- CURRENT PREFLIGHT ---'
          echo "$text"
          echo "PLAN=$(printf '%s' "$text" | grep -oE 'Plan fingerprint · sha256:[a-f0-9]{64}' | head -1 | sed 's/^Plan fingerprint · //' || true)"
          echo "GUARD=$(printf '%s' "$text" | grep -oE 'Inventory guard · sha256:[a-f0-9]{64}' | head -1 | sed 's/^Inventory guard · //' || true)"
          test "$code" = '200'
