name: Temporary Stage8 Canonical Purchase Shadow Production Probe

on:
  push:
    branches:
      - ops/stage8-canonical-purchase-shadow-probe-20260809
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  probe:
    if: ${{ github.event_name == 'push' || github.head_ref == 'ops/stage8-canonical-purchase-shadow-probe-20260809' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require canonical purchase shadow production invariants
        shell: bash
        run: |
          set -euo pipefail
          url='https://commerce-os-ops-center.vercel.app/stage8-canonical-purchase-shadow'
          ready=0
          for i in $(seq 1 60); do
            body="$(mktemp)"
            code="$(curl -L -sS --connect-timeout 10 --max-time 90 -o "$body" -w '%{http_code}' "$url" || true)"
            text="$(cat "$body" | python -c 'import html,re,sys; raw=sys.stdin.read(); raw=re.sub(r"<script[\s\S]*?</script>"," ",raw,flags=re.I); raw=re.sub(r"<style[\s\S]*?</style>"," ",raw,flags=re.I); raw=re.sub(r"<[^>]+>"," ",raw); print(re.sub(r"\s+"," ",html.unescape(raw)).strip()[:90000])')"
            echo "PROBE $i HTTP $code"
            if [ "$code" = '200' ] && echo "$text" | grep -q 'Canonical 판매수요 → 발주추천 그림자'; then
              echo '--- CANONICAL PURCHASE SHADOW PAGE ---'
              echo "$text"
              echo "$text" | grep -q 'Shadow 상태 SHADOW_READY'
              echo "$text" | grep -q 'CANONICAL DEMAND PATH READY'
              echo "$text" | grep -q 'Canonical active SKU 332'
              echo "$text" | grep -q 'Engine 입력 일치 332/332'
              echo "$text" | grep -q 'Demand source PRODUCT_MASTER_CANONICAL_SALES_EVENTS'
              echo "$text" | grep -q 'Claim signal NEUTRAL_SHADOW_ONLY'
              echo "$text" | grep -q '실제 발주 항상 차단'
              echo "$text" | grep -q 'claim-auxiliary'
              echo "$text" | grep -q 'Canonical freshness · PASS'
              echo "$text" | grep -q 'Planning mismatch · 없음'
              ready=1
              break
            fi
            sleep 5
          done
          test "$ready" = '1'
