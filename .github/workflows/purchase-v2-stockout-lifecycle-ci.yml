name: Purchase V2 stockout lifecycle CI

on:
  push:
    branches:
      - feat/purchase-v2-stockout-reset-20260905
    paths:
      - "src/lib/productDecisionEngine/purchaseV2.ts"
      - "src/lib/purchaseRecommendationV2.ts"
      - "src/lib/purchaseRecommendationFinalization.ts"
      - "src/lib/inventoryLifecycleLedger.ts"
      - "src/app/api/fast-purchase/v2/**"
      - "src/app/api/inventory-lifecycle/**"
      - "src/app/api/shopling-inventory-lifecycle-extension/**"
      - "src/app/china-order-manager/**"
      - "src/components/china-order-manager/**"
      - "public/shopling-inventory-lifecycle/**"
      - "tests/purchaseV2*.test.mjs"
      - "tests/inventoryLifecycleLedger.test.mjs"
      - "tests/shoplingInventoryLifecycleExtension.test.mjs"
      - "scripts/finalize-purchase-v2-branch*.mjs"
      - ".github/workflows/purchase-v2-stockout-lifecycle-ci.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: purchase-v2-stockout-lifecycle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/purchase-v2-stockout-reset-20260905

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply deterministic finalizers
        run: |
          node scripts/finalize-purchase-v2-branch.mjs
          node scripts/finalize-purchase-v2-branch-2.mjs

      - name: Verify V2 demand, exact inventory and allocation
        run: >-
          npx tsx --test
          tests/purchaseV2.test.mjs
          tests/inventoryLifecycleLedger.test.mjs

      - name: Verify persistence, UI and extension contracts
        run: >-
          node --test
          tests/purchaseV2PersistenceContract.test.mjs
          tests/shoplingInventoryLifecycleExtension.test.mjs

      - name: Lint
        run: npm run lint --if-present

      - name: Production build
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: npm run build

      - name: Commit deterministic finalizer output
        run: |
          if git diff --quiet; then
            echo "No generated fixes to commit."
            exit 0
          fi
          git config user.name "commerce-os-purchase-v2-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            public/shopling-inventory-lifecycle \
            src/app/api/inventory-lifecycle/route.ts \
            src/app/api/shopling-inventory-lifecycle-extension/download/route.ts \
            src/components/china-order-manager/ChinaOrderManagerNav.tsx \
            src/lib/inventoryLifecycleLedger.ts
          git commit -m "[purchase-v2-bot] finalize V2 lifecycle implementation"
          git push origin HEAD:feat/purchase-v2-stockout-reset-20260905
