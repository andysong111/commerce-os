name: Purchase Candidate Identity Audit CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  identity-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Lint identity audit page
        run: npx eslint src/app/stage8-purchase-candidate-identity-audit/page.tsx
      - name: Test identity audit safety
        run: node --test tests/stage8PurchaseCandidateIdentityAudit.test.mjs
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://candidate-identity-build-check.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_candidate_identity_build_check
          PRICE_ADJUSTMENT_ENGINE_INTEGRATION_SECRET: ci-price-adjustment-secret
          PRICE_ADJUSTMENT_AUTOMATION_OWNER_ID: 0c23a96b-1cda-44b6-9c08-1fa1c1b45a36
