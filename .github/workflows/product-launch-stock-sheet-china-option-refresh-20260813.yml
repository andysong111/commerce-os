name: Product Launch Stock Sheet China Option Refresh 20260813

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/product-launch-stock-sheet-china-option-refresh-20260813.yml'
      - 'src/app/api/product-launch-tracker/migrations/stock-sheet-china-option-refresh-20260813/route.ts'

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wait for production dry-run endpoint
        shell: bash
        run: |
          set -euo pipefail
          URL='https://commerce-os-ops-center.vercel.app/api/product-launch-tracker/migrations/stock-sheet-china-option-refresh-20260813'
          for attempt in $(seq 1 45); do
            code=$(curl -sS -o /tmp/dry-run.json -w '%{http_code}' "$URL" || true)
            if [ "$code" = '200' ]; then
              cat /tmp/dry-run.json
              node - <<'NODE'
              const fs = require('fs');
              const body = JSON.parse(fs.readFileSync('/tmp/dry-run.json', 'utf8'));
              if (body.ok !== true) throw new Error(body.message || 'dry-run returned ok=false');
              if (body.dryRun !== true && body.alreadyApplied !== true) {
                throw new Error('endpoint is neither dry-run nor already-applied');
              }
              const report = body.report || {};
              console.log(`dry-run changedItems=${report.changedItems ?? 0} changedOptions=${report.changedOptions ?? 0} ambiguous=${report.ambiguousOptionCount ?? 0} unmatched=${report.unmatchedOptionCount ?? 0}`);
              NODE
              exit 0
            fi
            echo "attempt=$attempt status=$code"
            cat /tmp/dry-run.json 2>/dev/null || true
            sleep 10
          done
          echo 'Migration endpoint did not become ready in time.' >&2
          exit 1

      - name: Apply China option refresh
        shell: bash
        run: |
          set -euo pipefail
          URL='https://commerce-os-ops-center.vercel.app/api/product-launch-tracker/migrations/stock-sheet-china-option-refresh-20260813?apply=1'
          for attempt in $(seq 1 6); do
            code=$(curl -sS -o /tmp/apply.json -w '%{http_code}' "$URL" || true)
            cat /tmp/apply.json 2>/dev/null || true
            if [ "$code" = '200' ]; then
              node - <<'NODE'
              const fs = require('fs');
              const body = JSON.parse(fs.readFileSync('/tmp/apply.json', 'utf8'));
              if (body.ok !== true) throw new Error(body.message || 'apply returned ok=false');
              if (body.applied !== true && body.alreadyApplied !== true) {
                throw new Error('migration neither applied nor already applied');
              }
              const report = body.report || {};
              console.log(`applied changedItems=${report.changedItems ?? 0} changedOptions=${report.changedOptions ?? 0} preserved=${report.preservedExistingOptions ?? 0}`);
              NODE
              exit 0
            fi
            if [ "$code" != '409' ]; then
              echo "Unexpected apply status=$code" >&2
              exit 1
            fi
            echo "Concurrent save detected; retry=$attempt"
            sleep 5
          done
          echo 'Migration could not acquire a clean write window.' >&2
          exit 1

      - name: Verify server state marker
        shell: bash
        run: |
          set -euo pipefail
          URL='https://commerce-os-ops-center.vercel.app/api/product-launch-tracker/migrations/stock-sheet-china-option-refresh-20260813'
          curl --fail-with-body -sS "$URL" -o /tmp/verify.json
          cat /tmp/verify.json
          node - <<'NODE'
          const fs = require('fs');
          const body = JSON.parse(fs.readFileSync('/tmp/verify.json', 'utf8'));
          if (body.ok !== true || body.alreadyApplied !== true) {
            throw new Error('migration marker verification failed');
          }
          const report = body.report || {};
          const summary = [
            '## Stock sheet China option refresh 2026-08-13',
            '',
            `- state items: ${report.stateItemCount ?? 0}`,
            `- matched model items: ${report.matchedModelItems ?? 0}`,
            `- changed items: ${report.changedItems ?? 0}`,
            `- changed China options: ${report.changedOptions ?? 0}`,
            `- preserved existing China options: ${report.preservedExistingOptions ?? 0}`,
            `- ambiguous options left unchanged: ${report.ambiguousOptionCount ?? 0}`,
            `- unmatched options left unchanged: ${report.unmatchedOptionCount ?? 0}`,
            `- source rows used: ${(report.sourceRowsUsed || []).length}`,
          ].join('\n');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary + '\n');
          NODE
