name: Temporary Canonical Sales Range Patcher

on:
  push:
    branches:
      - fix/canonical-sales-source-range-filter

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[range-filter-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/canonical-sales-source-range-filter
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Patch pinned analysis window through collectors
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, got {count}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          sync = 'src/lib/productMasterShoplingSalesEventSync.ts'
          replace_once(
              sync,
              '  PRODUCT_MASTER_SALES_EVENT_FORMAT,\n  PRODUCT_MASTER_SALES_EVENT_SOURCE,\n',
              '  PRODUCT_MASTER_SALES_EVENT_FORMAT,\n  PRODUCT_MASTER_SALES_EVENT_SOURCE,\n  PRODUCT_MASTER_SALES_EVENT_ANALYSIS_DAYS,\n',
          )
          replace_once(
              sync,
              'const ANALYSIS_DAYS = 360;',
              'const ANALYSIS_DAYS = PRODUCT_MASTER_SALES_EVENT_ANALYSIS_DAYS;',
          )
          replace_once(
              sync,
              '      const summary = aggregateProductMasterShoplingSalesEventChunk(\n        raw,\n        planning,\n        nextRange,\n      );',
              '      const summary = aggregateProductMasterShoplingSalesEventChunk(\n        raw,\n        planning,\n        nextRange,\n        { analysisAsOf: request.analysisAsOf },\n      );',
          )

          evidence = 'src/lib/stage8DemandMismatchEvidenceEngine.ts'
          replace_once(
              evidence,
              '    const canonicalChunk = aggregateProductMasterShoplingSalesEventChunk(\n      [raw],\n      planning,\n      range,\n      analysisAsOf,\n    );',
              '    const canonicalChunk = aggregateProductMasterShoplingSalesEventChunk(\n      [raw],\n      planning,\n      range,\n      { syncedAt: analysisAsOf, analysisAsOf },\n    );',
          )

          engine_test = 'tests/productMasterShoplingSalesEventEngine.test.mjs'
          p = Path(engine_test)
          text = p.read_text(encoding='utf-8')
          addition = '''\n\ntest("Shopling source range is not treated as the order-date truth", () => {\n  assert.match(engine, /PRODUCT_MASTER_SALES_EVENT_ANALYSIS_DAYS = 360/);\n  assert.match(engine, /insideGlobalAnalysisWindow/);\n  assert.match(engine, /options\\.analysisAsOf/);\n  assert.doesNotMatch(engine, /inDateRange\\(orderedAt, range\\)/);\n  assert.match(engine, /Cross-range duplicates are[\\s\\S]*externalId/);\n});\n'''
          marker = '\ntest("managed B-code scope is preserved and old non-B rows are ignored", () => {'
          if addition.strip() not in text:
              if marker not in text:
                  raise SystemExit('engine test insertion marker missing')
              text = text.replace(marker, addition + marker, 1)
          p.write_text(text, encoding='utf-8')

          sync_test = 'tests/productMasterShoplingSalesEventSync.test.mjs'
          p = Path(sync_test)
          text = p.read_text(encoding='utf-8')
          old = '  assert.match(sync, /const ANALYSIS_DAYS = 360/);'
          new = '  assert.match(sync, /const ANALYSIS_DAYS = PRODUCT_MASTER_SALES_EVENT_ANALYSIS_DAYS/);'
          if text.count(old) != 1:
              raise SystemExit('sync test analysis constant assertion missing')
          text = text.replace(old, new, 1)
          marker = '\ntest("collection is read-only and business write waits for explicit canary/full", () => {'
          addition = '''\n\ntest("each source chunk applies the one pinned analysisAsOf instead of its fetch partition", () => {\n  assert.match(sync, /aggregateProductMasterShoplingSalesEventChunk\\([\\s\\S]*analysisAsOf: request\\.analysisAsOf/);\n  assert.doesNotMatch(sync, /aggregateProductMasterShoplingSalesEventChunk\\([\\s\\S]*inDateRange/);\n});\n'''
          if addition.strip() not in text:
              if marker not in text:
                  raise SystemExit('sync test insertion marker missing')
              text = text.replace(marker, addition + marker, 1)
          p.write_text(text, encoding='utf-8')
      - name: Focused tests
        run: >-
          node --experimental-strip-types --test
          tests/productMasterShoplingSalesEventEngine.test.mjs
          tests/productMasterShoplingSalesEventSync.test.mjs
          tests/stage8DemandMismatchEvidence.test.mjs
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://price-auth-build-check.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_price_auth_build_check
          PRICE_ADJUSTMENT_ENGINE_INTEGRATION_SECRET: ci-price-adjustment-secret
          PRICE_ADJUSTMENT_AUTOMATION_OWNER_ID: 0c23a96b-1cda-44b6-9c08-1fa1c1b45a36
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/productMasterShoplingSalesEventSync.ts src/lib/stage8DemandMismatchEvidenceEngine.ts tests/productMasterShoplingSalesEventEngine.test.mjs tests/productMasterShoplingSalesEventSync.test.mjs
          git commit -m "Use pinned analysis window for canonical sales events [range-filter-patched]"
          git push origin HEAD:fix/canonical-sales-source-range-filter
