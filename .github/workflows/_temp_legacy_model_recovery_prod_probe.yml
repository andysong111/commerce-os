name: Temporary Legacy Model Recovery Production Probe

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Wait for production legacy model recovery page
        shell: bash
        run: |
          set -euo pipefail
          url='https://commerce-os-ops-center.vercel.app/stage8-purchase-candidate-legacy-model-recovery'
          ready=0
          for i in $(seq 1 75); do
            body="$(mktemp)"
            out="$(curl -L -sS --connect-timeout 10 --max-time 180 -o "$body" -w '%{http_code} %{time_total}' "$url" || true)"
            http="$(echo "$out" | awk '{print $1}')"
            elapsed="$(echo "$out" | awk '{print $2}')"
            text="$(cat "$body" | python -c 'import html,re,sys; raw=sys.stdin.read(); raw=re.sub(r"<script[\s\S]*?</script>"," ",raw,flags=re.I); raw=re.sub(r"<style[\s\S]*?</style>"," ",raw,flags=re.I); raw=re.sub(r"<[^>]+>"," ",raw); print(re.sub(r"\s+"," ",html.unescape(raw)).strip()[:300000])')"
            echo "PROBE $i HTTP=$http ELAPSED=${elapsed}s"
            if [ "$http" = '200' ] && echo "$text" | grep -q '발주후보 aaa 모델번호 안전 복구'; then
              echo '--- LEGACY MODEL RECOVERY PRODUCTION ---'
              echo "$text"
              echo "ELAPSED_SECONDS=$elapsed"
              echo "$text" | grep -q 'READY_READ_ONLY'
              echo "$text" | grep -q '발주후보 42개'
              echo "$text" | grep -q 'EXACT 복구 5개'
              echo "$text" | grep -q '미복구 37개'
              echo "$text" | grep -q '충돌 0개'
              echo "$text" | grep -q 'Business write 0 · READ ONLY'
              echo "$text" | grep -q 'DIRECT EVIDENCE ONLY · NO NAME-ONLY GUESSING'
              echo "$text" | grep -q 'BGB1-1 LEGACY-BGB1-1 aaa266 RECOVERED_EXACT'
              echo "$text" | grep -q 'BGD2-1 LEGACY-BGD2-1 aaa409 RECOVERED_EXACT'
              echo "$text" | grep -q 'BGG1-1 LEGACY-BGG1-1 aaa316 RECOVERED_EXACT'
              ready=1
              break
            fi
            sleep 8
          done
          test "$ready" = '1'
