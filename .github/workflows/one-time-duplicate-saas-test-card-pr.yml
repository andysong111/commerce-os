name: One-time SaaS test card replacement on PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/duplicate-saas-test-card' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/duplicate-saas-test-card
          fetch-depth: 0

      - name: Apply exact SaaS card duplication
        shell: python
        run: |
          from pathlib import Path
          import re

          registry_path = Path("src/lib/moduleRegistry.ts")
          registry = registry_path.read_text(encoding="utf-8")
          new_id = 'detail-page-studio-saas-test'
          if new_id not in registry:
              start_marker = '  {\n    id: "detail-page-studio",'
              next_marker = '  {\n    id: "detail-page-studio-launch-connector",'
              start = registry.index(start_marker)
              end = registry.index(next_marker, start)
              original = registry[start:end]
              duplicate = (original
                  .replace('id: "detail-page-studio"', 'id: "detail-page-studio-saas-test"', 1)
                  .replace('title: "Commerce OS Detail Page Studio · SaaS 전용"', 'title: "Commerce OS Detail Page Studio · SaaS(테스트버전)"', 1)
                  .replace('navigationLabel: "상세페이지 스튜디오 · SaaS 전용"', 'navigationLabel: "상세페이지 스튜디오 · SaaS(테스트버전)"', 1)
              )
              registry = registry[:end] + duplicate + registry[end:]
              registry_path.write_text(registry, encoding="utf-8")

          workspace_path = Path("src/lib/opsWorkspace.ts")
          workspace = workspace_path.read_text(encoding="utf-8")
          if '"detail-page-studio-saas-test"' not in workspace:
              workspace, group_count = re.subn(
                  r'moduleIds:\s*\["detail-page-studio",\s*"keyword-engine",\s*"keyword-review-queue"\],',
                  'moduleIds: [\n      "detail-page-studio",\n      "detail-page-studio-saas-test",\n      "keyword-engine",\n      "keyword-review-queue",\n    ],',
                  workspace,
                  count=1,
              )
              workspace, command_count = re.subn(
                  r'moduleIds:\s*\["detail-page-studio",\s*"detail-page-studio-launch-connector",\s*"detail-page-ai-review"\],',
                  'moduleIds: [\n      "detail-page-studio",\n      "detail-page-studio-saas-test",\n      "detail-page-studio-launch-connector",\n      "detail-page-ai-review",\n    ],',
                  workspace,
                  count=1,
              )
              if group_count != 1 or command_count != 1:
                  raise SystemExit(f"Ops workspace replacement failed: group={group_count}, command={command_count}")
              workspace_path.write_text(workspace, encoding="utf-8")

          Path("tests/detailPageSaasTestCard.test.mjs").write_text('''import assert from "node:assert/strict";\nimport { readFile } from "node:fs/promises";\nimport test from "node:test";\n\nconst [registry, workspace] = await Promise.all([\n  readFile("src/lib/moduleRegistry.ts", "utf8"),\n  readFile("src/lib/opsWorkspace.ts", "utf8"),\n]);\n\ntest("SaaS test card exactly reuses the production Detail Page Studio", () => {\n  assert.match(registry, /id: "detail-page-studio-saas-test"/);\n  assert.match(registry, /title: "Commerce OS Detail Page Studio · SaaS\\(테스트버전\\)"/);\n  const routes = registry.match(/route: "https:\\/\\/commerce-os-detail-page-studio\\.vercel\\.app\\/"/g) ?? [];\n  assert.equal(routes.length, 2);\n});\n\ntest("the removed custom test intake is not registered", () => {\n  assert.doesNotMatch(registry, /title: "상세페이지 스튜디오 테스트버전"/);\n  assert.doesNotMatch(registry, /id: "detail-page-studio-test"/);\n  assert.match(workspace, /"detail-page-studio-saas-test"/);\n});\n''', encoding="utf-8")

      - name: Remove temporary files and commit
        run: |
          rm -f .github/workflows/one-time-duplicate-saas-test-card.yml
          rm -f .github/workflows/one-time-duplicate-saas-test-card-pr.yml
          rm -f tmp/duplicate-saas-test-card.trigger
          rmdir tmp 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace custom test studio with duplicated SaaS card"
          git push origin HEAD:fix/duplicate-saas-test-card
