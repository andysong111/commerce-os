name: Product Decision Engine CI

on:
  pull_request:
    paths:
      - "src/lib/productDecisionEngine/**"
      - "tests/productDecisionEngine.test.mjs"
      - ".github/workflows/product-decision-engine-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: product-decision-engine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Lint product decision engine
        run: >-
          npx eslint
          src/lib/productDecisionEngine/*.ts
          tests/productDecisionEngine.test.mjs
      - name: Run product decision engine parity tests
        run: >-
          node --experimental-strip-types --test
          tests/productDecisionEngine.test.mjs
      - name: Build Ops Center
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://product-decision-build-check.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_product_decision_build_check
