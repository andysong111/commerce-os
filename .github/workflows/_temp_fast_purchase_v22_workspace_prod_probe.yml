name: Temporary Fast Purchase V2.2 Workspace Production Probe

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify production fast purchase V2.2 workspace
        shell: bash
        run: |
          set -euo pipefail
          url='https://commerce-os-ops-center.vercel.app/fast-purchase-mvp'
          ready=0
          for i in $(seq 1 60); do
            body="$(mktemp)"
            out="$(curl -L -sS --connect-timeout 10 --max-time 120 -o "$body" -w '%{http_code} %{time_total}' "$url" || true)"
            http="$(echo "$out" | awk '{print $1}')"
            elapsed="$(echo "$out" | awk '{print $2}')"
            text="$(cat "$body" | python -c 'import html,re,sys; raw=sys.stdin.read(); raw=re.sub(r"<script[\s\S]*?</script>"," ",raw,flags=re.I); raw=re.sub(r"<style[\s\S]*?</style>"," ",raw,flags=re.I); raw=re.sub(r"<[^>]+>"," ",raw); print(re.sub(r"\s+"," ",html.unescape(raw)).strip()[:700000])')"
            echo "PROBE $i HTTP=$http ELAPSED=${elapsed}s"
            if [ "$http" = '200' ] && echo "$text" | grep -q 'FAST USE · PROVISIONAL V2.2 · OPERATE NOW'; then
              echo '--- FAST PURCHASE V2.2 WORKSPACE PRODUCTION ---'
              echo "$text"
              echo "ELAPSED_SECONDS=$elapsed"
              echo "$text" | grep -q '오늘 발주 검토 작업대'
              echo "$text" | grep -q '주문예정 CSV'
              echo "$text" | grep -q '브라우저 판단 초기화'
              echo "$text" | grep -q '수동 발주만 · 자동주문 0'
              echo "$text" | grep -q '운영 커버리지 42'
              echo "$text" | grep -q '현재 브라우저에만 저장됩니다'
              ready=1
              break
            fi
            sleep 6
          done
          test "$ready" = '1'
