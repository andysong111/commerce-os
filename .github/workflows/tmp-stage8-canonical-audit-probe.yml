name: Temporary Stage8 Canonical Audit Probe

on:
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read production canonical sales audit
        shell: bash
        run: |
          set -euo pipefail
          text="$(curl -L -sS --connect-timeout 10 --max-time 60 \
            'https://commerce-os-ops-center.vercel.app/stage8-canonical-sales-audit' \
            | python -c 'import html,re,sys; raw=sys.stdin.read(); raw=re.sub(r"<script[\s\S]*?</script>"," ",raw,flags=re.I); raw=re.sub(r"<style[\s\S]*?</style>"," ",raw,flags=re.I); raw=re.sub(r"<[^>]+>"," ",raw); print(re.sub(r"\s+"," ",html.unescape(raw)).strip()[:24000])')"
          echo "$text"
          echo "$text" | grep -q 'Canonical 판매원장 구조 정상'
          echo "$text" | grep -q '전체 이벤트 9,386'
          echo "$text" | grep -q '활성 정상판매 9,149'
          echo "$text" | grep -q '활성 tombstone 236'
          echo "$text" | grep -q '비활성 관리 역사 1'
          echo "$text" | grep -q '비활성 역사 정상판매 1'
          echo "$text" | grep -q '실제 orphan 0'
          echo "$text" | grep -q '분류합계 9,386'
          echo "$text" | grep -q '전체분류 COMPLETE'
