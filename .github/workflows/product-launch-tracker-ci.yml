name: Product Launch Tracker CI

on:
  pull_request:
    paths:
      - 'public/product-launch-tracker-app/**'
      - 'src/app/api/product-launch-tracker/**'
      - 'src/app/detail-page-ai-review/**'
      - 'src/app/api/shopling-categories/**'
      - 'src/app/shopling-category-review-queue/**'
      - 'src/components/AppShell.tsx'
      - 'src/components/OpsCategoryUpdateCancelControl.tsx'
      - 'src/components/OpsLocalCategoryStatusBridge.tsx'
      - 'src/components/OpsWorkAssistant.tsx'
      - 'src/components/detail-page-ai-review/**'
      - 'src/components/shopling-category-review/**'
      - 'src/lib/detailPageManualDecision.ts'
      - 'src/lib/extendedModuleRegistry.ts'
      - 'src/lib/opsWorkspace.ts'
      - 'src/lib/productLaunchTracker*.ts'
      - 'src/lib/shoplingCategory*.ts'
      - 'src/lib/openAiStructuredOutput.ts'
      - 'supabase/migrations/*product_launch*.sql'
      - 'tests/productLaunchTracker*.test.mjs'
      - 'tests/detailPageAssetStorageRetry.test.mjs'
      - 'tests/detailPageManualDecision.test.mjs'
      - 'tests/shoplingCategory*.test.mjs'
      - 'next.config.ts'
      - '.github/workflows/product-launch-tracker-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Run product launch tracker tests
        run: >-
          npx tsx --test
          tests/productLaunchTrackerEntry.test.mjs
          tests/productLaunchTrackerSorting.test.mjs
          tests/productLaunchTrackerShopling.test.mjs
          tests/productLaunchTrackerCategoryCancel.test.mjs
          tests/productLaunchTrackerSingleRowAdd.test.mjs
          tests/productLaunchTrackerTableOps.test.mjs
          tests/productLaunchTrackerChinaProductLinks.test.mjs
          tests/productLaunchTrackerChinaOrderMappingActiveUi.test.mjs
          tests/productLaunchTrackerNormalizedCutover.test.mjs
          tests/detailPageAssetStorageRetry.test.mjs
          tests/detailPageManualDecision.test.mjs
          tests/shoplingCategoryCatalog.test.mjs
          tests/shoplingCategoryRunStatus.test.mjs
          tests/shoplingCategoryLocalUpdate.test.mjs
          tests/shoplingCategorySupabaseStore.test.mjs
          tests/shoplingCategoryReviewQueue.test.mjs
          tests/shoplingCategoryAiDelivery.test.mjs
          tests/shoplingCategoryCandidateChoices.test.mjs
          tests/shoplingCategoryCoreNounReview.test.mjs
          tests/shoplingCategoryJsonRecovery.test.mjs
