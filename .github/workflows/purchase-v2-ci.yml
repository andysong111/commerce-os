name: Purchase V2 CI

on:
  push:
    branches:
      - feat/purchase-v2-stockout-reset-20260905
  pull_request:
    paths:
      - "src/lib/productDecisionEngine/purchaseV2.ts"
      - "src/lib/purchaseRecommendationV2.ts"
      - "src/lib/purchaseV2Feedback.ts"
      - "src/lib/purchaseRecommendationFinalization.ts"
      - "src/lib/inventoryLifecycleLedger.ts"
      - "src/app/api/fast-purchase/v2/**"
      - "src/app/api/inventory-lifecycle/**"
      - "src/app/api/china-order-ledger/events/route.ts"
      - "src/app/api/shopling-inventory-lifecycle-extension/**"
      - "src/app/china-order-manager/**"
      - "src/components/china-order-manager/**"
      - "public/shopling-inventory-lifecycle/**"
      - "tests/purchaseV2*.test.mjs"
      - "tests/inventoryLifecycleLedger.test.mjs"
      - "tests/shoplingInventoryLifecycleExtension.test.mjs"
      - "tests/receiptSellingRestoreContract.test.mjs"
      - ".github/workflows/purchase-v2-ci.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: purchase-v2-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply one-time release finalizers
        if: github.event_name != 'pull_request'
        run: |
          node scripts/finalize-purchase-v2-branch-3.mjs
          node scripts/finalize-purchase-v2-branch-4.mjs
          node scripts/finalize-purchase-v2-branch-5.mjs
          node scripts/finalize-purchase-v2-branch-6.mjs

      - name: Check extension JavaScript syntax
        run: |
          node --check public/shopling-inventory-lifecycle/background.js
          node --check public/shopling-inventory-lifecycle/content-ops.js
          node --check public/shopling-inventory-lifecycle/content-shopling.js
          node --check public/shopling-inventory-lifecycle/popup.js

      - name: Verify V2 demand, feedback, exact inventory and allocation
        run: >-
          npx tsx --test
          tests/purchaseV2.test.mjs
          tests/purchaseV2Feedback.test.mjs
          tests/inventoryLifecycleLedger.test.mjs

      - name: Verify persistence, receipt restore, UI and extension contracts
        run: >-
          node --test
          tests/purchaseV2PersistenceContract.test.mjs
          tests/shoplingInventoryLifecycleExtension.test.mjs
          tests/receiptSellingRestoreContract.test.mjs

      - name: Lint
        run: npm run lint --if-present

      - name: Production build
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: npm run build

      - name: Commit finalized source layout
        if: github.event_name != 'pull_request'
        run: |
          if git diff --quiet; then
            echo "No finalizer output to commit."
            exit 0
          fi
          git config user.name "commerce-os-purchase-v2-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "[purchase-v2-bot] finalize purchase V2 release source"
          git push origin HEAD:feat/purchase-v2-stockout-reset-20260905
