name: Temporary Stage8 Candidate Demand Parity Runner

on:
  push:
    branches:
      - ops/stage8-candidate-parity-run-20260809
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  parity:
    if: >-
      ${{
        (github.event_name == 'push' && github.ref_name == 'ops/stage8-candidate-parity-run-20260809') ||
        (github.event_name == 'pull_request' && github.head_ref == 'ops/stage8-candidate-parity-run-20260809')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Wait for corrected candidate and compare without Product Master writes
        shell: bash
        run: |
          set -euo pipefail
          base='https://commerce-os-ops-center.vercel.app'
          page="$base/stage8-candidate-demand-parity"
          sales_api="$base/api/product-master/shopling-sales-events"
          parity_api="$base/api/stage8/candidate-demand-parity"

          ready=0
          for i in $(seq 1 120); do
            page_code="$(curl -L -sS --connect-timeout 10 --max-time 60 -o /tmp/candidate-page -w '%{http_code}' "$page" || true)"
            sales_file="$(mktemp)"
            sales_code="$(curl -L -sS --connect-timeout 10 --max-time 60 -o "$sales_file" -w '%{http_code}' "$sales_api" -H "origin: $base" -H "referer: $page" || true)"
            sales_state=''
            if [ "$sales_code" = '200' ]; then
              sales_state="$(SALES_FILE="$sales_file" python - <<'PY'
          import json, os
          with open(os.environ['SALES_FILE'], encoding='utf-8') as f:
              data=json.load(f)
          s=data.get('status') or {}
          print(s.get('state') or '')
          PY
          )"
            fi
            echo "WAIT $i page=$page_code sales=$sales_state"
            if [ "$page_code" = '200' ] && grep -q 'Product Master 쓰기 전 후보 판매수요 비교' /tmp/candidate-page && { [ "$sales_state" = 'READY_CANARY' ] || [ "$sales_state" = 'READY_FULL' ]; }; then
              ready=1
              break
            fi
            if [ "$sales_state" = 'BLOCKED' ]; then
              cat "$sales_file"
              echo 'Corrected canonical sales candidate is blocked; candidate parity will not start.' >&2
              exit 2
            fi
            sleep 5
          done
          test "$ready" = '1'

          start_file="$(mktemp)"
          start_code="$(curl -L -sS --connect-timeout 10 --max-time 180 \
            -o "$start_file" -w '%{http_code}' \
            -X POST "$parity_api" \
            -H 'content-type: application/json' \
            -H "origin: $base" -H "referer: $page" \
            --data '{"action":"start"}')"
          echo "START HTTP $start_code"
          cat "$start_file"
          test "$start_code" = '200' -o "$start_code" = '202'
          START_FILE="$start_file" python - <<'PY'
          import json, os
          with open(os.environ['START_FILE'], encoding='utf-8') as f:
              data=json.load(f)
          assert data.get('ok') is True, data
          PY

          for i in $(seq 1 90); do
            status_file="$(mktemp)"
            status_code="$(curl -L -sS --connect-timeout 10 --max-time 60 -o "$status_file" -w '%{http_code}' "$parity_api" -H "origin: $base" -H "referer: $page")"
            test "$status_code" = '200'
            state="$(STATUS_FILE="$status_file" python - <<'PY'
          import json, os
          with open(os.environ['STATUS_FILE'], encoding='utf-8') as f:
              data=json.load(f)
          print((data.get('status') or {}).get('state') or '')
          PY
          )"
            echo "STATUS $i $state"
            if [ "$state" = 'MATCH' ] || [ "$state" = 'MISMATCH' ] || [ "$state" = 'FAILED' ]; then
              STATUS_FILE="$status_file" python - <<'PY'
          import json, os, sys
          with open(os.environ['STATUS_FILE'], encoding='utf-8') as f:
              data=json.load(f)
          status=data.get('status') or {}
          report=status.get('report') or {}
          summary={
              'requestId': status.get('requestId'),
              'state': status.get('state'),
              'candidateSalesRequestId': report.get('candidateSalesRequestId'),
              'analysisAsOf': report.get('analysisAsOf'),
              'candidateRowCount': report.get('candidateRowCount'),
              'directManagedRowCount': report.get('directManagedRowCount'),
              'sharedRowCount': report.get('sharedRowCount'),
              'exactRowCount': report.get('exactRowCount'),
              'unitMismatchCount': report.get('unitMismatchCount'),
              'revenueMismatchCount': report.get('revenueMismatchCount'),
              'missingDirectCount': report.get('missingDirectCount'),
              'directOnlyManagedCount': report.get('directOnlyManagedCount'),
              'directFetchedRows': report.get('directFetchedRows'),
              'directAcceptedRows': report.get('directAcceptedRows'),
              'directUnmappedRows': report.get('directUnmappedRows'),
              'candidateManagedUnits': report.get('candidateManagedUnits'),
              'directManagedUnits': report.get('directManagedUnits'),
              'candidateManagedRevenue': report.get('candidateManagedRevenue'),
              'directManagedRevenue': report.get('directManagedRevenue'),
              'candidateMinusDirectUnits': report.get('candidateMinusDirectUnits'),
              'candidateMinusDirectRevenue': report.get('candidateMinusDirectRevenue'),
              'blockerCount': report.get('blockerCount'),
              'candidateEventFingerprint': report.get('candidateEventFingerprint'),
              'candidatePlanFingerprint': report.get('candidatePlanFingerprint'),
              'parityFingerprint': report.get('parityFingerprint'),
              'missingDirectBarcodes': report.get('missingDirectBarcodes'),
              'directOnlyManagedBarcodes': report.get('directOnlyManagedBarcodes'),
          }
          print('FINAL_CANDIDATE_PARITY', json.dumps(summary, ensure_ascii=False))
          print('MISMATCH_SAMPLES', json.dumps((report.get('mismatchSamples') or [])[:50], ensure_ascii=False))
          if status.get('state') == 'FAILED':
              raise SystemExit(2)
          PY
              exit 0
            fi

            step_file="$(mktemp)"
            step_code="$(curl -L -sS --connect-timeout 10 --max-time 290 \
              -o "$step_file" -w '%{http_code}' \
              -X POST "$parity_api" \
              -H 'content-type: application/json' \
              -H "origin: $base" -H "referer: $page" \
              --data '{"action":"run-next"}' || true)"
            echo "STEP $i HTTP $step_code"
            if [ "$step_code" != '200' ]; then
              cat "$step_file"
              sleep 10
              continue
            fi
            STEP_FILE="$step_file" python - <<'PY'
          import json, os, sys
          with open(os.environ['STEP_FILE'], encoding='utf-8') as f:
              data=json.load(f)
          if data.get('ok') is not True:
              print(data, file=sys.stderr)
              raise SystemExit(1)
          print(json.dumps(data.get('result') or {}, ensure_ascii=False)[:2500])
          PY
            sleep 1
          done

          echo 'Candidate parity runner exhausted before terminal state.' >&2
          exit 1
