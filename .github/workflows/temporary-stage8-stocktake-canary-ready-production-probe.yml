name: Temporary Stage8 Stocktake Canary Ready Production Probe

on:
  push:
    branches:
      - ops/stage8-stocktake-canary-ready-probe-20260809

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read production signed stocktake canary readiness
        shell: bash
        run: |
          set -euo pipefail
          url='https://commerce-os-ops-center.vercel.app/stage8-stocktake-canary'
          body="$(mktemp)"
          code="$(curl -L -sS --connect-timeout 10 --max-time 90 -o "$body" -w '%{http_code}' "$url")"
          text="$(cat "$body" | python -c 'import html,re,sys; raw=sys.stdin.read(); raw=re.sub(r"<script[\s\S]*?</script>"," ",raw,flags=re.I); raw=re.sub(r"<style[\s\S]*?</style>"," ",raw,flags=re.I); raw=re.sub(r"<[^>]+>"," ",raw); print(re.sub(r"\s+"," ",html.unescape(raw)).strip()[:100000])')"
          echo "HTTP $code"
          echo '--- SIGNED STOCKTAKE CANARY READINESS ---'
          echo "$text"
          test "$code" = '200'
          echo "$text" | grep -q '첫 재고실사 1건 적용'
          echo "$text" | grep -q 'READY_FOR_COUNT'
          echo "$text" | grep -q 'BGG1-1'
          echo "$text" | grep -q '최대 write 1 SKU'
          echo "$text" | grep -q '발주 false · 가격 false · 입고원가 false'
