name: Temporary Stage8 Stocktake Canary Ready Production Probe

on:
  push:
    branches:
      - ops/stage8-stocktake-canary-ready-probe-20260809
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  probe:
    if: ${{ github.event_name == 'push' || github.head_ref == 'ops/stage8-stocktake-canary-ready-probe-20260809' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read production signed stocktake canary readiness
        shell: bash
        run: |
          set -euo pipefail
          origin='https://commerce-os-ops-center.vercel.app'
          url="$origin/api/stage8/stocktake-canary"
          body="$(mktemp)"
          code="$(curl -L -sS --connect-timeout 10 --max-time 90 -H "Origin: $origin" -H 'Sec-Fetch-Site: same-origin' -H 'Accept: application/json' -o "$body" -w '%{http_code}' "$url")"
          echo "HTTP $code"
          python - "$body" <<'PY'
          import json,sys
          body=json.load(open(sys.argv[1],encoding='utf-8'))
          r=body.get('readiness') or {}
          safe={
            'ok': body.get('ok'),
            'state': r.get('state'),
            'barcode': r.get('barcode'),
            'modelNo': r.get('modelNo'),
            'currentInventoryQuantity': r.get('currentInventoryQuantity'),
            'inventoryVerification': r.get('inventoryVerification'),
            'inventoryBaselineKind': r.get('inventoryBaselineKind'),
            'productMasterWriteEnabled': r.get('productMasterWriteEnabled'),
            'maxWriteRows': r.get('maxWriteRows'),
            'purchaseWritesEnabled': r.get('purchaseWritesEnabled'),
            'priceWritesEnabled': r.get('priceWritesEnabled'),
            'receiptWritesEnabled': r.get('receiptWritesEnabled'),
          }
          print(json.dumps(safe,ensure_ascii=False,indent=2))
          assert body.get('ok') is True
          assert r.get('state') == 'READY_FOR_COUNT'
          assert r.get('barcode') == 'BGG1-1'
          assert r.get('inventoryVerification') == 'UNVERIFIED'
          assert r.get('inventoryBaselineKind') == 'INITIAL_ZERO'
          assert r.get('productMasterWriteEnabled') is True
          assert r.get('maxWriteRows') == 1
          assert r.get('purchaseWritesEnabled') is False
          assert r.get('priceWritesEnabled') is False
          assert r.get('receiptWritesEnabled') is False
          PY
          test "$code" = '200'
