name: Temporary Provisional Estimate Candidate Production Probe

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Wait for production provisional estimate candidate page
        shell: bash
        run: |
          set -euo pipefail
          url='https://commerce-os-ops-center.vercel.app/stage8-provisional-estimate-candidate'
          ready=0
          for i in $(seq 1 75); do
            body="$(mktemp)"
            out="$(curl -L -sS --connect-timeout 10 --max-time 180 -o "$body" -w '%{http_code} %{time_total}' "$url" || true)"
            http="$(echo "$out" | awk '{print $1}')"
            elapsed="$(echo "$out" | awk '{print $2}')"
            text="$(cat "$body" | python -c 'import html,re,sys; raw=sys.stdin.read(); raw=re.sub(r"<script[\s\S]*?</script>"," ",raw,flags=re.I); raw=re.sub(r"<style[\s\S]*?</style>"," ",raw,flags=re.I); raw=re.sub(r"<[^>]+>"," ",raw); print(re.sub(r"\s+"," ",html.unescape(raw)).strip()[:500000])')"
            echo "PROBE $i HTTP=$http ELAPSED=${elapsed}s"
            if [ "$http" = '200' ] && echo "$text" | grep -q '과거발주 기반 PROVISIONAL 추정재고 후보'; then
              echo '--- PROVISIONAL ESTIMATE CANDIDATE PRODUCTION ---'
              echo "$text"
              echo "ELAPSED_SECONDS=$elapsed"
              echo "$text" | grep -q 'CANDIDATE ≠ CURRENT INVENTORY · READ ONLY'
              echo "$text" | grep -q 'INVENTORY / PURCHASE WRITE 0'
              echo "$text" | grep -q 'BBA2-3'
              echo "$text" | grep -q 'LATEST_ORDER_RESIDUAL_CANDIDATE_READY'
              echo "$text" | grep -q '이 잔여후보는 현재재고가 아닙니다.'
              ready=1
              break
            fi
            sleep 8
          done
          test "$ready" = '1'
