name: Patch canonical sales-event Shopling recovery

on:
  push:
    branches:
      - fix/canonical-sales-event-shopling-recovery

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/canonical-sales-event-shopling-recovery
          fetch-depth: 0
      - name: Add retry attempts and 30 to 7 to 2 day recovery
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/lib/productMasterShoplingSalesEventSync.ts')
          text = path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global text
              if old not in text:
                  raise SystemExit(f'{label}: target not found')
              text = text.replace(old, new, 1)

          replace_once(
'''export const SALES_EVENT_FULL = "PRODUCT_MASTER_SHOPLING_SALES_EVENT_FULL";
export const SALES_EVENT_FAILED = "PRODUCT_MASTER_SHOPLING_SALES_EVENT_FAILED";

const DEFAULT_PRODUCT_MASTER_URL = "https://commerce-os-product-master.vercel.app";
const ANALYSIS_DAYS = 360;
const RANGE_DAYS = 30;
const OPERATION_LIMIT = 500;
const APPLY_BATCH_SIZE = 5_000;''',
'''export const SALES_EVENT_FULL = "PRODUCT_MASTER_SHOPLING_SALES_EVENT_FULL";
export const SALES_EVENT_STEP_FAILURE =
  "PRODUCT_MASTER_SHOPLING_SALES_EVENT_STEP_FAILURE";
export const SALES_EVENT_FAILED = "PRODUCT_MASTER_SHOPLING_SALES_EVENT_FAILED";

export const SALES_EVENT_DEFAULT_CHUNK_DAYS = 30;
export const SALES_EVENT_FALLBACK_CHUNK_DAYS = 7;
export const SALES_EVENT_MINIMUM_CHUNK_DAYS = 2;

const DEFAULT_PRODUCT_MASTER_URL = "https://commerce-os-product-master.vercel.app";
const ANALYSIS_DAYS = 360;
const MAX_STEP_ATTEMPTS = 3;
const OPERATION_LIMIT = 500;
const APPLY_BATCH_SIZE = 5_000;''',
'constants')

          replace_once(
'''  planningGeneratedAt: string;
  planningContentFingerprint: string;
  ranges: ShoplingDateRange[];
  createdAt: string;''',
'''  planningGeneratedAt: string;
  planningContentFingerprint: string;
  chunkDays: number;
  supersedesRequestId: string | null;
  ranges: ShoplingDateRange[];
  createdAt: string;''',
'request type')

          replace_once(
'''  completedRanges: number;
  totalRanges: number;
  progress: number;''',
'''  completedRanges: number;
  totalRanges: number;
  chunkDays: number;
  progress: number;''',
'status chunkDays')

          replace_once(
'''    planningGeneratedAt,
    planningContentFingerprint,
    ranges,
    createdAt: iso(value.createdAt) || analysisAsOf,''',
'''    planningGeneratedAt,
    planningContentFingerprint,
    chunkDays: Math.max(
      SALES_EVENT_MINIMUM_CHUNK_DAYS,
      Math.min(
        SALES_EVENT_DEFAULT_CHUNK_DAYS,
        Math.round(number(value.chunkDays)) || SALES_EVENT_DEFAULT_CHUNK_DAYS,
      ),
    ),
    supersedesRequestId: text(value.supersedesRequestId) || null,
    ranges,
    createdAt: iso(value.createdAt) || analysisAsOf,''',
'requestFromRow fields')

          replace_once(
'''  const [chunks, reports, canaries, fulls, failures] = await Promise.all([
    readOperations(SALES_EVENT_CHUNK, correlationId),
    readOperations(SALES_EVENT_REPORT, correlationId, 10),
    readOperations(SALES_EVENT_CANARY, correlationId, 10),
    readOperations(SALES_EVENT_FULL, correlationId, 10),
    readOperations(SALES_EVENT_FAILED, correlationId, 10),
  ]);
  return { correlationId, chunks, reports, canaries, fulls, failures };''',
'''  const [chunks, reports, canaries, fulls, stepFailures, failures] =
    await Promise.all([
      readOperations(SALES_EVENT_CHUNK, correlationId),
      readOperations(SALES_EVENT_REPORT, correlationId, 10),
