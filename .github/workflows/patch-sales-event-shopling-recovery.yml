        requestId: request.requestId,
        range: nextRange,
        fetchedRows: summary.fetchedRows,
        eventRows: summary.eventRows,
        unmappedRows: summary.unmappedRows,
      };
    } catch (error) {
      const message = await storeFailure(request, `orders:${rangeKey(nextRange)}`, error);
      return { processed: true, state: "FAILED" as const, requestId: request.requestId, message };
    }
  }'''
          new_block = '''  if (nextRange) {
    const key = rangeKey(nextRange);
    const priorAttempts = operations.stepFailures
      .map(stepFailureAttempt)
      .filter((failure) => failure.rangeKey === key);
    if (priorAttempts.length >= MAX_STEP_ATTEMPTS) {
      const message = `${key} Shopling 주문 조회가 ${MAX_STEP_ATTEMPTS}회 실패했습니다. 최종 원인: ${priorAttempts[0]?.message || "확인 필요"}`;
      await storeTerminalFailure(request, `orders:${key}`, message);
      return {
        processed: false,
        state: "FAILED" as const,
        requestId: request.requestId,
        message,
      };
    }
    try {
      const config = shoplingReadConfigFromEnv(shoplingEnvironment());
      const raw = await new ShoplingReadClient(config).read("orders", nextRange);
      const summary = aggregateProductMasterShoplingSalesEventChunk(
        raw,
        planning,
        nextRange,
      );
      await storeOperation({
        operationType: SALES_EVENT_CHUNK,
        sourceEventId: `sales-event-chunk:${request.requestId}:${key}`,
        correlationId: requestCorrelationId(request.requestId),
        inputSnapshot: {
          requestId: request.requestId,
          range: nextRange,
          rangeKey: key,
          chunkDays: request.chunkDays,
          planningContentFingerprint: request.planningContentFingerprint,
        },
        resultSnapshot: summary,
      });
      return {
        processed: true,
        state: "RUNNING" as const,
        requestId: request.requestId,
        range: nextRange,
        fetchedRows: summary.fetchedRows,
        eventRows: summary.eventRows,
        unmappedRows: summary.unmappedRows,
      };
    } catch (error) {
      const attempt = priorAttempts.length + 1;
      const message = await storeStepFailure(request, nextRange, attempt, error);
      if (attempt >= MAX_STEP_ATTEMPTS) {
        await storeTerminalFailure(request, `orders:${key}`, message);
        return {
          processed: true,
          state: "FAILED" as const,
          requestId: request.requestId,
          attempt,
          range: nextRange,
          message,
        };
      }
      return {
        processed: false,
        state: "RUNNING" as const,
        retryPending: true,
        requestId: request.requestId,
        attempt,
        range: nextRange,
        message,
      };
    }
  }'''
          replace_once(old_block, new_block, 'next range block')

