          replace_once(
'''export function createSalesEventSyncRequestPlan(
  requestId: string,
  planning: Awaited<ReturnType<typeof loadProductPlanningSnapshot>>,
  analysisAsOf = new Date().toISOString(),
): SalesEventSyncRequest {
  const asOf = new Date(analysisAsOf);
  if (!Number.isFinite(asOf.valueOf())) throw new Error("SALES_EVENT_AS_OF_INVALID");
  const start = new Date(asOf.valueOf() - ANALYSIS_DAYS * 24 * 60 * 60 * 1000);
  const analysisStartDate = dateOnly(start);
  const analysisEndDate = dateOnly(asOf);
  return {
    requestId,
    analysisAsOf: asOf.toISOString(),
    analysisStartDate,
    analysisEndDate,
    planningGeneratedAt: planning.generatedAt,
    planningContentFingerprint: planning.contentFingerprint,
    ranges: splitShoplingDateRange(analysisStartDate, analysisEndDate, RANGE_DAYS),
    createdAt: new Date().toISOString(),
  };
}

export async function createProductMasterShoplingSalesEventSyncRequest() {
  shoplingReadConfigFromEnv(shoplingEnvironment());
  const planning = await loadProductPlanningSnapshot();
  const request = createSalesEventSyncRequestPlan(crypto.randomUUID(), planning);
  await storeOperation({
    operationType: SALES_EVENT_REQUEST,
    sourceEventId: `sales-event-request:${request.requestId}`,
    correlationId: requestCorrelationId(request.requestId),
    inputSnapshot: request,
    resultSnapshot: {
      accepted: true,
      state: "QUEUED",
      message: "최근 360일 Shopling 주문행을 정확한 timestamp 판매 이벤트로 읽습니다.",
    },
    occurredAt: request.createdAt,
  });
  return request;
}''',
'''export function createSalesEventSyncRequestPlan(
  requestId: string,
  planning: Awaited<ReturnType<typeof loadProductPlanningSnapshot>>,
  analysisAsOf = new Date().toISOString(),
  chunkDays = SALES_EVENT_DEFAULT_CHUNK_DAYS,
  supersedesRequestId: string | null = null,
): SalesEventSyncRequest {
  const asOf = new Date(analysisAsOf);
  if (!Number.isFinite(asOf.valueOf())) throw new Error("SALES_EVENT_AS_OF_INVALID");
  const normalizedChunkDays = Math.max(
    SALES_EVENT_MINIMUM_CHUNK_DAYS,
    Math.min(SALES_EVENT_DEFAULT_CHUNK_DAYS, Math.round(chunkDays)),
  );
  const start = new Date(asOf.valueOf() - ANALYSIS_DAYS * 24 * 60 * 60 * 1000);
  const analysisStartDate = dateOnly(start);
  const analysisEndDate = dateOnly(asOf);
  return {
    requestId,
    analysisAsOf: asOf.toISOString(),
    analysisStartDate,
    analysisEndDate,
    planningGeneratedAt: planning.generatedAt,
    planningContentFingerprint: planning.contentFingerprint,
    chunkDays: normalizedChunkDays,
    supersedesRequestId,
    ranges: splitShoplingDateRange(
      analysisStartDate,
      analysisEndDate,
      normalizedChunkDays,
    ),
    createdAt: new Date().toISOString(),
  };
}

export async function createProductMasterShoplingSalesEventSyncRequest(options: {
  chunkDays?: number;
  supersedesRequestId?: string | null;
  analysisAsOf?: string;
} = {}) {
  shoplingReadConfigFromEnv(shoplingEnvironment());
  const planning = await loadProductPlanningSnapshot();
  const request = createSalesEventSyncRequestPlan(
    crypto.randomUUID(),
    planning,
    options.analysisAsOf ?? new Date().toISOString(),
    options.chunkDays ?? SALES_EVENT_DEFAULT_CHUNK_DAYS,
    text(options.supersedesRequestId) || null,
  );
  await storeOperation({
    operationType: SALES_EVENT_REQUEST,
    sourceEventId: `sales-event-request:${request.requestId}`,
    correlationId: requestCorrelationId(request.requestId),
    inputSnapshot: request,
    resultSnapshot: {
      accepted: true,
      state: "QUEUED",
      message: `최근 360일 Shopling 주문행을 ${request.chunkDays}일 조회구간으로 정확한 timestamp 판매 이벤트에 재구성합니다.`,
    },
    occurredAt: request.createdAt,
  });
  return request;
}

function recoveryChunkDays(request: SalesEventSyncRequest) {
  if (request.chunkDays > SALES_EVENT_FALLBACK_CHUNK_DAYS) {
    return SALES_EVENT_FALLBACK_CHUNK_DAYS;
  }
  if (request.chunkDays > SALES_EVENT_MINIMUM_CHUNK_DAYS) {
    return SALES_EVENT_MINIMUM_CHUNK_DAYS;
  }
  return null;
}

export async function recoverProductMasterShoplingSalesEventSyncRequest() {
  const current = await latestRequest();
  if (!current) return null;
  const chunkDays = recoveryChunkDays(current);
  if (chunkDays === null) return null;
  return createProductMasterShoplingSalesEventSyncRequest({
    chunkDays,
    supersedesRequestId: current.requestId,
    analysisAsOf: current.analysisAsOf,
  });
}''',
'plan and create request')

          replace_once(
'''async function storeFailure(request: SalesEventSyncRequest, stage: string, error: unknown) {
  const message = safeMessage(error);
  await storeOperation({
    operationType: SALES_EVENT_FAILED,
    sourceEventId: `sales-event-failed:${request.requestId}:${encodeURIComponent(stage)}`,
    correlationId: requestCorrelationId(request.requestId),
    status: "FAILED",
    inputSnapshot: { requestId: request.requestId, stage },
    resultSnapshot: { requestId: request.requestId, stage, message },
    errorMessage: message,
  });
  return message;
}''',
'''function stepFailureAttempt(row: OperationRow) {
  const input = object(row.input_snapshot);
  return {
    rangeKey: text(input.rangeKey),
    attempt: Math.max(0, Math.round(number(input.attempt))),
    message: safeMessage(
      row.error_message || object(row.result_snapshot).message,
    ),
  };
}

async function storeStepFailure(
  request: SalesEventSyncRequest,
  range: ShoplingDateRange,
  attempt: number,
  error: unknown,
) {
  const key = rangeKey(range);
  const message = safeMessage(error);
  await storeOperation({
    operationType: SALES_EVENT_STEP_FAILURE,
    sourceEventId: `sales-event-step-failure:${request.requestId}:${key}:${attempt}`,
    correlationId: requestCorrelationId(request.requestId),
    status: "FAILED",
    inputSnapshot: {
      requestId: request.requestId,
      range,
      rangeKey: key,
      chunkDays: request.chunkDays,
      attempt,
    },
    resultSnapshot: { requestId: request.requestId, state: "RETRY_PENDING", message },
    errorMessage: message,
  });
  return message;
}

async function storeTerminalFailure(
  request: SalesEventSyncRequest,
  stage: string,
  error: unknown,
) {
  const message = safeMessage(error);
  await storeOperation({
    operationType: SALES_EVENT_FAILED,
    sourceEventId: `sales-event-failed:${request.requestId}:${encodeURIComponent(stage)}`,
    correlationId: requestCorrelationId(request.requestId),
    status: "FAILED",
    inputSnapshot: {
      requestId: request.requestId,
      stage,
      chunkDays: request.chunkDays,
    },
    resultSnapshot: { requestId: request.requestId, stage, message },
    errorMessage: message,
  });
  return message;
}''',
'failure helpers')

          text = text.replace(
            'const message = await storeFailure(request, "planning", error);',
            'const message = await storeTerminalFailure(request, "planning", error);',
            1,
