name: Temporary Fast Purchase Resilient Production Probe

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Verify production page never collapses to the error boundary
        shell: bash
        run: |
          set -euo pipefail
          url='https://commerce-os-ops-center.vercel.app/fast-purchase-mvp'
          ready=0
          for i in $(seq 1 75); do
            body="$(mktemp)"
            out="$(curl -L -sS --connect-timeout 10 --max-time 180 -o "$body" -w '%{http_code} %{time_total}' "$url" || true)"
            http="$(echo "$out" | awk '{print $1}')"
            elapsed="$(echo "$out" | awk '{print $2}')"
            text="$(cat "$body" | python -c 'import html,re,sys; raw=sys.stdin.read(); raw=re.sub(r"<script[\s\S]*?</script>"," ",raw,flags=re.I); raw=re.sub(r"<style[\s\S]*?</style>"," ",raw,flags=re.I); raw=re.sub(r"<[^>]+>"," ",raw); print(re.sub(r"\s+"," ",html.unescape(raw)).strip()[:700000])')"
            echo "PROBE $i HTTP=$http ELAPSED=${elapsed}s"
            if [ "$http" = '200' ] && echo "$text" | grep -q 'FAST USE · PROVISIONAL V2.2 · OPERATE NOW'; then
              echo '--- FAST PURCHASE RESILIENT PRODUCTION ---'
              echo "$text"
              echo "ELAPSED_SECONDS=$elapsed"
              ! echo "$text" | grep -q '빠른 발주안을 불러오지 못했습니다'
              echo "$text" | grep -q '오늘 발주 검토 작업대'
              echo "$text" | grep -q '운영 커버리지 42'
              echo "$text" | grep -q '수동 발주만 · 자동주문 0'
              if echo "$text" | grep -q 'LAST_KNOWN_MANUAL_FALLBACK'; then
                echo 'DATA_MODE=LAST_KNOWN_MANUAL_FALLBACK'
                echo "$text" | grep -q '실시간 호출 실패 · 마지막 정상 스냅샷으로 수동검토 계속 가능'
                echo "$text" | grep -q '시스템 판단 0'
              else
                echo 'DATA_MODE=LIVE'
              fi
              ready=1
              break
            fi
            sleep 6
          done
          test "$ready" = '1'
