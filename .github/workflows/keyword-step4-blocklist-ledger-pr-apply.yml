name: Apply STEP4 Blocklist Ledger On PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'feat/keyword-step4-blocklist-ledger-20260822'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/keyword-step4-blocklist-ledger-20260822
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Apply cumulative blocklist UI and duplicate guard
        shell: python
        run: |
          from pathlib import Path

          def replace(path: str, old: str, new: str):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"expected snippet not found: {path}\n{old[:220]}")
              p.write_text(text.replace(old, new), encoding="utf-8")

          component = "src/app/keyword-engine-elon-lab/KeywordElonStep4DualFilter.tsx"
          test_file = "tests/keywordEngineElonLabStep4.test.mjs"

          replace(component,
          '''  const [customTerms, setCustomTerms] = useState<string[]>([]);\n  const [draft, setDraft] = useState(\"\");\n  const [busy, setBusy] = useState(false);''',
          '''  const [customTerms, setCustomTerms] = useState<string[]>([]);\n  const [draft, setDraft] = useState(\"\");\n  const [blocklistOpen, setBlocklistOpen] = useState(false);\n  const [busy, setBusy] = useState(false);''')

          replace(component,
          '''  function addCustomTerms() {\n    const additions = draft.split(/[\\n,;|/]+/).map((value) => value.trim()).filter(Boolean);\n    if (!additions.length) return;\n    const next = uniqueKeywordElonCanonical([...customTerms, ...additions], 120).filter((term) => term.length >= 2);\n    saveCustomBlockedTerms(next);\n    setCustomTerms(next);\n    setDraft(\"\");\n  }\n\n  function removeCustomTerm(term: string) {\n    const next = customTerms.filter((value) => value !== term);\n    saveCustomBlockedTerms(next);\n    setCustomTerms(next);\n  }''',
          '''  function addCustomTerms() {\n    const additions = uniqueKeywordElonCanonical(\n      draft.split(/[\\n,;|/]+/).map((value) => value.trim()).filter(Boolean),\n      120,\n    ).filter((term) => term.length >= 2);\n    if (!additions.length) {\n      setMessage(\"2글자 이상의 금지어를 입력해 주세요.\");\n      return;\n    }\n\n    const existing = new Set(customTerms);\n    const newTerms = additions.filter((term) => !existing.has(term));\n    const duplicateCount = additions.length - newTerms.length;\n    if (!newTerms.length) {\n      setMessage(`입력한 금지어 ${duplicateCount}개는 모두 이미 저장되어 있습니다.`);\n      setDraft(\"\");\n      return;\n    }\n\n    const next = uniqueKeywordElonCanonical([...customTerms, ...newTerms], 120).filter((term) => term.length >= 2);\n    saveCustomBlockedTerms(next);\n    setCustomTerms(next);\n    setDraft(\"\");\n    setMessage(`금지어 ${newTerms.length}개 누적 저장 완료${duplicateCount ? ` · 중복 ${duplicateCount}개 건너뜀` : \"\"}`);\n  }\n\n  function removeCustomTerm(term: string) {\n    const next = customTerms.filter((value) => value !== term);\n    saveCustomBlockedTerms(next);\n    setCustomTerms(next);\n    setMessage(`금지어 목록에서 '${term}'을 삭제했습니다.`);\n  }''')

          replace(component,
          '''        <div className=\"mt-4 rounded-2xl border border-violet-200 bg-white p-4\">\n          <div className=\"text-sm font-black\">사용자 금지키워드</div>\n          <div className=\"mt-3 flex flex-col gap-2 lg:flex-row\"><textarea value={draft} onChange={(event) => setDraft(event.target.value)} placeholder=\"쉼표/줄바꿈으로 추가\" className=\"min-h-12 flex-1 rounded-xl border border-slate-300 px-4 py-3 text-sm\" /><button onClick={addCustomTerms} className=\"rounded-xl bg-violet-700 px-5 py-3 text-sm font-black text-white\">금지어 추가</button></div>\n          {customTerms.length ? <div className=\"mt-3 flex flex-wrap gap-2\">{customTerms.map((term) => <button key={term} onClick={() => removeCustomTerm(term)} className=\"rounded-full bg-violet-100 px-3 py-1 text-xs font-black text-violet-900\">{term} ×</button>)}</div> : null}\n        </div>''',
          '''        <div className=\"mt-4 rounded-2xl border border-violet-200 bg-white p-4\">\n          <div className=\"flex flex-wrap items-center justify-between gap-3\">\n            <div>\n              <div className=\"flex flex-wrap items-center gap-2\">\n                <div className=\"text-sm font-black\">사용자 금지키워드</div>\n                <span className=\"rounded-full bg-violet-100 px-2.5 py-1 text-[11px] font-black text-violet-800\">{customTerms.length}개 누적 저장</span>\n              </div>\n              <p className=\"mt-1 text-xs text-slate-500\">한 번 저장한 금지어는 다음 상품에서도 계속 적용되며, 같은 단어를 다시 입력해도 중복 저장하지 않습니다.</p>\n            </div>\n            <button type=\"button\" onClick={() => setBlocklistOpen((open) => !open)} className=\"rounded-xl border border-violet-200 bg-violet-50 px-4 py-2 text-xs font-black text-violet-900\">\n              {blocklistOpen ? \"금지어 목록 숨기기\" : `금지어 목록 보기 (${customTerms.length})`}\n            </button>\n          </div>\n          <div className=\"mt-3 flex flex-col gap-2 lg:flex-row\"><textarea value={draft} onChange={(event) => setDraft(event.target.value)} placeholder=\"쉼표/줄바꿈으로 추가\" className=\"min-h-12 flex-1 rounded-xl border border-slate-300 px-4 py-3 text-sm\" /><button onClick={addCustomTerms} className=\"rounded-xl bg-violet-700 px-5 py-3 text-sm font-black text-white\">금지어 추가</button></div>\n          {blocklistOpen ? (\n            <div className=\"mt-3 rounded-xl border border-violet-100 bg-violet-50/50 p-3\">\n              {customTerms.length ? <div className=\"flex flex-wrap gap-2\">{customTerms.map((term) => <button key={term} type=\"button\" onClick={() => removeCustomTerm(term)} className=\"rounded-full bg-white px-3 py-1.5 text-xs font-black text-violet-900 ring-1 ring-violet-200\" title=\"목록에서 삭제\">{term} ×</button>)}</div> : <div className=\"text-xs text-slate-500\">아직 저장된 사용자 금지어가 없습니다.</div>}\n            </div>\n          ) : null}\n        </div>''')

          replace(test_file,
          '''test(\"user blocked keywords persist and dual-filtered candidates regenerate the title\", () => {\n  assert.match(component, /keywordEngineElonLab\\.step4\\.customBlockedTerms\\.v1/);\n  assert.match(component, /saveCustomBlockedTerms/);''',
          '''test(\"user blocked keywords persist, dedupe and expose a viewable ledger\", () => {\n  assert.match(component, /keywordEngineElonLab\\.step4\\.customBlockedTerms\\.v1/);\n  assert.match(component, /saveCustomBlockedTerms/);\n  assert.match(component, /const existing = new Set\\(customTerms\\)/);\n  assert.match(component, /모두 이미 저장되어 있습니다/);\n  assert.match(component, /중복 .*개 건너뜀/);\n  assert.match(component, /blocklistOpen/);\n  assert.match(component, /금지어 목록 보기/);\n  assert.match(component, /금지어 목록 숨기기/);\n  assert.match(component, /개 누적 저장/);''')

      - run: npm ci
      - name: Lint changed Keyword Lab file
        run: npx eslint src/app/keyword-engine-elon-lab/KeywordElonStep4DualFilter.tsx
      - name: Run STEP4 regression tests
        run: node --experimental-strip-types --test tests/keywordEngineElonLabStep4.test.mjs
      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://price-auth-build-check.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_price_auth_build_check
          PRICE_ADJUSTMENT_ENGINE_INTEGRATION_SECRET: ci-price-adjustment-secret
          PRICE_ADJUSTMENT_AUTOMATION_OWNER_ID: 0c23a96b-1cda-44b6-9c08-1fa1c1b45a36

      - name: Commit implementation and remove temporary workflows
        shell: bash
        run: |
          rm -f .github/workflows/keyword-step4-blocklist-ledger-patch.yml .github/workflows/keyword-step4-blocklist-ledger-pr-apply.yml
          git config user.name "andysong111"
          git config user.email "andy0801a@gmail.com"
          git add src/app/keyword-engine-elon-lab/KeywordElonStep4DualFilter.tsx tests/keywordEngineElonLabStep4.test.mjs .github/workflows/keyword-step4-blocklist-ledger-patch.yml .github/workflows/keyword-step4-blocklist-ledger-pr-apply.yml
          git commit -m "feat(keyword): persist and inspect STEP4 blocklist ledger"
          git push origin HEAD:feat/keyword-step4-blocklist-ledger-20260822
