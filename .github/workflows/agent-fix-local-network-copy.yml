name: Agent Fix Local Network Copy

on:
  push:
    branches:
      - agent/fix-chrome-local-network-bridge-20260805

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[local-network-copy-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-chrome-local-network-bridge-20260805
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - run: node scripts/agent-fix-local-network-copy.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/product-launch-tracker-app/detail-page-dock.js
          git commit -m "Fix local collector confirmation copy [local-network-copy-patched]"
          git push origin HEAD:agent/fix-chrome-local-network-bridge-20260805
