name: Temporary Receipt Live Price Rollout Probe

on:
  push:
    branches:
      - ops/receipt-live-price-rollout-probe-20260809
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  probe:
    if: >-
      ${{
        (github.event_name == 'push' && github.ref_name == 'ops/receipt-live-price-rollout-probe-20260809') ||
        (github.event_name == 'pull_request' && github.head_ref == 'ops/receipt-live-price-rollout-probe-20260809')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Wait for production receipt live price proposal page
        shell: bash
        run: |
          set -euo pipefail
          url='https://commerce-os-ops-center.vercel.app/stage8-receipt-live-price-proposals'
          ready=0
          for i in $(seq 1 50); do
            body="$(mktemp)"
            out="$(curl -L -sS --connect-timeout 10 --max-time 120 -o "$body" -w '%{http_code} %{time_total}' "$url" || true)"
            http="$(echo "$out" | awk '{print $1}')"
            elapsed="$(echo "$out" | awk '{print $2}')"
            text="$(cat "$body" | python -c 'import html,re,sys; raw=sys.stdin.read(); raw=re.sub(r"<script[\s\S]*?</script>"," ",raw,flags=re.I); raw=re.sub(r"<style[\s\S]*?</style>"," ",raw,flags=re.I); raw=re.sub(r"<[^>]+>"," ",raw); print(re.sub(r"\s+"," ",html.unescape(raw)).strip()[:160000])')"
            echo "PROBE $i HTTP=$http ELAPSED=${elapsed}s"
            if [ "$http" = '200' ] && echo "$text" | grep -q '입고확정 → 샵플링 LIVE 가격제안'; then
              echo '--- RECEIPT LIVE PRICE ROLLOUT ---'
              echo "$text"
              echo "ELAPSED_SECONDS=$elapsed"
              echo "$text" | grep -q '실제 가격 write 0 · READ ONLY'
              echo "$text" | grep -q '기존 입고는 소급 가격변경하지 않습니다'
              echo "$text" | grep -q 'Rollout READY'
              ready=1
              break
            fi
            sleep 8
          done
          test "$ready" = '1'
