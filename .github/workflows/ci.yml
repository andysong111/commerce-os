name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read production evidence status
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import html
          import re
          import subprocess
          from pathlib import Path

          base = 'https://commerce-os-ops-center.vercel.app'
          pages = [
              ('DIRECT', '/product-master/shopling-sales-backfill/direct-code-evidence'),
              ('BASELINE', '/product-master/shopling-sales-backfill'),
              ('SHADOW', '/product-master/shopling-sales-backfill/historical-shadow'),
          ]

          def clean_html(raw: str) -> str:
              value = re.sub(r'<script[\s\S]*?</script>', ' ', raw, flags=re.I)
              value = re.sub(r'<style[\s\S]*?</style>', ' ', value, flags=re.I)
              value = re.sub(r'<!--.*?-->', '', value, flags=re.S)
              value = re.sub(r'<[^>]+>', ' ', value)
              value = html.unescape(value)
              return re.sub(r'\s+', ' ', value).strip()

          for label, path in pages:
              output = Path(f'/tmp/{label.lower()}.html')
              completed = subprocess.run(
                  [
                      'curl', '-L', '-sS', '--connect-timeout', '10', '--max-time', '30',
                      '-o', str(output), '-w', '%{http_code}', base + path,
                  ],
                  capture_output=True,
                  text=True,
              )
              code = completed.stdout.strip() or '000'
              print(f'{label}_HTTP={code}')
              if code != '200':
                  continue
              clean = clean_html(output.read_text(encoding='utf-8', errors='ignore'))
              print(f'{label}_TEXT_BEGIN')
              print(clean[:8000])
              print(f'{label}_TEXT_END')
              for needle in [
                  '현재 상태', '완료 구간', '진행률', '직접코드 증거행',
                  '안전 optionId', '저장샘플 복원후보', '미연결 주문',
                  'COMPLETED', 'RUNNING', 'QUEUED', 'FAILED'
              ]:
                  idx = clean.find(needle)
                  if idx >= 0:
                      print(f'{label}_MATCH {needle}: {clean[max(0, idx-180):idx+700]}')
          PY
