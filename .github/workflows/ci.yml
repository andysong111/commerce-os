name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  production-status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read managed sales status
        shell: bash
        run: |
          set -euo pipefail
          base='https://commerce-os-ops-center.vercel.app'
          for path in \
            '/product-master/shopling-sales-backfill' \
            '/product-master/shopling-sales-backfill/unmapped-diagnostic'; do
            echo "PAGE_${path}_BEGIN"
            curl -L -sS --connect-timeout 10 --max-time 30 "$base$path" \
              | python -c 'import html,re,sys; raw=sys.stdin.read(); raw=re.sub(r"<script[\\s\\S]*?</script>"," ",raw,flags=re.I); raw=re.sub(r"<style[\\s\\S]*?</style>"," ",raw,flags=re.I); raw=re.sub(r"<[^>]+>"," ",raw); print(re.sub(r"\\s+"," ",html.unescape(raw)).strip()[:9000])'
            echo "PAGE_${path}_END"
          done
