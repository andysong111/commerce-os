name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-start:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Start managed-barcode baseline and read status
        shell: bash
        run: |
          set -euo pipefail
          base='https://commerce-os-ops-center.vercel.app'
          echo 'START_RESPONSE_BEGIN'
          curl -L -sS --connect-timeout 10 --max-time 30 \
            -H 'Origin: https://commerce-os-ops-center.vercel.app' \
            -H 'Content-Type: application/json' \
            -X POST \
            --data '{"action":"start"}' \
            "$base/api/product-master/shopling-sales-backfill"
          echo
          echo 'START_RESPONSE_END'
          sleep 3
          echo 'STATUS_PAGE_BEGIN'
          curl -L -sS --connect-timeout 10 --max-time 30 \
            "$base/product-master/shopling-sales-backfill" \
            | python -c 'import html,re,sys; raw=sys.stdin.read(); raw=re.sub(r"<script[\\s\\S]*?</script>"," ",raw,flags=re.I); raw=re.sub(r"<style[\\s\\S]*?</style>"," ",raw,flags=re.I); raw=re.sub(r"<[^>]+>"," ",raw); print(re.sub(r"\\s+"," ",html.unescape(raw)).strip()[:5000])'
          echo 'STATUS_PAGE_END'
