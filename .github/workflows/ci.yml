name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Lint changed integration files
        run: >-
          npx eslint
          src/lib/priceAdjustmentIntegrationAuth.ts
          src/app/api/integrations/price-adjustment/jobs/route.ts
          'src/app/api/integrations/price-adjustment/jobs/[jobId]/route.ts'
          src/lib/extendedModuleRegistry.ts
          src/lib/productLaunchTrackerRows.ts
          src/lib/productLaunchTrackerShopling.ts
          src/app/api/product-launch-tracker/flow-selection/route.ts
          src/components/product-launch-flow/ProductLaunchFlowConnected.tsx
          src/components/product-launch-flow/ProductLaunchTrackerHandoffSync.tsx
          src/lib/productMasterShoplingSalesHistoricalShadowEngine.ts
          src/lib/productMasterShoplingSalesHistoricalShadow.ts
          src/app/api/cron/product-master-shopling-sales-backfill/route.ts
          src/app/product-master/shopling-sales-backfill/historical-shadow/page.tsx
      - name: Test existing bulk safety and new engine integration
        run: >-
          node --experimental-strip-types --test
          tests/opsLoginBypass.test.mjs
          tests/shoplingPriceAdjustmentAuth.test.mjs
          tests/shoplingPriceAdjustmentBatchCanary.test.mjs
          tests/shoplingPriceAdjustmentIdentity.test.mjs
          tests/shoplingPriceAdjustmentInputModes.test.mjs
          tests/shoplingPriceAdjustmentPartialPlan.test.mjs
          tests/shoplingPriceAdjustmentRecoveryStatic.test.mjs
          tests/shoplingPriceAdjustmentWorkflowFailure.test.mjs
          tests/priceAdjustmentEngineIntegration.test.mjs
      - name: Test historical option shadow safety
        run: >-
          node --experimental-strip-types --test
          tests/productMasterShoplingSalesHistoricalShadowEngine.test.mjs
          tests/productMasterShoplingSalesHistoricalShadow.test.mjs
      - name: Test tracker-connected product launch flow
        run: >-
          node --experimental-strip-types --test
          tests/productLaunchTrackerRows.test.mjs
          tests/productLaunchTrackerBarcodeMapping.test.mjs
          tests/productLaunchTrackerFlowConnection.test.mjs
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://price-auth-build-check.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_price_auth_build_check
          PRICE_ADJUSTMENT_ENGINE_INTEGRATION_SECRET: ci-price-adjustment-secret
          PRICE_ADJUSTMENT_AUTOMATION_OWNER_ID: 0c23a96b-1cda-44b6-9c08-1fa1c1b45a36
      - name: Monitor production direct-code evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import html
          import re
          import subprocess
          import time
          from pathlib import Path

          base = 'https://commerce-os-ops-center.vercel.app'
          direct_path = '/product-master/shopling-sales-backfill/direct-code-evidence'

          def clean_html(raw: str) -> str:
              value = re.sub(r'<script[\s\S]*?</script>', ' ', raw, flags=re.I)
              value = re.sub(r'<style[\s\S]*?</style>', ' ', value, flags=re.I)
              value = re.sub(r'<!--.*?-->', '', value, flags=re.S)
              value = re.sub(r'<[^>]+>', ' ', value)
              value = html.unescape(value)
              return re.sub(r'\s+', ' ', value).strip()

          def fetch(path: str, output: Path):
              completed = subprocess.run(
                  [
                      'curl', '-L', '-sS', '--connect-timeout', '10', '--max-time', '30',
                      '-o', str(output), '-w', '%{http_code}', base + path,
                  ],
                  capture_output=True,
                  text=True,
              )
              return completed.stdout.strip() or '000'

          # Wait for the newly merged deployment/route to become live.
          direct_file = Path('/tmp/direct.html')
          code = '000'
          for attempt in range(1, 13):
              code = fetch(direct_path, direct_file)
              print(f'DIRECT_ROUTE attempt={attempt} http={code}')
              if code == '200':
                  break
              time.sleep(10)
          if code != '200':
              raise SystemExit(f'direct evidence route never became ready: {code}')

          # Observe the existing 1-minute worker. This is GET-only monitoring;
          # the page itself does not start or mutate the scan.
          for observation in range(1, 20):
              code = fetch(direct_path, direct_file)
              if code != '200':
                  print(f'DIRECT_OBSERVATION {observation} http={code}')
                  time.sleep(55)
                  continue
              clean = clean_html(direct_file.read_text(encoding='utf-8', errors='ignore'))
              print(f'DIRECT_OBSERVATION {observation}: {clean[:4500]}')
              for needle in [
                  '현재 상태', '완료 구간', '진행률', '직접코드 증거행',
                  '안전 optionId', '저장샘플 복원후보', 'COMPLETED', 'FAILED'
              ]:
                  idx = clean.find(needle)
                  if idx >= 0:
                      print(f'DIRECT_MATCH {needle}: {clean[max(0, idx-140):idx+520]}')
              if ' COMPLETED ' in f' {clean} ' or ' FAILED ' in f' {clean} ':
                  print('DIRECT_TERMINAL_STATE_REACHED')
                  break
              time.sleep(55)

          # Final compact snapshots of the canonical and catalog pages.
          for label, path in [
              ('BASELINE', '/product-master/shopling-sales-backfill'),
              ('CATALOG', '/product-master/shopling-sales-backfill/unmapped-diagnostic/catalog-evidence'),
              ('SHADOW', '/product-master/shopling-sales-backfill/historical-shadow'),
          ]:
              output = Path(f'/tmp/{label.lower()}.html')
              code = fetch(path, output)
              print(f'{label}_FINAL http={code}')
              if code == '200':
                  clean = clean_html(output.read_text(encoding='utf-8', errors='ignore'))
                  print(f'{label}_FINAL_TEXT {clean[:5000]}')
          PY
