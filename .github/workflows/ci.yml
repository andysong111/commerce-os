name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Lint changed integration files
        run: >-
          npx eslint
          src/lib/priceAdjustmentIntegrationAuth.ts
          src/app/api/integrations/price-adjustment/jobs/route.ts
          'src/app/api/integrations/price-adjustment/jobs/[jobId]/route.ts'
          src/lib/extendedModuleRegistry.ts
      - run: npm test
      - run: npm run build
