name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Materialize product launch performance files
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/product-launch-tracker-performance'
        run: node scripts/materialize-product-launch-performance.mjs
      - name: Publish materialized performance files to the PR branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/product-launch-tracker-performance'
        run: |
          git add \
            src/lib/productLaunchTrackerOptimized.ts \
            src/app/api/product-launch-tracker/optimized/route.ts \
            src/app/api/product-launch-tracker/state/route.ts \
            public/product-launch-tracker-app/optimized-app.js \
            public/product-launch-tracker-app/app.js \
            tests/productLaunchTrackerOptimized.test.mjs \
            tests/productLaunchTrackerOptimizedContracts.test.mjs
          if git diff --cached --quiet; then
            echo "Optimized tracker files are already materialized."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Optimize product launch tracker data flow"
            git push origin HEAD:agent/product-launch-tracker-performance
          fi
      - run: npm ci
      - name: Lint changed integration files
        run: >-
          npx eslint
          src/lib/priceAdjustmentIntegrationAuth.ts
          src/app/api/integrations/price-adjustment/jobs/route.ts
          'src/app/api/integrations/price-adjustment/jobs/[jobId]/route.ts'
          src/lib/extendedModuleRegistry.ts
          src/lib/productLaunchTrackerRows.ts
          src/lib/productLaunchTrackerShopling.ts
          src/app/api/product-launch-tracker/flow-selection/route.ts
          src/components/product-launch-flow/ProductLaunchFlowConnected.tsx
          src/components/product-launch-flow/ProductLaunchTrackerHandoffSync.tsx
      - name: Test existing bulk safety and new engine integration
        run: >-
          node --experimental-strip-types --test
          tests/opsLoginBypass.test.mjs
          tests/shoplingPriceAdjustmentAuth.test.mjs
          tests/shoplingPriceAdjustmentBatchCanary.test.mjs
          tests/shoplingPriceAdjustmentIdentity.test.mjs
          tests/shoplingPriceAdjustmentInputModes.test.mjs
          tests/shoplingPriceAdjustmentPartialPlan.test.mjs
          tests/shoplingPriceAdjustmentRecoveryStatic.test.mjs
          tests/shoplingPriceAdjustmentWorkflowFailure.test.mjs
          tests/priceAdjustmentEngineIntegration.test.mjs
      - name: Test tracker-connected product launch flow
        run: >-
          node --experimental-strip-types --test
          tests/productLaunchTrackerRows.test.mjs
          tests/productLaunchTrackerBarcodeMapping.test.mjs
          tests/productLaunchTrackerFlowConnection.test.mjs
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://price-auth-build-check.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_price_auth_build_check
          PRICE_ADJUSTMENT_ENGINE_INTEGRATION_SECRET: ci-price-adjustment-secret
          PRICE_ADJUSTMENT_AUTOMATION_OWNER_ID: 0c23a96b-1cda-44b6-9c08-1fa1c1b45a36
