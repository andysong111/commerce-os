name: Temporary Stage8 Sales Events One Shot

on:
  pull_request:

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Read current production status snapshot 3
        shell: bash
        run: |
          set -euo pipefail
          curl -L -sS --connect-timeout 10 --max-time 60 \
            'https://commerce-os-ops-center.vercel.app/stage8-sales-events' \
            | python -c 'import html,re,sys; raw=sys.stdin.read(); raw=re.sub(r"<script[\s\S]*?</script>"," ",raw,flags=re.I); raw=re.sub(r"<style[\s\S]*?</style>"," ",raw,flags=re.I); raw=re.sub(r"<[^>]+>"," ",raw); print(re.sub(r"\s+"," ",html.unescape(raw)).strip()[:18000])'
