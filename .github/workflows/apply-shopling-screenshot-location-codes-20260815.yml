name: Apply Shopling Screenshot Location Codes 20260815

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-shopling-screenshot-location-codes-20260815.yml'
      - 'src/app/api/product-launch-tracker/migrations/shopling-screenshot-location-code-backfill-20260815/route.ts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apply-shopling-screenshot-location-codes-20260815
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ENDPOINT: https://commerce-os-ops-center.vercel.app/api/product-launch-tracker/migrations/shopling-screenshot-location-code-backfill-20260815
      ITEM_ENDPOINT: https://commerce-os-ops-center.vercel.app/api/product-launch-tracker/optimized
    steps:
      - uses: actions/checkout@v4

      - name: Wait for production endpoint
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            code=$(curl -sS --connect-timeout 10 --max-time 120 \
              -o /tmp/status.json -w '%{http_code}' "$ENDPOINT" || true)
            echo "attempt=$attempt status=$code"
            if [ "$code" = '200' ]; then
              cat /tmp/status.json
              node - <<'NODE'
          const b=require('/tmp/status.json');
          const n=b.normalized||{};
          if(!b.ok)process.exit(1);
          if(b.version!=='2026-08-15-shopling-screenshot-location-code-v1')process.exit(1);
          if(b.trackerItemCount!==346||b.trackerOptionCount!==740)process.exit(1);
          if(n.itemCount!==346||n.optionCount!==740||n.readEnabled!==true||n.fresh!==true)process.exit(1);
          NODE
              exit 0
            fi
            cat /tmp/status.json 2>/dev/null || true
            sleep 10
          done
          exit 1

      - name: Dry-run screenshot mapping
        run: |
          set -euo pipefail
          curl --fail-with-body -sS --connect-timeout 10 --max-time 240 \
            -X POST "$ENDPOINT" -o /tmp/dry-run.json
          cat /tmp/dry-run.json
          node - <<'NODE'
          const b=require('/tmp/dry-run.json');
          if(b.alreadyApplied===true||b.applied===true)process.exit(0);
          const r=b.report||{};
          if(!b.ok||!b.dryRun)throw Error(JSON.stringify(b));
          if(r.mappingCount!==5||r.mappingOptionCount!==9||r.matchedItems!==5||r.hardConflictCount!==0)throw Error(JSON.stringify(r));
          NODE

      - name: Apply screenshot-confirmed B codes
        run: |
          set -euo pipefail
          status_code=$(curl -sS --connect-timeout 10 --max-time 120 \
            -o /tmp/pre-apply.json -w '%{http_code}' "$ENDPOINT" || true)
          if [ "$status_code" = '200' ]; then
            already=$(node -p "JSON.parse(require('fs').readFileSync('/tmp/pre-apply.json','utf8')).applied===true?'true':'false'")
            if [ "$already" = 'true' ]; then
              cp /tmp/pre-apply.json /tmp/apply.json
              exit 0
            fi
          fi

          code=$(curl -sS --connect-timeout 10 --max-time 300 \
            -X POST -o /tmp/apply.json -w '%{http_code}' \
            "$ENDPOINT?apply=1" || true)
          echo "apply_status=$code"
          cat /tmp/apply.json 2>/dev/null || true
          if [ "$code" != '200' ]; then
            curl --fail-with-body -sS --connect-timeout 10 --max-time 180 \
              "$ENDPOINT" -o /tmp/apply-probe.json
            cp /tmp/apply-probe.json /tmp/apply.json
          fi

          node - <<'NODE'
          const b=require('/tmp/apply.json');
          const r=b.report||{},n=b.normalizedSync||b.normalized||{};
          if(!b.ok||b.applied!==true)throw Error(JSON.stringify(b));
          if(r.hardConflictCount!==0||r.mappingCount!==5||r.mappingOptionCount!==9||r.matchedItems!==5)throw Error(JSON.stringify(r));
          if(n.itemCount!==346||n.optionCount!==740||n.readEnabled!==true||n.fresh!==true)throw Error(JSON.stringify(n));
          NODE

      - name: Verify marker and all mapped options
        run: |
          set -euo pipefail
          curl --fail-with-body -sS --connect-timeout 10 --max-time 180 \
            "$ENDPOINT" -o /tmp/verify.json
          cat /tmp/verify.json
          node - <<'NODE'
          const b=require('/tmp/verify.json'),n=b.normalized||{};
          if(!b.ok||!b.applied)throw Error(JSON.stringify(b));
          if(n.itemCount!==346||n.optionCount!==740||n.readEnabled!==true||n.fresh!==true)throw Error(JSON.stringify(n));
          NODE

          python - <<'PY'
          import json
          import subprocess
          import urllib.parse
          from pathlib import Path

          expected = {
              '17aba3b0-5f9b-4a9c-9722-d592f80a78ba': {
                  'model': 'AAA095',
                  'main': 'BBA7-2',
                  'options': {'stock-AAA095-1': 'BBA7-2'},
              },
              '1c987a02-2c46-44e0-a8c1-931750b650c4': {
                  'model': 'AAA126',
                  'main': None,
                  'options': {
                      'stock-AAA126-2': 'BCA6-2',
                      'stock-AAA126-3': 'BCA6-3',
                      'stock-AAA126-4': 'BCA6-1',
                  },
              },
              '342353dd-f23f-4baa-9ce1-cf5797fb0e6b': {
                  'model': 'AAA128',
                  'main': None,
                  'options': {'stock-AAA128-6': 'BGE3-2'},
              },
              '02a37104-beb2-439b-874f-fe49ad6e5ad1': {
                  'model': 'AAA168',
                  'main': None,
                  'options': {
                      'stock-AAA168-1': 'BGC1-1',
                      'stock-AAA168-3': 'BGC1-3',
                  },
              },
              '90eec3f3-1efb-4e5d-a2cd-52ca103b4e3d': {
                  'model': 'AAA186',
                  'main': None,
                  'options': {
                      'stock-AAA186-3': 'BCB6-2',
                      'stock-AAA186-4': 'BCB6-3',
                  },
              },
          }

          output=[]
          for item_id, rule in expected.items():
              url='https://commerce-os-ops-center.vercel.app/api/product-launch-tracker/optimized?'+urllib.parse.urlencode({'mode':'item','id':item_id})
              raw=subprocess.check_output([
                  'curl','--fail-with-body','-sS','--connect-timeout','10','--max-time','180',
                  '-H','Origin: https://commerce-os-ops-center.vercel.app',
                  '-H','Referer: https://commerce-os-ops-center.vercel.app/product-launch-tracker',
                  '-H','Sec-Fetch-Site: same-origin',url,
              ])
              body=json.loads(raw)
              item=body['item']
              assert str(item.get('modelNumber','')).upper()==rule['model'], (rule['model'],item.get('modelNumber'))
              actual={str(row.get('id') or ''):str(row.get('barcode') or '') for row in item.get('orderOptions',[])}
              for option_id, code in rule['options'].items():
                  assert actual.get(option_id)==code, (rule['model'],option_id,actual.get(option_id),code)
              if rule['main']:
                  assert item.get('barcode')==rule['main'], (rule['model'],item.get('barcode'))
                  assert item.get('warehouseLocation')==rule['main'], (rule['model'],item.get('warehouseLocation'))
              output.append({
                  'modelNumber': rule['model'],
                  'barcode': item.get('barcode',''),
                  'warehouseLocation': item.get('warehouseLocation',''),
                  'verifiedOptions': rule['options'],
              })
          Path('/tmp/items-verified.json').write_text(json.dumps(output,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(output,ensure_ascii=False,indent=2))
          PY

      - name: Upload execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shopling-screenshot-location-codes-${{ github.run_id }}
          path: |
            /tmp/status.json
            /tmp/dry-run.json
            /tmp/pre-apply.json
            /tmp/apply.json
            /tmp/apply-probe.json
            /tmp/verify.json
            /tmp/items-verified.json
          if-no-files-found: warn
          retention-days: 30

      - name: Publish summary
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          lines=['## Shopling 스크린샷 B코드 적용']
          for label,path in [('dry-run','/tmp/dry-run.json'),('apply','/tmp/apply.json'),('verify','/tmp/verify.json')]:
              p=Path(path)
              if not p.exists():
                  lines.append(f'- {label}: 결과 없음')
                  continue
              data=json.loads(p.read_text(encoding='utf-8'));report=data.get('report') or {}
              lines += [
                  f'- {label}: ok={data.get("ok")}, applied={data.get("applied")}',
                  f'  - 매핑 상품: {report.get("mappingCount",0)}',
                  f'  - 매핑 옵션: {report.get("mappingOptionCount",0)}',
                  f'  - 변경 상품: {report.get("changedItems",0)}',
                  f'  - 변경 옵션: {report.get("changedOptions",0)}',
                  f'  - 기준 바코드 변경: {report.get("changedMainBarcodes",0)}',
                  f'  - 창고위치 변경: {report.get("changedWarehouseLocations",0)}',
                  f'  - 충돌: {report.get("hardConflictCount",0)}',
              ]
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as f:
              f.write('\n'.join(lines)+'\n')
          PY
