name: Temporary Stage8 Inventory Verification Priority Check

on:
  push:
    branches:
      - feat/stage8-inventory-verification-priority
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    if: ${{ github.event_name == 'push' || github.head_ref == 'feat/stage8-inventory-verification-priority' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Focused safety tests
        run: node --experimental-strip-types --test tests/stage8InventoryVerificationPriority.test.mjs tests/stage8CanonicalPurchaseShadow.test.mjs
      - name: Lint priority files
        run: npx eslint src/lib/stage8InventoryVerificationPriority.ts src/app/stage8-inventory-verification-priority/page.tsx
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://price-auth-build-check.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_price_auth_build_check
          PRICE_ADJUSTMENT_ENGINE_INTEGRATION_SECRET: ci-price-adjustment-secret
          PRICE_ADJUSTMENT_AUTOMATION_OWNER_ID: 0c23a96b-1cda-44b6-9c08-1fa1c1b45a36
