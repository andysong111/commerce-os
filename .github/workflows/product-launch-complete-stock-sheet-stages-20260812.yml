name: Product Launch Complete Stock Sheet Stages 20260812

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/product-launch-complete-stock-sheet-stages-20260812.yml"

permissions:
  contents: read

jobs:
  complete-stages:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for production migration endpoint
        run: |
          set -euo pipefail
          URL='https://commerce-os-ops-center.vercel.app/api/product-launch-tracker/migrations/complete-stock-sheet-backfill-stages-20260812'
          for attempt in $(seq 1 30); do
            code=$(curl -sS -o /tmp/dry-run.json -w '%{http_code}' "$URL" || true)
            if [ "$code" = '200' ]; then
              cat /tmp/dry-run.json
              node - <<'NODE'
          const fs = require('fs');
          const body = JSON.parse(fs.readFileSync('/tmp/dry-run.json', 'utf8'));
          if (body.ok !== true) throw new Error(body.message || 'dry-run returned ok=false');
          if (body.report?.targetCount !== 284) {
            throw new Error(`unexpected targetCount=${body.report?.targetCount}`);
          }
          NODE
              exit 0
            fi
            echo "attempt=$attempt status=$code"
            cat /tmp/dry-run.json 2>/dev/null || true
            sleep 10
          done
          echo 'Stage completion endpoint did not become ready in time.' >&2
          exit 1

      - name: Apply completion exactly once
        run: |
          set -euo pipefail
          URL='https://commerce-os-ops-center.vercel.app/api/product-launch-tracker/migrations/complete-stock-sheet-backfill-stages-20260812?apply=1'
          curl --fail-with-body -sS "$URL" -o /tmp/apply.json
          cat /tmp/apply.json
          node - <<'NODE'
          const fs = require('fs');
          const body = JSON.parse(fs.readFileSync('/tmp/apply.json', 'utf8'));
          if (body.ok !== true) throw new Error(body.message || 'migration returned ok=false');
          if (body.applied !== true && body.alreadyApplied !== true) {
            throw new Error('migration neither applied nor alreadyApplied');
          }
          const report = body.report || {};
          if (report.targetCount !== 284) throw new Error(`unexpected targetCount=${report.targetCount}`);
          for (const key of ['detailPage', 'shoplingUpload', 'marketRegistration']) {
            if (report.after?.[key]?.completed !== 284 || report.after?.[key]?.pending !== 0) {
              throw new Error(`stage verification failed: ${key}`);
            }
          }
          NODE

      - name: Verify idempotency
        run: |
          set -euo pipefail
          URL='https://commerce-os-ops-center.vercel.app/api/product-launch-tracker/migrations/complete-stock-sheet-backfill-stages-20260812'
          curl --fail-with-body -sS "$URL" -o /tmp/verify.json
          cat /tmp/verify.json
          node - <<'NODE'
          const fs = require('fs');
          const body = JSON.parse(fs.readFileSync('/tmp/verify.json', 'utf8'));
          if (body.ok !== true || body.alreadyApplied !== true) {
            throw new Error('migration marker verification failed');
          }
          const report = body.report || {};
          const summary = [
            '## Stock sheet backfill stage completion',
            '',
            `- target items: ${report.targetCount ?? 0}`,
            `- changed items: ${report.changedItemCount ?? 0}`,
            `- detail page completed: ${report.after?.detailPage?.completed ?? 0}`,
            `- Shopling upload completed: ${report.after?.shoplingUpload?.completed ?? 0}`,
            `- market registration completed: ${report.after?.marketRegistration?.completed ?? 0}`,
          ].join('\n');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary + '\n');
          NODE
