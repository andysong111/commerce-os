name: Direct Target Price Execution CI

on:
  pull_request:
    paths:
      - "src/lib/internalChinaGroupCostPriceExecution.ts"
      - "src/lib/internalChinaGroupCostPricePolicy.ts"
      - "src/app/api/china-order-manager/price-review/group-aware-execute/route.ts"
      - "src/components/china-order-manager/InternalChinaGroupCostPriceExecutionButton.tsx"
      - "src/app/china-order-manager/price-review/page.tsx"
      - "tests/internalChinaDirectTargetExecution.test.mjs"
      - ".github/workflows/direct-target-price-execution-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  direct-target-price-execution:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Lint direct target execution surface
        run: >-
          npx eslint
          src/lib/internalChinaGroupCostPriceExecution.ts
          src/lib/internalChinaGroupCostPricePolicy.ts
          src/app/api/china-order-manager/price-review/group-aware-execute/route.ts
          src/components/china-order-manager/InternalChinaGroupCostPriceExecutionButton.tsx
          src/app/china-order-manager/price-review/page.tsx
          tests/internalChinaDirectTargetExecution.test.mjs
      - name: Run direct target execution regression
        run: node --test tests/internalChinaDirectTargetExecution.test.mjs
      - name: Build Ops Center
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://direct-target-price-ci.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_direct_target_price_ci
          SUPABASE_SECRET_KEY: sb_secret_direct_target_price_ci
          PRODUCT_MASTER_BASE_URL: https://commerce-os-product-master.vercel.app
          PRODUCT_MASTER_INTEGRATION_SECRET: ci-product-master-secret
          SHOPLING_LOGIN_ID: ci-shopling-id
          SHOPLING_COMPANY_ID: ci-shopling-company
          SHOPLING_API_AUTH_KEY: ci-shopling-key
          SHOPLING_PRICE_MODIFY_REPO: andysong111/shopling-price-modify-auto
          SHOPLING_PRICE_MODIFY_REF: main
          SHOPLING_PRICE_MODIFY_ACTIONS_TOKEN: ci-github-token
