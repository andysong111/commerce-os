name: Product Decision Live Overlay CI

on:
  pull_request:
    paths:
      - "src/lib/productDecisionLiveOverlay.ts"
      - "src/lib/integrations/productDecisionAgent.ts"
      - "src/app/product-decision-agent/page.tsx"
      - "tests/productDecisionLiveOverlay.test.mjs"
      - ".github/workflows/product-decision-live-overlay-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: product-decision-live-overlay-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-overlay-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Lint live overlay
        run: >-
          npx eslint
          src/lib/productDecisionLiveOverlay.ts
          src/lib/integrations/productDecisionAgent.ts
          src/app/product-decision-agent/page.tsx
          tests/productDecisionLiveOverlay.test.mjs
      - name: Run live overlay tests
        run: >-
          node --experimental-strip-types --test
          tests/productDecisionLiveOverlay.test.mjs
      - name: Build Ops Center
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://product-decision-live-overlay-build-check.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_product_decision_live_overlay_build_check
          PRODUCT_MASTER_BASE_URL: https://commerce-os-product-master.vercel.app
          PRODUCT_MASTER_INTEGRATION_SECRET: ci-product-master-secret
