name: Stage8 Legacy Model Recovery CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-model-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Lint legacy model recovery files
        run: >-
          npx eslint
          src/data/stage8LegacyModelIdentityEvidence.ts
          src/lib/stage8PurchaseCandidateLegacyModelRecovery.ts
          src/app/stage8-purchase-candidate-legacy-model-recovery/page.tsx
      - name: Test legacy model recovery safety
        run: node --experimental-strip-types --test tests/stage8PurchaseCandidateLegacyModelRecovery.test.mjs
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://legacy-model-recovery-build-check.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_legacy_model_recovery_build_check
          PRICE_ADJUSTMENT_ENGINE_INTEGRATION_SECRET: ci-price-adjustment-secret
          PRICE_ADJUSTMENT_AUTOMATION_OWNER_ID: 0c23a96b-1cda-44b6-9c08-1fa1c1b45a36
