name: Stage8 Provisional Execution Gate CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provisional-execution-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Lint provisional execution gate files
        run: >-
          npx eslint
          src/lib/stage8InventoryVerificationPriority.ts
          src/app/stage8-inventory-verification-priority/page.tsx
      - name: Test provisional execution gate safety
        run: node --experimental-strip-types --test tests/stage8ProvisionalExecutionGate.test.mjs
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://provisional-execution-gate-build-check.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_provisional_execution_gate_build_check
          PRICE_ADJUSTMENT_ENGINE_INTEGRATION_SECRET: ci-price-adjustment-secret
          PRICE_ADJUSTMENT_AUTOMATION_OWNER_ID: 0c23a96b-1cda-44b6-9c08-1fa1c1b45a36
