name: Temporary Shopling Sales Barcode Precedence Patch

on:
  push:
    branches:
      - fix/shopling-sales-barcode-precedence

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[barcode-precedence-patched]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/shopling-sales-barcode-precedence
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: node scripts/patch-shopling-sales-barcode-precedence.mjs
      - name: Test managed sales resolver
        run: node --experimental-strip-types --test tests/productMasterShoplingSalesBackfillEngine.test.mjs
      - name: Lint changed files
        run: npx eslint src/lib/productMasterShoplingSalesBackfillEngine.ts tests/productMasterShoplingSalesBackfillEngine.test.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Prioritize Shopling option barcode evidence [barcode-precedence-patched]"
          git push origin HEAD:fix/shopling-sales-barcode-precedence
