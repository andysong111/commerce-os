name: Keyword Threshold Experiment Runner

on:
  pull_request:
    paths:
      - "experiments/keyword-threshold-run-request.json"
      - "src/lib/keywordEngineElonLabExperimentFixtures.ts"
      - "src/lib/keywordEngineElonLabThresholdExperiment.ts"
      - "src/lib/keywordEngineElonLabV2Scoring.ts"
      - "src/lib/keywordEngineElonLabV2SearchAd.ts"
      - "src/lib/keywordEngineElonLabV2Step3.ts"
      - "src/app/api/keyword-engine-elon-lab/experiment/route.ts"
      - ".github/workflows/keyword-threshold-experiment-run.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keyword-threshold-experiment-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  run-experiment:
    name: run-experiment-${{ matrix.sample }}
    runs-on: ubuntu-latest
    timeout-minutes: 65
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        sample:
          - nose-tape-step1-v1
          - shoehorn-step1-v1
          - sponge-brush-step1-v1
          - adjustable-thimble-step1-v1
          - open-top-sunhat-step1-v1
          - pimple-extractor-step1-v1
          - mens-hiking-shoes-step1-v1
          - drawer-desk-step1-v1
          - drawer-module-step1-v1
          - egg-piercer-step1-v1
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      NAVER_SEARCHAD_API_KEY: ${{ secrets.NAVER_SEARCHAD_API_KEY }}
      NAVER_SEARCHAD_SECRET_KEY: ${{ secrets.NAVER_SEARCHAD_SECRET_KEY }}
      NAVER_SEARCHAD_CUSTOMER_ID: ${{ secrets.NAVER_SEARCHAD_CUSTOMER_ID }}
      NAVER_API_HUB_CLIENT_ID: ${{ secrets.NAVER_API_HUB_CLIENT_ID }}
      NAVER_API_HUB_CLIENT_SECRET: ${{ secrets.NAVER_API_HUB_CLIENT_SECRET }}
      OPENAI_KEYWORD_ELON_MODEL: ${{ secrets.OPENAI_KEYWORD_ELON_MODEL }}
      KEYWORD_THRESHOLD_EXPERIMENT_LOCAL_RUN: "1"
      NEXT_PUBLIC_SUPABASE_URL: https://price-auth-build-check.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_price_auth_build_check
      PRICE_ADJUSTMENT_ENGINE_INTEGRATION_SECRET: ci-price-adjustment-secret
      PRICE_ADJUSTMENT_AUTOMATION_OWNER_ID: 0c23a96b-1cda-44b6-9c08-1fa1c1b45a36
      EXPERIMENT_SAMPLE: ${{ matrix.sample }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - run: npm ci

      - name: Check experiment credentials without exposing values
        shell: bash
        run: |
          missing=0
          for name in OPENAI_API_KEY NAVER_SEARCHAD_API_KEY NAVER_SEARCHAD_SECRET_KEY NAVER_SEARCHAD_CUSTOMER_ID NAVER_API_HUB_CLIENT_ID NAVER_API_HUB_CLIENT_SECRET; do
            if [ -z "${!name}" ]; then
              echo "$name=missing"
              missing=1
            else
              echo "$name=configured"
            fi
          done
          if [ "$missing" = "1" ]; then
            echo "Required keyword-engine credentials are not all configured as GitHub Actions secrets."
            exit 2
          fi

      - name: Build experiment app
        run: npm run build

      - name: Run one isolated STEP1-fixed threshold matrix
        shell: bash
        run: |
          mkdir -p experiment-results
          result_file="experiment-results/${EXPERIMENT_SAMPLE}.json"
          npm start -- -p 3001 > experiment-results/next-server.log 2>&1 &
          server_pid=$!
          tail -n +1 -F experiment-results/next-server.log &
          tail_pid=$!
          cleanup() {
            kill "$tail_pid" 2>/dev/null || true
            kill "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=0
          for attempt in $(seq 1 90); do
            status=$(curl -sS -o /tmp/plan.json -w "%{http_code}" --max-time 10 \
              "http://127.0.0.1:3001/api/keyword-engine-elon-lab/experiment?sample=${EXPERIMENT_SAMPLE}" || true)
            if [ "$status" = "200" ]; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" != "1" ]; then
            echo "Local experiment server did not become ready."
            cp /tmp/plan.json "$result_file" 2>/dev/null || true
            exit 1
          fi

          request_url="http://127.0.0.1:3001/api/keyword-engine-elon-lab/experiment?sample=${EXPERIMENT_SAMPLE}&step2=55%2C60%2C65%2C70&demand=50%2C55%2C60%2C65&accuracy=80%2C85%2C90%2C95&rounds=3&concurrency=1&mode=run&confirm=RUN_THRESHOLD_EXPERIMENT"
          echo "RUN ${EXPERIMENT_SAMPLE}"
          set +e
          status=$(curl -sS -o "$result_file" -w "%{http_code}" --max-time 3000 "$request_url")
          curl_exit=$?
          set -e
          echo "HTTP $status · curl_exit $curl_exit"

          if [ "$curl_exit" != "0" ]; then
            printf '{"ok":false,"sampleId":"%s","error":"CLIENT_TIMEOUT_OR_NETWORK","curlExit":%s}\n' \
              "$EXPERIMENT_SAMPLE" "$curl_exit" > "$result_file"
            exit 1
          fi
          if [ "$status" != "200" ]; then
            cat "$result_file" || true
            exit 1
          fi

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          sample = os.environ["EXPERIMENT_SAMPLE"]
          path = Path("experiment-results") / f"{sample}.json"
          payload = json.loads(path.read_text(encoding="utf-8"))
          if payload.get("ok") is not True:
              raise SystemExit(f"Experiment payload was not ok: {payload.get('message') or payload.get('error')}")
          result = payload.get("result") or {}
          if result.get("valid") is not True:
              raise SystemExit("Experiment result did not pass validity checks")
          validity = result.get("validity") or {}
          print(json.dumps({
              "sample": sample,
              "engine": result.get("engine"),
              "validity": validity,
              "timings": result.get("timings"),
              "cache": result.get("cache"),
          }, ensure_ascii=False, indent=2))
          PY

      - name: Upload experiment result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keyword-threshold-broad-v2-${{ matrix.sample }}
          path: experiment-results/
          if-no-files-found: error
          retention-days: 14
