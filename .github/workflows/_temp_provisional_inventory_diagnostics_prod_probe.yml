name: Temporary Provisional Inventory Diagnostics Production Probe

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Wait for production provisional inventory diagnostics page
        shell: bash
        run: |
          set -euo pipefail
          url='https://commerce-os-ops-center.vercel.app/stage8-provisional-inventory-diagnostics'
          ready=0
          for i in $(seq 1 75); do
            body="$(mktemp)"
            out="$(curl -L -sS --connect-timeout 10 --max-time 180 -o "$body" -w '%{http_code} %{time_total}' "$url" || true)"
            http="$(echo "$out" | awk '{print $1}')"
            elapsed="$(echo "$out" | awk '{print $2}')"
            text="$(cat "$body" | python -c 'import html,re,sys; raw=sys.stdin.read(); raw=re.sub(r"<script[\s\S]*?</script>"," ",raw,flags=re.I); raw=re.sub(r"<style[\s\S]*?</style>"," ",raw,flags=re.I); raw=re.sub(r"<[^>]+>"," ",raw); print(re.sub(r"\s+"," ",html.unescape(raw)).strip()[:300000])')"
            echo "PROBE $i HTTP=$http ELAPSED=${elapsed}s"
            if [ "$http" = '200' ] && echo "$text" | grep -q '추정재고 불확실성 · 발주민감도 진단'; then
              echo '--- PROVISIONAL INVENTORY DIAGNOSTICS PRODUCTION ---'
              echo "$text"
              echo "ELAPSED_SECONDS=$elapsed"
              echo "$text" | grep -q 'READY_READ_ONLY'
              echo "$text" | grep -q '증명 정체성 5개'
              echo "$text" | grep -q 'Actual write 0 · READ ONLY'
              echo "$text" | grep -q 'DIAGNOSTIC ONLY · INVENTORY PROMOTION OFF · DRAFT CREATION OFF'
              echo "$text" | grep -q 'BGG1-1 aaa316'
              echo "$text" | grep -q 'BGB1-1 aaa266'
              echo "$text" | grep -q 'BGD2-1 aaa409'
              ready=1
              break
            fi
            sleep 8
          done
          test "$ready" = '1'
