name: Reliability Learning Core

on:
  pull_request:
    paths:
      - "src/lib/reliability/**"
      - "src/lib/reliabilityLearningModule.ts"
      - "src/lib/opsWorkspace.ts"
      - "src/app/page.tsx"
      - "src/components/dashboard/ReliabilityLearningHomeCard.tsx"
      - "src/app/reliability/**"
      - "src/app/api/integrations/reliability/**"
      - "src/app/api/cron/reliability-learning/**"
      - "src/app/api/cron/product-decision-live-refresh/route.ts"
      - "src/lib/opsModuleRegistry.ts"
      - "tests/reliabilityLearningCore.test.mjs"
      - "tests/reliabilityLearningAnalyzer.test.mjs"
      - "tests/reliabilityImprovementImpact.test.mjs"
      - "scripts/check-openai-cost-attribution.mjs"
      - "supabase/migrations/*reliability*.sql"
      - "vercel.json"
      - ".github/workflows/reliability-learning-core.yml"
  push:
    branches: [main]
    paths:
      - "src/lib/reliability/**"
      - "src/lib/reliabilityLearningModule.ts"
      - "src/lib/opsWorkspace.ts"
      - "src/app/page.tsx"
      - "src/components/dashboard/ReliabilityLearningHomeCard.tsx"
      - "src/app/reliability/**"
      - "src/app/api/integrations/reliability/**"
      - "src/app/api/cron/reliability-learning/**"
      - "src/app/api/cron/product-decision-live-refresh/route.ts"
      - "src/lib/opsModuleRegistry.ts"
      - "tests/reliabilityLearningCore.test.mjs"
      - "tests/reliabilityLearningAnalyzer.test.mjs"
      - "tests/reliabilityImprovementImpact.test.mjs"
      - "scripts/check-openai-cost-attribution.mjs"
      - "supabase/migrations/*reliability*.sql"
      - "vercel.json"
      - ".github/workflows/reliability-learning-core.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Lint reliability integration
        run: >-
          npx eslint
          src/lib/reliability/reliabilityEvent.ts
          src/lib/reliability/reliabilityIngestAuth.ts
          src/lib/reliability/reliabilityStore.ts
          src/lib/reliability/reliabilityDashboard.ts
          src/lib/reliability/reliabilityLearningPolicy.ts
          src/lib/reliability/reliabilityLearningAnalyzer.ts
          src/lib/reliability/reliabilityOpenAiClient.ts
          src/lib/reliability/reliabilityImpactEvaluator.ts
          src/lib/reliabilityLearningModule.ts
          src/lib/opsWorkspace.ts
          src/app/page.tsx
          src/components/dashboard/ReliabilityLearningHomeCard.tsx
          src/app/api/integrations/reliability/events/route.ts
          src/app/api/cron/reliability-learning/route.ts
          src/app/api/cron/product-decision-live-refresh/route.ts
          src/app/reliability/page.tsx
          tests/reliabilityLearningCore.test.mjs
          tests/reliabilityLearningAnalyzer.test.mjs
          tests/reliabilityImprovementImpact.test.mjs
      - name: Verify dedicated OpenAI cost lane
        run: node scripts/check-openai-cost-attribution.mjs
      - name: Run permanent reliability regressions
        run: >-
          node --experimental-strip-types --test
          tests/reliabilityLearningCore.test.mjs
          tests/reliabilityLearningAnalyzer.test.mjs
          tests/reliabilityImprovementImpact.test.mjs
