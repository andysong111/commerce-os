name: Temporary Sales Baseline Immutable Completion Patch

on:
  push:
    branches:
      - fix/sales-baseline-immutable-completion

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[baseline-immutable-patched]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sales-baseline-immutable-completion
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: node scripts/patch-sales-baseline-immutable-completion.mjs
      - name: Test baseline completion safety
        run: node --experimental-strip-types --test tests/productMasterShoplingSalesBackfill.test.mjs tests/productMasterShoplingSalesIncremental.test.mjs
      - name: Lint changed files
        run: npx eslint src/lib/productMasterShoplingSalesBackfill.ts tests/productMasterShoplingSalesBackfill.test.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Keep verified sales baseline completion immutable [baseline-immutable-patched]"
          git push origin HEAD:fix/sales-baseline-immutable-completion
