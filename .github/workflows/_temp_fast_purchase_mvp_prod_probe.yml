name: Temporary Fast Purchase MVP Production Probe

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Read production fast purchase MVP
        shell: bash
        run: |
          set -euo pipefail
          url='https://commerce-os-ops-center.vercel.app/fast-purchase-mvp'
          body="$(mktemp)"
          out="$(curl -L -sS --connect-timeout 10 --max-time 180 -o "$body" -w '%{http_code} %{time_total}' "$url" || true)"
          http="$(echo "$out" | awk '{print $1}')"
          elapsed="$(echo "$out" | awk '{print $2}')"
          text="$(cat "$body" | python -c 'import html,re,sys; raw=sys.stdin.read(); raw=re.sub(r"<script[\s\S]*?</script>"," ",raw,flags=re.I); raw=re.sub(r"<style[\s\S]*?</style>"," ",raw,flags=re.I); raw=re.sub(r"<[^>]+>"," ",raw); print(re.sub(r"\s+"," ",html.unescape(raw)).strip()[:400000])')"
          echo "HTTP=$http ELAPSED=${elapsed}s"
          echo "$text"
          test "$http" = '200'
          echo "$text" | grep -q '빠른 발주안 · MVP'
          echo "$text" | grep -q '수동 발주만 · 자동주문 0'
          echo "$text" | grep -q '오늘 판단 가능'
