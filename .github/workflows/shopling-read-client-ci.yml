name: Shopling Read Client CI

on:
  pull_request:
    paths:
      - "src/lib/shopling/simpleXml.ts"
      - "src/lib/shopling/shoplingReadClient.ts"
      - "src/lib/shopling/shoplingNormalize.ts"
      - "tests/shoplingReadClient.test.mjs"
      - ".github/workflows/shopling-read-client-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shopling-read-client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  read-client-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Lint Shopling read client
        run: >-
          npx eslint
          src/lib/shopling/simpleXml.ts
          src/lib/shopling/shoplingReadClient.ts
          src/lib/shopling/shoplingNormalize.ts
          tests/shoplingReadClient.test.mjs
      - name: Run Shopling read parser and normalization tests
        run: >-
          node --experimental-strip-types --test
          tests/shoplingReadClient.test.mjs
      - name: Build Ops Center
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://shopling-read-client-build-check.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_shopling_read_client_build_check
