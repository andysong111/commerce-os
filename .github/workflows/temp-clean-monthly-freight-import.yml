name: Clean monthly freight parser import

on:
  push:
    branches:
      - feature/monthly-freight-barcode-flow

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/monthly-freight-barcode-flow
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collapse duplicate monthly context imports
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/lib/freightApplicationParser.ts')
          text = p.read_text()
          line = 'import { applyActiveFreightMonthlyOrderContext } from "./freightMonthlyOrderContext.ts";\n'
          count = text.count(line)
          if count < 1:
              raise SystemExit('monthly context import missing')
          first = text.find(line)
          text = text.replace(line, '')
          text = text[:first] + line + text[first:]
          p.write_text(text)
          print(f'collapsed {count} imports to 1')
          PY
      - name: Run focused matching tests
        run: node --experimental-strip-types --test tests/freightMonthlyOrderContext.test.mjs
      - name: Commit cleanup if needed
        run: |
          if git diff --quiet; then
            echo "No cleanup changes required."
            exit 0
          fi
          git config user.name "andysong111"
          git config user.email "andy0801a@gmail.com"
          git add src/lib/freightApplicationParser.ts
          git commit -m "Clean monthly freight parser import duplication"
          git push origin HEAD:feature/monthly-freight-barcode-flow
