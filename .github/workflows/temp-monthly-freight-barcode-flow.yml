name: Monthly freight barcode integration patch

on:
  push:
    branches:
      - feature/monthly-freight-barcode-flow

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/monthly-freight-barcode-flow
          fetch-depth: 0
      - name: Apply source patch
        run: python scripts/temp_monthly_freight_patch.py
      - name: Commit source patch
        run: |
          if git diff --quiet; then
            echo "No patch changes required."
            exit 0
          fi
          git config user.name "andysong111"
          git config user.email "andy0801a@gmail.com"
          git add src/app/china-order-manager/page.tsx src/lib/internalChinaMonthlyPurchaseSummary.ts src/lib/freightApplicationParser.ts
          git commit -m "Integrate monthly freight barcode flow [monthly-freight-patch]"
          git push origin HEAD:feature/monthly-freight-barcode-flow
