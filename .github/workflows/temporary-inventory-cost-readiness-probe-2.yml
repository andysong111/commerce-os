name: Temporary Inventory Cost Readiness Probe 2

on:
  pull_request:

permissions:
  contents: read

jobs:
  production-status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read production inventory cost readiness
        shell: bash
        run: |
          set -euo pipefail
          base='https://commerce-os-ops-center.vercel.app'
          curl -L -sS --connect-timeout 10 --max-time 60 \
            "$base/product-master/inventory-cost-readiness" \
            | python -c 'import html,re,sys; raw=sys.stdin.read(); raw=re.sub(r"<script[\s\S]*?</script>"," ",raw,flags=re.I); raw=re.sub(r"<style[\s\S]*?</style>"," ",raw,flags=re.I); raw=re.sub(r"<[^>]+>"," ",raw); print(re.sub(r"\s+"," ",html.unescape(raw)).strip()[:12000])'
