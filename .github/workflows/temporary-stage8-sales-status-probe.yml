name: Temporary Stage8 Sales Status Probe

on:
  push:
    branches:
      - ops/stage8-canonical-sales-recollect-20260809

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - name: Read production canonical sales status
        shell: bash
        run: |
          set -euo pipefail
          curl -L -sS --connect-timeout 10 --max-time 60 \
            'https://commerce-os-ops-center.vercel.app/stage8-sales-events' \
            | python -c 'import html,re,sys; raw=sys.stdin.read(); raw=re.sub(r"<script[\s\S]*?</script>"," ",raw,flags=re.I); raw=re.sub(r"<style[\s\S]*?</style>"," ",raw,flags=re.I); raw=re.sub(r"<[^>]+>"," ",raw); print(re.sub(r"\s+"," ",html.unescape(raw)).strip()[:24000])'
