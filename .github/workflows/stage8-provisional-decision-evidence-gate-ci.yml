name: Stage8 Provisional Decision Evidence Gate CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  decision-evidence-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Lint decision evidence gate files
        run: >-
          npx eslint
          src/lib/stage8ProvisionalDecisionEvidenceGate.ts
          src/app/stage8-provisional-decision-evidence-gate/page.tsx
      - name: Test decision evidence gate safety
        run: node --test tests/stage8ProvisionalDecisionEvidenceGate.test.mjs
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://stage8-provisional-decision-evidence-gate-ci.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_stage8_provisional_decision_evidence_gate_ci
          PRICE_ADJUSTMENT_ENGINE_INTEGRATION_SECRET: ci-price-adjustment-secret
          PRICE_ADJUSTMENT_AUTOMATION_OWNER_ID: 0c23a96b-1cda-44b6-9c08-1fa1c1b45a36
