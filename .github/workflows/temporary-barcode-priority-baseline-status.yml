name: Temporary Barcode Priority Baseline Status

on:
  pull_request:

permissions:
  contents: read

jobs:
  production-status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Advance one guarded incremental recovery step after verification fix
        shell: bash
        run: |
          set -euo pipefail
          base='https://commerce-os-ops-center.vercel.app'
          echo 'RUN_NEXT_BEGIN'
          curl -L -sS --connect-timeout 10 --max-time 90 \
            -H 'Origin: https://commerce-os-ops-center.vercel.app' \
            -H 'Content-Type: application/json' \
            -X POST \
            --data '{"action":"run-next"}' \
            "$base/api/product-master/shopling-sales-incremental" \
            | python -c 'import json,sys; p=json.load(sys.stdin); r=p.get("result") or {}; keys=["processed","state","phase","written","remaining","failureKind","message"]; print("RUN_NEXT",json.dumps({"ok":p.get("ok"),"error":p.get("message"),**{k:r.get(k) for k in keys}},ensure_ascii=False))'
          echo 'RUN_NEXT_END'
          sleep 2
          echo 'INCREMENTAL_STATUS_BEGIN'
          curl -L -sS --connect-timeout 10 --max-time 30 "$base/product-master/shopling-sales-incremental" \
            | python -c 'import html,re,sys; raw=sys.stdin.read(); raw=re.sub(r"<script[\s\S]*?</script>"," ",raw,flags=re.I); raw=re.sub(r"<style[\s\S]*?</style>"," ",raw,flags=re.I); raw=re.sub(r"<[^>]+>"," ",raw); print(re.sub(r"\s+"," ",html.unescape(raw)).strip()[:5000])'
          echo 'INCREMENTAL_STATUS_END'
