name: Temporary Barcode Priority Baseline Status

on:
  pull_request:

permissions:
  contents: read

jobs:
  production-status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Advance one read-only production baseline step
        shell: bash
        run: |
          set -euo pipefail
          base='https://commerce-os-ops-center.vercel.app'
          echo 'RUN_NEXT_BEGIN'
          curl -L -sS --connect-timeout 10 --max-time 75 \
            -H 'Origin: https://commerce-os-ops-center.vercel.app' \
            -H 'Content-Type: application/json' \
            -X POST \
            --data '{"action":"run-next"}' \
            "$base/api/product-master/shopling-sales-backfill"
          echo
          echo 'RUN_NEXT_END'
          sleep 2
          echo 'STATUS_BEGIN'
          curl -L -sS --connect-timeout 10 --max-time 30 \
            "$base/product-master/shopling-sales-backfill" \
            | python -c 'import html,re,sys; raw=sys.stdin.read(); raw=re.sub(r"<script[\s\S]*?</script>"," ",raw,flags=re.I); raw=re.sub(r"<style[\s\S]*?</style>"," ",raw,flags=re.I); raw=re.sub(r"<[^>]+>"," ",raw); print(re.sub(r"\s+"," ",html.unescape(raw)).strip()[:6000])'
          echo 'STATUS_END'
