name: Price Adjustment Bulk CI

on:
  pull_request:
    paths:
      - 'src/app/api/shopling-price-adjustment/**'
      - 'src/app/login/**'
      - 'src/app/shopling-price-adjustment-runner/**'
      - 'src/components/shopling-price-adjustment/**'
      - 'src/lib/shoplingPriceAdjustmentAuth.ts'
      - 'src/lib/shoplingPriceAdjustmentApiClient.ts'
      - 'src/lib/shoplingPriceAdjustmentIdentity.ts'
      - 'src/lib/shoplingPriceAdjustmentResponse.ts'
      - 'src/lib/shoplingPriceAdjustmentBatchCanaryRunner.ts'
      - 'src/lib/shoplingPriceAdjustmentBulkOrchestrator.ts'
      - 'src/lib/shoplingPriceAdjustmentBulkServer.ts'
      - 'src/lib/supabase/browser.ts'
      - 'src/lib/supabase/browserConfig.ts'
      - 'src/lib/supabase/config.ts'
      - 'src/lib/supabase/currentUser.ts'
      - 'src/lib/supabase/proxy.ts'
      - 'src/lib/supabase/resetSession.ts'
      - 'src/lib/supabase/server.ts'
      - 'src/lib/supabase/session.ts'
      - 'supabase/migrations/*shopling_price_adjustment_bulk*.sql'
      - 'scripts/verify-price-adjustment-bulk-migration.sql'
      - 'scripts/verify-price-auth-client-bundle.mjs'
      - 'scripts/verify-price-auth-route.mjs'
      - 'tests/shoplingPriceAdjustmentAuth.test.mjs'
      - 'tests/shoplingPriceAdjustmentBatchCanary.test.mjs'
      - 'tests/shoplingPriceAdjustmentInputModes.test.mjs'
      - 'tests/shoplingPriceAdjustmentIdentity.test.mjs'
      - 'tests/supabaseSession.test.mjs'
      - 'tests/supabaseSsrAuthRoundTrip.test.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/price-adjustment-bulk-ci.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: node --experimental-strip-types --test tests/shoplingPriceAdjustmentAuth.test.mjs tests/shoplingPriceAdjustmentBatchCanary.test.mjs tests/shoplingPriceAdjustmentIdentity.test.mjs tests/shoplingPriceAdjustmentInputModes.test.mjs tests/supabaseSession.test.mjs tests/supabaseSsrAuthRoundTrip.test.mjs
      - run: psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d postgres -f scripts/verify-price-adjustment-bulk-migration.sql
        env:
          PGPASSWORD: postgres
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://price-auth-build-check.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_price_auth_build_check
      - run: node scripts/verify-price-auth-route.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://price-auth-build-check.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_price_auth_build_check
      - run: node scripts/verify-price-auth-client-bundle.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://price-auth-build-check.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_price_auth_build_check
