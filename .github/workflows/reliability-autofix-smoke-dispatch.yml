name: Reliability Autofix Smoke Dispatch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/reliability-autofix-smoke-dispatch.yml"

permissions:
  contents: read
  actions: write

jobs:
  dispatch-once:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch the existing protected autofix workflow once
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run reliability-safe-autofix.yml --repo "$GITHUB_REPOSITORY" --ref main

