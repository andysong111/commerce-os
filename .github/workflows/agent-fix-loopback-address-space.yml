name: Agent Fix Loopback Address Space

on:
  push:
    branches:
      - agent/fix-loopback-address-space-20260805

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[loopback-address-space-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-loopback-address-space-20260805
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - run: node scripts/agent-fix-loopback-address-space.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public src tests
          git commit -m "Use loopback address space for localhost bridges [loopback-address-space-patched]"
          git push origin HEAD:agent/fix-loopback-address-space-20260805
