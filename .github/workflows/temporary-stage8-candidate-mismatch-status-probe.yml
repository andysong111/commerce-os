name: Temporary Stage8 Candidate Mismatch Status Probe

on:
  push:
    branches:
      - ops/stage8-candidate-mismatch-status-probe
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  status:
    if: >-
      ${{
        (github.event_name == 'push' && github.ref_name == 'ops/stage8-candidate-mismatch-status-probe') ||
        (github.event_name == 'pull_request' && github.head_ref == 'ops/stage8-candidate-mismatch-status-probe')
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Read candidate mismatch evidence status
        shell: bash
        run: |
          set -euo pipefail
          curl -L -sS --connect-timeout 10 --max-time 60 \
            'https://commerce-os-ops-center.vercel.app/stage8-candidate-mismatch-evidence' \
            | python -c 'import html,re,sys; raw=sys.stdin.read(); raw=re.sub(r"<script[\s\S]*?</script>"," ",raw,flags=re.I); raw=re.sub(r"<style[\s\S]*?</style>"," ",raw,flags=re.I); raw=re.sub(r"<[^>]+>"," ",raw); print(re.sub(r"\s+"," ",html.unescape(raw)).strip()[:30000])'
