name: Shopling Account Title Bridge CI

on:
  pull_request:
    paths:
      - "public/shopling-account-title-bridge/**"
      - "src/app/api/shopling-account-title-bridge/**"
      - "src/lib/shoplingTitleKeywordPool.ts"
      - "supabase/migrations/202608300001_shopling_market_pipeline_idempotency_v05.sql"
      - "supabase/migrations/202608300002_shopling_title_diversification_ledger_v053.sql"
      - "tests/shoplingAccountTitleBridge.test.mjs"
      - ".github/workflows/shopling-account-title-bridge-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Check extension JavaScript syntax
        run: >-
          node --check public/shopling-account-title-bridge/content-shopling-account-titles.js &&
          node --check public/shopling-account-title-bridge/content-shopling-product-list-batch.js &&
          node --check public/shopling-account-title-bridge/content-shopling-product-list-registry-bridge.js &&
          node --check public/shopling-account-title-bridge/content-shopling-pipeline.js &&
          node --check public/shopling-account-title-bridge/content-shopling-pipeline-frame-bridge.js &&
          node --check public/shopling-account-title-bridge/background-shopling-root.js &&
          node --check public/shopling-account-title-bridge/background-shopling-title-batch.js &&
          node --check public/shopling-account-title-bridge/background-shopling-title-registry.js &&
          node --check public/shopling-account-title-bridge/background-shopling-seo-keywords.js &&
          node --check public/shopling-account-title-bridge/background-shopling-pipeline.js
      - name: Test extension safety contract
        run: node --test tests/shoplingAccountTitleBridge.test.mjs
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://shopling-title-bridge-build-check.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_shopling_title_bridge_build_check
          SUPABASE_SECRET_KEY: sb_secret_shopling_title_bridge_build_check
          PRICE_ADJUSTMENT_ENGINE_INTEGRATION_SECRET: ci-price-adjustment-secret
          PRICE_ADJUSTMENT_AUTOMATION_OWNER_ID: 0c23a96b-1cda-44b6-9c08-1fa1c1b45a36
