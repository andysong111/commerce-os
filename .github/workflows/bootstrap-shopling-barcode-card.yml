name: Bootstrap Shopling Barcode Card Registry

on:
  push:
    branches:
      - feat/shopling-barcode-sync-card
    paths:
      - ".github/workflows/bootstrap-shopling-barcode-card.yml"

permissions:
  contents: write

jobs:
  update-registry:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/shopling-barcode-sync-card
          fetch-depth: 0

      - name: Insert module card and remove bootstrap workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("src/lib/moduleRegistry.ts")
          text = path.read_text(encoding="utf-8")
          if 'id: "shopling-option-barcode-sync"' not in text:
              marker = '''  {
              id: "engine-env-setup",'''
              block = '''  {
              id: "shopling-option-barcode-sync",
              title: "샵플링 옵션 바코드 동기화",
              navigationLabel: "샵플링 옵션 바코드 동기화",
              description:
                "옵션자체관리코드를 같은 옵션 위치의 바코드로 1회 전수 동기화합니다.",
              status: "runner_scaffold",
              route: "/shopling-barcode-sync",
              category: "채널 자동화",
              inputType: "샵플링 전체 상품 옵션",
              outputType: "변경계획, 수정 전 백업, 재조회 검증 결과",
              historySupport: false,
              externalProject: true,
              note: "외부 commerce-os-shopling-barcode-sync-11 GitHub Actions만 실행하며 OPS Center는 샵플링 API를 직접 호출하지 않습니다.",
              helperNote: "1회 전수 동기화",
              actionLabel: "동기화 열기",
              safetyBadge: "10개 테스트 후 전체",
            },
          {
              id: "engine-env-setup",'''
              if marker not in text:
                  raise SystemExit("module registry insertion marker not found")
              text = text.replace(marker, block, 1)
              path.write_text(text, encoding="utf-8")
          Path(".github/workflows/bootstrap-shopling-barcode-card.yml").unlink()
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/moduleRegistry.ts .github/workflows/bootstrap-shopling-barcode-card.yml
          git commit -m "feat: register Shopling barcode sync card"
          git push origin HEAD:feat/shopling-barcode-sync-card
