name: One-shot Approved Fast Purchase Queue Handoff

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  queue-approved-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SECRET_PRODUCT_DECISION: ${{ secrets.PRODUCT_DECISION_TO_CHINA_ORDER_SECRET }}
      SECRET_CHINA: ${{ secrets.CHINA_ORDER_MANAGER_INTEGRATION_SECRET }}
      SECRET_PRICE: ${{ secrets.PRICE_ADJUSTMENT_ENGINE_INTEGRATION_SECRET }}
      SECRET_SYNC: ${{ secrets.SYNC_JOB_SECRET }}
    steps:
      - name: Queue the approved 5-SKU internal Draft for China order-draft import
        shell: bash
        run: |
          set -euo pipefail
          origin='https://commerce-os-ops-center.vercel.app'
          push_url="$origin/api/integrations/purchase-plan-draft-queue/push"
          pending_url="$origin/api/integrations/purchase-plan-draft-queue/pending?sourceRunId=fast-purchase-draft%3A82d5c90bbf302be6670e"

          payload="$(python - <<'PY'
          import json
          print(json.dumps({
            "sourceRunId":"fast-purchase-draft:82d5c90bbf302be6670e",
            "periodLabel":"2026-08-10 빠른 발주안",
            "items":[
              {"barcode":"BAD2-2","modelNumber":"LEGACY-BAD2-2","productName":"텀블러재떨이 자동차 컵홀더 거치대 승용차","quantity":44,"unitCostKrw":0,"reason":"빠른 발주안 사용자 확정 · 재고 매우 부족"},
              {"barcode":"BAC4-2","modelNumber":"LEGACY-BAC4-1","productName":"배추담요 웃긴담요 특이한담요 블랭킷 선물","quantity":32,"unitCostKrw":0,"reason":"빠른 발주안 사용자 확정 · 별도 사이즈 옵션 · 재고 매우 부족"},
              {"barcode":"BAC6-1","modelNumber":"LEGACY-BAC6-1","productName":"의자팔걸이쿠션 팔목받침대 메모리폼","quantity":22,"unitCostKrw":0,"reason":"빠른 발주안 사용자 확정 · 재고 매우 부족"},
              {"barcode":"BAC4-1","modelNumber":"LEGACY-BAC4-1","productName":"배추담요 웃긴담요 특이한담요 블랭킷 선물","quantity":17,"unitCostKrw":0,"reason":"빠른 발주안 사용자 확정 · 별도 사이즈 옵션 · 재고 매우 부족"},
              {"barcode":"BGE4-2","modelNumber":"LEGACY-BGE4-2","productName":"정글모 사하라캡 뒷목가리개 성인플랩캡","quantity":14,"unitCostKrw":0,"reason":"빠른 발주안 사용자 확정 · 재고 매우 부족"}
            ]
          }, ensure_ascii=False))
          PY
          )"

          valid_secret=''
          result="$(mktemp)"
          status=''
          for candidate in "$SECRET_PRODUCT_DECISION" "$SECRET_CHINA" "$SECRET_PRICE" "$SECRET_SYNC"; do
            [ -n "$candidate" ] || continue
            status="$(curl -L -sS --connect-timeout 10 --max-time 120 -o "$result" -w '%{http_code}' \
              -X POST "$push_url" \
              -H 'Accept: application/json' \
              -H 'Content-Type: application/json' \
              -H "x-commerce-os-integration-secret: $candidate" \
              --data-binary "$payload" || true)"
            if [ "$status" = '401' ]; then
              continue
            fi
            valid_secret="$candidate"
            break
          done
          test -n "$valid_secret"
          echo "PUSH_STATUS=$status"
          cat "$result"
          test "$status" = '200'
          python - "$result" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1],encoding='utf-8'))
          assert p.get('ok') is True,p
          assert p.get('saved') == 5,p
          assert p.get('sourceRunId') == 'fast-purchase-draft:82d5c90bbf302be6670e',p
          assert p.get('status') in ('PENDING','IMPORTED'),p
          print('QUEUE_PUSH_VERIFIED=5_SKU')
          print('QUEUE_STATUS='+str(p.get('status')))
          PY

          pending="$(mktemp)"
          pending_status="$(curl -L -sS --connect-timeout 10 --max-time 120 -o "$pending" -w '%{http_code}' \
            "$pending_url" \
            -H 'Accept: application/json' \
            -H "x-commerce-os-integration-secret: $valid_secret")"
          echo "PENDING_STATUS=$pending_status"
          test "$pending_status" = '200'
          python - "$pending" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1],encoding='utf-8'))
          assert p.get('ok') is True,p
          entries=p.get('entries') or []
          if entries:
            assert len(entries)==1,entries
            e=entries[0]
            assert e.get('sourceRunId')=='fast-purchase-draft:82d5c90bbf302be6670e',e
            items=e.get('items') or []
            assert len(items)==5,items
            assert sum(int(i.get('quantity') or 0) for i in items)==129,items
            print('PENDING_QUEUE_VERIFIED=5_SKU_129')
          else:
            print('PENDING_QUEUE_EMPTY=ALREADY_IMPORTED_OR_ACKED')
          print('EXTERNAL_CHINA_ORDER_EXECUTED=false')
          PY
