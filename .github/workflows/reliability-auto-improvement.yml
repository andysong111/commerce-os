name: Reliability Auto Improvement

on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write
  statuses: read
  id-token: write

concurrency:
  group: reliability-auto-improvement-${{ github.repository }}
  cancel-in-progress: false

jobs:
  improve:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OPS_RELIABILITY_BASE_URL: https://commerce-os-ops-center.vercel.app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Run guarded low-risk self-improvement
        run: node scripts/reliability-auto-improvement-worker.mjs run
