name: Temporary Stage8 Readiness Probe

on:
  pull_request:

permissions:
  contents: read

jobs:
  production-status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read production Stage8 readiness
        shell: bash
        run: |
          set -euo pipefail
          url='https://commerce-os-ops-center.vercel.app/stage8-readiness'
          curl -L -sS --connect-timeout 10 --max-time 120 "$url" \
            | python -c 'import html,re,sys; raw=sys.stdin.read(); raw=re.sub(r"<script[\s\S]*?</script>"," ",raw,flags=re.I); raw=re.sub(r"<style[\s\S]*?</style>"," ",raw,flags=re.I); raw=re.sub(r"<[^>]+>"," ",raw); print(re.sub(r"\s+"," ",html.unescape(raw)).strip()[:20000])'
