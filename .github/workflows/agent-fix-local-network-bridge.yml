name: Agent Fix Local Network Bridge

on:
  push:
    branches:
      - agent/fix-chrome-local-network-bridge-20260805

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[local-network-bridge-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-chrome-local-network-bridge-20260805
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Apply Chrome local network compatibility patch
        run: node scripts/agent-fix-local-network-bridge.mjs
      - name: Commit patched sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public src tests
          git commit -m "Fix Chrome local network bridge connection [local-network-bridge-patched]"
          git push origin HEAD:agent/fix-chrome-local-network-bridge-20260805
