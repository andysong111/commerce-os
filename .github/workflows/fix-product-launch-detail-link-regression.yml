name: Fix product launch detail and link regression

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.event.pull_request.head.ref == 'fix/product-launch-detail-link-regression-20260806'
    runs-on: ubuntu-latest
    steps:
      - name: Check out patch branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm
      - name: Apply regression fix
        run: |
          node --check scripts/run-product-launch-detail-link-regression-fix.mjs
          node scripts/run-product-launch-detail-link-regression-fix.mjs
          node --check public/product-launch-tracker-app/optimized-app.js
          node --check public/product-launch-tracker-app/detail-page-dock.js
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Focused product launch tests
        run: node --experimental-strip-types --test tests/productLaunchTrackerOptimized.test.mjs tests/productLaunchTrackerOptimizedContracts.test.mjs tests/productLaunchTrackerSorting.test.mjs
      - name: Full-suite differential against main
        run: |
          set -e
          current_root="$PWD"
          baseline_root="/tmp/product-launch-main-baseline"
          git worktree add --detach "$baseline_root" origin/main
          ln -s "$current_root/node_modules" "$baseline_root/node_modules"

          run_suite() {
            root="$1"
            output="$2"
            : > "$output"
            for file in "$root"/tests/*.test.mjs; do
              rel="tests/$(basename "$file")"
              if ! (cd "$root" && node --experimental-strip-types --test "$rel" > /tmp/product-launch-suite.log 2>&1); then
                basename "$file" >> "$output"
              fi
            done
            sort -u -o "$output" "$output"
          }

          run_suite "$baseline_root" /tmp/main-failures.txt
          run_suite "$current_root" /tmp/branch-failures.txt
          comm -13 /tmp/main-failures.txt /tmp/branch-failures.txt > /tmp/new-failures.txt

          echo "BASELINE_FAILING_TEST_FILES"
          cat /tmp/main-failures.txt || true
          echo "BRANCH_FAILING_TEST_FILES"
          cat /tmp/branch-failures.txt || true

          if [ -s /tmp/new-failures.txt ]; then
            echo "NEW_FAILING_TEST_FILES"
            cat /tmp/new-failures.txt
            while IFS= read -r file; do
              echo "===== $file ====="
              node --experimental-strip-types --test "tests/$file" || true
            done < /tmp/new-failures.txt
            exit 1
          fi
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Diff safety check
        run: git diff --check
      - name: Commit verified source changes
        run: |
          rm -f scripts/fix-product-launch-detail-link-regression.mjs
          rm -f scripts/run-product-launch-detail-link-regression-fix.mjs
          rm -f .github/workflows/fix-product-launch-detail-link-regression.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix: restore launch detail action and server link lookup"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
