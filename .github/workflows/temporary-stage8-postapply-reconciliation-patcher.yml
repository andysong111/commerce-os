name: Temporary Stage8 Post Apply Reconciliation Patcher

on:
  push:
    branches:
      - feat/stage8-postapply-canonical-reconciliation
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: >-
      ${{
        (github.event_name == 'push' && github.ref_name == 'feat/stage8-postapply-canonical-reconciliation' && !contains(github.event.head_commit.message, '[postapply-recon-patched]')) ||
        (github.event_name == 'pull_request' && github.head_ref == 'feat/stage8-postapply-canonical-reconciliation')
      }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/stage8-postapply-canonical-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Fix post-apply reconciliation compile issues
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/lib/stage8PostApplyCanonicalReconciliation.ts')
          text = path.read_text(encoding='utf-8')
          old_import = '''import {
            buildCandidateRollingRows,
            loadLatestCandidateSalesSnapshot,
            type CandidateRollingSalesRow,
          } from "@/lib/stage8CandidateDemandParity";'''.replace('          ', '')
          new_import = '''import {
            buildCandidateRollingRows,
            loadLatestCandidateSalesSnapshot,
          } from "@/lib/stage8CandidateDemandParity";'''.replace('          ', '')
          if old_import not in text:
              raise SystemExit('unused CandidateRollingSalesRow import pattern missing')
          text = text.replace(old_import, new_import, 1)
          if 'function reconciliationFingerprint(input:' not in text:
              raise SystemExit('reconciliation fingerprint function pattern missing')
          text = text.replace(
              'function reconciliationFingerprint(input:',
              'function makeReconciliationFingerprint(input:',
              1,
          )
          needle = 'const reconciliationFingerprint = ready\n    ? reconciliationFingerprint({'
          if needle not in text:
              raise SystemExit('shadowing call pattern missing')
          text = text.replace(
              needle,
              'const reconciliationFingerprint = ready\n    ? makeReconciliationFingerprint({',
              1,
          )
          path.write_text(text, encoding='utf-8')
      - name: Focused tests
        run: >-
          node --experimental-strip-types --test
          tests/stage8PostApplyCanonicalReconciliation.test.mjs
          tests/stage8CandidateDemandParity.test.mjs
          tests/productMasterCanonicalSalesAudit.test.mjs
      - name: Lint
        run: npx eslint src/lib/stage8PostApplyCanonicalReconciliation.ts src/app/stage8-postapply-canonical-reconciliation/page.tsx
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://price-auth-build-check.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_price_auth_build_check
          PRICE_ADJUSTMENT_ENGINE_INTEGRATION_SECRET: ci-price-adjustment-secret
          PRICE_ADJUSTMENT_AUTOMATION_OWNER_ID: 0c23a96b-1cda-44b6-9c08-1fa1c1b45a36
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/stage8PostApplyCanonicalReconciliation.ts
          if git diff --cached --quiet; then
            echo 'No reconciliation compile patch needed.'
            exit 0
          fi
          git commit -m "Fix post-apply canonical reconciliation [postapply-recon-patched]"
          git push origin HEAD:feat/stage8-postapply-canonical-reconciliation
