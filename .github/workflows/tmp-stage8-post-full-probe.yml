name: Temporary Stage8 Post Full Probe

on:
  pull_request:

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read production Stage8 status after full apply
        shell: bash
        run: |
          set -euo pipefail
          for path in stage8-sales-events stage8-readiness; do
            echo "--- $path ---"
            text="$(curl -L -sS --connect-timeout 10 --max-time 60 "https://commerce-os-ops-center.vercel.app/$path" \
              | python -c 'import html,re,sys; raw=sys.stdin.read(); raw=re.sub(r"<script[\s\S]*?</script>"," ",raw,flags=re.I); raw=re.sub(r"<style[\s\S]*?</style>"," ",raw,flags=re.I); raw=re.sub(r"<[^>]+>"," ",raw); print(re.sub(r"\s+"," ",html.unescape(raw)).strip()[:22000])')"
            echo "$text"
            if [ "$path" = 'stage8-sales-events' ]; then
              echo "$text" | grep -q 'COMPLETED'
              echo "$text" | grep -q '9,386'
            fi
          done
