name: Temporary Historical Receipt Source Readiness Probe

on:
  push:
    branches:
      - ops/historical-receipt-source-readiness-probe-20260809
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  probe:
    if: ${{ github.event_name == 'push' || github.head_ref == 'ops/historical-receipt-source-readiness-probe-20260809' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read production receipt source readiness page
        shell: bash
        run: |
          set -euo pipefail
          url='https://commerce-os-ops-center.vercel.app/stage8-historical-receipt-source'
          body="$(mktemp)"
          code="$(curl -L -sS --connect-timeout 10 --max-time 90 -o "$body" -w '%{http_code}' "$url" || true)"
          echo "HTTP_STATUS=$code"
          text="$(cat "$body" | python -c 'import html,re,sys; raw=sys.stdin.read(); raw=re.sub(r"<script[\s\S]*?</script>"," ",raw,flags=re.I); raw=re.sub(r"<style[\s\S]*?</style>"," ",raw,flags=re.I); raw=re.sub(r"<[^>]+>"," ",raw); print(re.sub(r"\s+"," ",html.unescape(raw)).strip()[:30000])')"
          echo "$text"
          test "$code" = '200'
          echo "$text" | grep -q '과거 확정입고 원가 소스 연결'
          echo "$text" | grep -q '실제 쓰기 0 · READ ONLY'
          if echo "$text" | grep -q '연결 READY'; then
            echo 'RECEIPT_SOURCE_READY=true'
          else
            echo 'RECEIPT_SOURCE_READY=false'
            exit 2
          fi
