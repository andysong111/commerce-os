name: Temporary Stage8 Stocktake Plan Production Probe

on:
  push:
    branches:
      - ops/stage8-stocktake-plan-probe-20260809
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  probe:
    if: ${{ github.event_name == 'push' || github.head_ref == 'ops/stage8-stocktake-plan-probe-20260809' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read production minimum stocktake plan
        run: |
          set -euo pipefail
          url='https://commerce-os-ops-center.vercel.app/stage8-stocktake-intervention-plan'
          body="$(mktemp)"
          code="$(curl -L -sS --connect-timeout 10 --max-time 90 -o "$body" -w '%{http_code}' "$url")"
          text="$(cat "$body" | python -c 'import html,re,sys; raw=sys.stdin.read(); raw=re.sub(r"<script[\s\S]*?</script>"," ",raw,flags=re.I); raw=re.sub(r"<style[\s\S]*?</style>"," ",raw,flags=re.I); raw=re.sub(r"<[^>]+>"," ",raw); print(re.sub(r"\s+"," ",html.unescape(raw)).strip()[:120000])')"
          echo "HTTP $code"
          echo '--- STOCKTAKE INTERVENTION PLAN ---'
          echo "$text"
          test "$code" = '200'
          echo "$text" | grep -q '상태 READY_FOR_OPERATOR_COUNT'
          echo "$text" | grep -q '첫 canary'
          echo "$text" | grep -q '실제 write 0 · READ ONLY'
          echo "$text" | grep -q 'STOCKTAKE write false'
          echo "$text" | grep -q 'PURCHASE write false'
