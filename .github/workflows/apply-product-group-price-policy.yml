name: Apply product group price policy

on:
  push:
    branches:
      - fix/product-group-price-policy-20260803

permissions:
  contents: write

jobs:
  apply-policy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/product-group-price-policy-20260803
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Update only product-group price policy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          core_path = Path('public/product-launch-tracker-app/lib/tracker-core.mjs')
          builder_path = Path('src/lib/productLaunchTrackerShopling.ts')

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {count}')
              return text.replace(old, new, 1)

          core = core_path.read_text(encoding='utf-8')
          core = replace_once(core, '    wholesale1: 1.1,\n', '    wholesale1: 1,\n', 'core wholesale1')
          core = replace_once(core, '    wholesale3: 1,\n', '    wholesale3: 1.1,\n', 'core wholesale3')
          core = replace_once(
              core,
              'export const DEFAULT_POLICY = Object.freeze({\n  version: 1,\n',
              'export const DEFAULT_POLICY = Object.freeze({\n  version: 2,\n',
              'core policy version',
          )
          core = replace_once(
              core,
              'export function normalizePolicy(policy = {}) {\n  const candidate = policy && typeof policy === "object" ? policy : {};\n  const multipliers = candidate.channelMultipliers ?? {};\n  return {\n    ...DEFAULT_POLICY,\n    ...candidate,\n    version: positiveInteger(candidate.version, DEFAULT_POLICY.version),\n',
              'export function normalizePolicy(policy = {}) {\n  const candidate = policy && typeof policy === "object" ? policy : {};\n  const candidateVersion = positiveInteger(candidate.version, 1);\n  const multipliers = candidate.channelMultipliers ?? {};\n  const normalizedMultipliers =\n    candidateVersion < DEFAULT_POLICY.version\n      ? {\n          ...multipliers,\n          wholesale1: DEFAULT_POLICY.channelMultipliers.wholesale1,\n          wholesale3: DEFAULT_POLICY.channelMultipliers.wholesale3,\n        }\n      : multipliers;\n  return {\n    ...DEFAULT_POLICY,\n    ...candidate,\n    version: DEFAULT_POLICY.version,\n',
              'core legacy policy migration',
          )
          core = replace_once(
              core,
              'positiveNumber(multipliers[multiplierKey], DEFAULT_POLICY.channelMultipliers[multiplierKey]),',
              'positiveNumber(normalizedMultipliers[multiplierKey], DEFAULT_POLICY.channelMultipliers[multiplierKey]),',
              'core normalized multiplier use',
          )
          core_path.write_text(core, encoding='utf-8')

          builder = builder_path.read_text(encoding='utf-8')
          builder = replace_once(builder, '  wholesale1: 1.1,\n', '  wholesale1: 1,\n', 'builder wholesale1')
          builder = replace_once(builder, '  wholesale3: 1,\n', '  wholesale3: 1.1,\n', 'builder wholesale3')
          builder = replace_once(
              builder,
              'const DEFAULT_MULTIPLIERS = {\n',
              'const PRODUCT_GROUP_PRICE_POLICY_VERSION = 2;\n\nconst DEFAULT_MULTIPLIERS = {\n',
              'builder policy version constant',
          )
          builder = replace_once(
              builder,
              '  const policy = asRecord(policyInput);\n',
              '  const policy = asRecord(policyInput);\n  const policyVersion = positiveNumber(policy.version, 1);\n',
              'builder policy version read',
          )
          builder = replace_once(
              builder,
              '  const multipliers = asRecord(policy.channelMultipliers);\n',
              '  const multipliers = asRecord(policy.channelMultipliers);\n  const normalizedMultipliers =\n    policyVersion < PRODUCT_GROUP_PRICE_POLICY_VERSION\n      ? {\n          ...multipliers,\n          wholesale1: DEFAULT_MULTIPLIERS.wholesale1,\n          wholesale3: DEFAULT_MULTIPLIERS.wholesale3,\n        }\n      : multipliers;\n',
              'builder legacy policy migration',
          )
          builder = replace_once(
              builder,
              '      multipliers[channel.key],\n',
              '      normalizedMultipliers[channel.key],\n',
              'builder normalized multiplier use',
          )
          builder_path.write_text(builder, encoding='utf-8')

          test_path = Path('tests/productGroupPricePolicy.test.mjs')
          test_path.write_text('''import assert from "node:assert/strict";\nimport test from "node:test";\nimport { readFile } from "node:fs/promises";\n\ntest("상품그룹 기본 가격정책은 도매1 1.00, 도매3 1.10을 사용한다", async () => {\n  const core = await readFile("public/product-launch-tracker-app/lib/tracker-core.mjs", "utf8");\n  const builder = await readFile("src/lib/productLaunchTrackerShopling.ts", "utf8");\n  for (const source of [core, builder]) {\n    assert.match(source, /wholesale1:\\s*1,/);\n    assert.match(source, /wholesale2:\\s*1\\.15,/);\n    assert.match(source, /wholesale3:\\s*1\\.1,/);\n    assert.match(source, /wholesale4:\\s*1\\.3,/);\n    assert.match(source, /retail1:\\s*1\\.3,/);\n    assert.match(source, /retail2:\\s*1\\.4,/);\n    assert.doesNotMatch(source, /wholesale1:\\s*1\\.1,/);\n  }\n  assert.match(core, /version:\\s*2,/);\n  assert.match(core, /candidateVersion < DEFAULT_POLICY\\.version/);\n  assert.match(builder, /policyVersion < PRODUCT_GROUP_PRICE_POLICY_VERSION/);\n});\n''', encoding='utf-8')

          tracked_text = []
          for path in [core_path, builder_path, test_path]:
              tracked_text.append(path.read_text(encoding='utf-8'))
          combined = '\n'.join(tracked_text)
          if 'wholesale1: 1.1,' in combined or 'wholesale3: 1,\n' in combined:
              raise SystemExit('legacy product-group multiplier remains in changed policy files')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Commit verified policy-only change
        shell: bash
        run: |
          rm .github/workflows/apply-product-group-price-policy.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/product-launch-tracker-app/lib/tracker-core.mjs \
                  src/lib/productLaunchTrackerShopling.ts \
                  tests/productGroupPricePolicy.test.mjs \
                  .github/workflows/apply-product-group-price-policy.yml
          git commit -m "Update product group price multipliers"
          git push origin HEAD:fix/product-group-price-policy-20260803
