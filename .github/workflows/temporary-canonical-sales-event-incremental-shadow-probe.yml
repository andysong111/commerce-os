name: Temporary Canonical Sales Event Incremental Shadow Production Probe

on:
  push:
    branches:
      - ops/canonical-sales-event-incremental-shadow-probe-20260809
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  probe:
    if: ${{ github.event_name == 'push' || github.head_ref == 'ops/canonical-sales-event-incremental-shadow-probe-20260809' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wait for exact-event incremental shadow terminal state
        shell: bash
        run: |
          set -euo pipefail
          url='https://commerce-os-ops-center.vercel.app/stage8-canonical-sales-event-incremental-shadow'
          ready=0
          for i in $(seq 1 60); do
            body="$(mktemp)"
            code="$(curl -L -sS --connect-timeout 10 --max-time 90 -o "$body" -w '%{http_code}' "$url" || true)"
            text="$(cat "$body" | python -c 'import html,re,sys; raw=sys.stdin.read(); raw=re.sub(r"<script[\s\S]*?</script>"," ",raw,flags=re.I); raw=re.sub(r"<style[\s\S]*?</style>"," ",raw,flags=re.I); raw=re.sub(r"<[^>]+>"," ",raw); print(re.sub(r"\s+"," ",html.unescape(raw)).strip()[:120000])')"
            echo "PROBE $i HTTP $code"
            echo "$text" | grep -oE '상태 (IDLE|QUEUED|RUNNING|SHADOW_READY|BLOCKED|FAILED)|Source range [0-9]+/[0-9]+|Verify batch [0-9]+/[0-9]+|진행률 [0-9]+%' || true
            if [ "$code" = '200' ] && echo "$text" | grep -q '상태 SHADOW_READY'; then
              echo '--- EXACT EVENT INCREMENTAL SHADOW ---'
              echo "$text"
              echo "$text" | grep -q 'SHADOW READY'
              echo "$text" | grep -q 'SALES EVENT WRITE BLOCKED'
              echo "$text" | grep -q '실제 쓰기 0 · DISABLED'
              echo "$text" | grep -q '미연결 0'
              echo "$text" | grep -q 'identity/time 충돌 0'
              echo "$text" | grep -q '전체 360일 전수검증'
              ready=1
              break
            fi
            if [ "$code" = '200' ] && (echo "$text" | grep -q '상태 FAILED' || echo "$text" | grep -q '상태 BLOCKED'); then
              echo '--- TERMINAL BLOCK ---'
              echo "$text"
              exit 2
            fi
            sleep 15
          done
          test "$ready" = '1'
