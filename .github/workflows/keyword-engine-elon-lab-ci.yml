name: Keyword Engine Elon Lab CI

on:
  pull_request:
    paths:
      - "src/app/api/keyword-engine-elon-lab/**"
      - "src/app/keyword-engine-elon-lab/**"
      - "src/lib/keywordEngineElonLab*"
      - "src/lib/opsModuleRegistry.ts"
      - "src/components/dashboard/OpsDashboardWithSaasTestClone.tsx"
      - "public/keyword-lab-collector/**"
      - "tests/keywordEngineElonLab.test.mjs"
      - "tests/keywordEngineElonLabRuntime.test.mjs"
      - "tests/keywordEngineElonLabClientScoringBridge.test.mjs"
      - "tests/keywordEngineElonLabStep3.test.mjs"
      - "tests/keywordEngineElonLabRecovery.test.mjs"
      - ".github/workflows/keyword-engine-elon-lab-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Lint keyword lab V2 files
        run: >-
          npx eslint
          src/app/api/keyword-engine-elon-lab/route.ts
          src/app/api/keyword-engine-elon-lab/collector-zip/route.ts
          src/app/keyword-engine-elon-lab/page.tsx
          src/app/keyword-engine-elon-lab/layout.tsx
          src/app/keyword-engine-elon-lab/KeywordElonInterruptedRunRecovery.tsx
          src/app/keyword-engine-elon-lab/KeywordElonScoreFetchBridge.tsx
          src/app/keyword-engine-elon-lab/KeywordElonDemandSummary.tsx
          src/app/keyword-engine-elon-lab/KeywordElonStep3Expansion.tsx
          src/lib/keywordEngineElonLabBrowserImport.ts
          src/lib/keywordEngineElonLabModule.ts
          src/lib/keywordEngineElonLabV2.ts
          src/lib/keywordEngineElonLabV2ApiHub.ts
          src/lib/keywordEngineElonLabV2SearchAd.ts
          src/lib/keywordEngineElonLabV2Discovery.ts
          src/lib/keywordEngineElonLabV2MarketRecall.ts
          src/lib/keywordEngineElonLabV2DemandEnrichment.ts
          src/lib/keywordEngineElonLabV2Trend.ts
          src/lib/keywordEngineElonLabV2Scoring.ts
          src/lib/keywordEngineElonLabV2Server.ts
          src/lib/keywordEngineElonLabV2Step3.ts
      - name: Test keyword lab V2 contract
        run: >-
          node --experimental-strip-types --test
          tests/keywordEngineElonLab.test.mjs
          tests/keywordEngineElonLabRuntime.test.mjs
          tests/keywordEngineElonLabClientScoringBridge.test.mjs
          tests/keywordEngineElonLabStep3.test.mjs
          tests/keywordEngineElonLabRecovery.test.mjs
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://price-auth-build-check.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_price_auth_build_check
          PRICE_ADJUSTMENT_ENGINE_INTEGRATION_SECRET: ci-price-adjustment-secret
          PRICE_ADJUSTMENT_AUTOMATION_OWNER_ID: 0c23a96b-1cda-44b6-9c08-1fa1c1b45a36
