name: China Order Ledger CI

on:
  pull_request:
    paths:
      - "src/lib/chinaOrderLedger.ts"
      - "src/lib/internalChinaPurchaseDraft.ts"
      - "src/lib/internalChinaPurchaseBudgetAudit.ts"
      - "src/lib/internalChinaReceipt.ts"
      - "src/lib/monthlyPurchasePolicy.ts"
      - "src/lib/monthlyPurchaseDraftConsolidation.ts"
      - "src/lib/monthlyPurchaseDraftDisplayMetadata.ts"
      - "src/lib/shopling/calendarMonthRevenue.ts"
      - "src/app/api/china-order-ledger/**"
      - "src/app/api/china-order-manager/**"
      - "src/app/china-order-manager/**"
      - "src/components/china-order-manager/**"
      - "src/components/fast-purchase-mvp/FastPurchaseDraftActions.tsx"
      - "tests/chinaOrderLedger.test.mjs"
      - "tests/internalChinaPurchaseDraftMvp.test.mjs"
      - "tests/internalChinaPurchaseBudgetAudit.test.mjs"
      - "tests/internalChinaReceipt.test.mjs"
      - "tests/monthlyPurchasePolicy.test.mjs"
      - "tests/monthlyPurchaseDraftConsolidation.test.mjs"
      - ".github/workflows/china-order-ledger-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: china-order-ledger-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ledger-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Lint China order ledger and monthly purchase budget
        run: >-
          npx eslint
          src/lib/chinaOrderLedger.ts
          src/lib/internalChinaPurchaseDraft.ts
          src/lib/internalChinaPurchaseBudgetAudit.ts
          src/lib/internalChinaReceipt.ts
          src/lib/monthlyPurchasePolicy.ts
          src/lib/monthlyPurchaseDraftConsolidation.ts
          src/lib/monthlyPurchaseDraftDisplayMetadata.ts
          src/lib/shopling/calendarMonthRevenue.ts
          src/app/api/china-order-ledger/events/route.ts
          "src/app/api/china-order-manager/drafts/[draftId]/route.ts"
          src/app/api/china-order-manager/monthly-finalize/route.ts
          src/app/api/china-order-manager/receipts/route.ts
          src/app/china-order-manager/layout.tsx
          src/app/china-order-manager/page.tsx
          "src/app/china-order-manager/drafts/[draftId]/page.tsx"
          src/components/china-order-manager/InternalChinaPurchaseDraftWorkspace.tsx
          src/components/china-order-manager/InternalChinaPurchaseBudgetAudit.tsx
          src/components/china-order-manager/InternalChinaReceiptPanel.tsx
          src/components/china-order-manager/MonthlyDraftConsolidation.tsx
          src/components/fast-purchase-mvp/FastPurchaseDraftActions.tsx
          tests/chinaOrderLedger.test.mjs
          tests/internalChinaPurchaseDraftMvp.test.mjs
          tests/internalChinaPurchaseBudgetAudit.test.mjs
          tests/internalChinaReceipt.test.mjs
          tests/monthlyPurchasePolicy.test.mjs
          tests/monthlyPurchaseDraftConsolidation.test.mjs
      - name: Run China order ledger and monthly budget tests
        run: >-
          node --experimental-strip-types --test
          tests/chinaOrderLedger.test.mjs
          tests/internalChinaPurchaseDraftMvp.test.mjs
          tests/internalChinaPurchaseBudgetAudit.test.mjs
          tests/internalChinaReceipt.test.mjs
          tests/monthlyPurchasePolicy.test.mjs
          tests/monthlyPurchaseDraftConsolidation.test.mjs
      - name: Build Ops Center
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://china-order-ledger-build-check.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_china_order_ledger_build_check
          SUPABASE_SECRET_KEY: sb_secret_china_order_ledger_build_check
          PRODUCT_MASTER_BASE_URL: https://commerce-os-product-master.vercel.app
          PRODUCT_MASTER_INTEGRATION_SECRET: ci-product-master-secret
          SHOPLING_LOGIN_ID: ci-shopling-id
          SHOPLING_COMPANY_ID: ci-shopling-company
          SHOPLING_API_AUTH_KEY: ci-shopling-key
