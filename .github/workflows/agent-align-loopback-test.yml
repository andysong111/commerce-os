name: Agent Align Loopback Test

on:
  push:
    branches:
      - agent/fix-loopback-address-space-20260805

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[loopback-test-aligned]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-loopback-address-space-20260805
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - run: node scripts/agent-align-loopback-test.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/shoplingCategoryLocalUpdate.test.mjs
          git commit -m "Align category regression with loopback [loopback-test-aligned]"
          git push origin HEAD:agent/fix-loopback-address-space-20260805
