name: Temporary Stage8 Post Apply Parity Runner

on:
  push:
    branches:
      - ops/stage8-postapply-parity-run-20260809
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  parity:
    if: >-
      ${{
        (github.event_name == 'push' && github.ref_name == 'ops/stage8-postapply-parity-run-20260809') ||
        (github.event_name == 'pull_request' && github.head_ref == 'ops/stage8-postapply-parity-run-20260809')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Wait for verified full apply then compare persisted canonical demand
        shell: bash
        run: |
          set -euo pipefail
          base='https://commerce-os-ops-center.vercel.app'
          sales_api="$base/api/product-master/shopling-sales-events"
          sales_page="$base/stage8-sales-events"
          parity_api="$base/api/stage8/canonical-demand-parity"
          parity_page="$base/stage8-demand-parity"

          completed=0
          for i in $(seq 1 200); do
            f="$(mktemp)"
            code="$(curl -L -sS --connect-timeout 10 --max-time 60 -o "$f" -w '%{http_code}' "$sales_api" -H "origin: $base" -H "referer: $sales_page" || true)"
            state=''
            if [ "$code" = '200' ]; then
              state="$(F="$f" python - <<'PY'
          import json, os
          with open(os.environ['F'], encoding='utf-8') as h:
              data=json.load(h)
          print((data.get('status') or {}).get('state') or '')
          PY
          )"
            fi
            echo "WAIT $i sales=$state http=$code"
            if [ "$state" = 'COMPLETED' ]; then completed=1; break; fi
            if [ "$state" = 'BLOCKED' ] || [ "$state" = 'FAILED' ]; then
              echo 'Sales-event candidate did not reach verified full apply. Safe stop.'
              exit 0
            fi
            sleep 5
          done
          test "$completed" = '1'

          start_file="$(mktemp)"
          start_code="$(curl -L -sS --connect-timeout 10 --max-time 120 \
            -o "$start_file" -w '%{http_code}' \
            -X POST "$parity_api" \
            -H 'content-type: application/json' \
            -H "origin: $base" -H "referer: $parity_page" \
            --data '{"action":"start"}')"
          echo "START HTTP $start_code"
          cat "$start_file"
          test "$start_code" = '200' -o "$start_code" = '202'
          START_FILE="$start_file" python - <<'PY'
          import json, os
          with open(os.environ['START_FILE'], encoding='utf-8') as f:
              data=json.load(f)
          assert data.get('ok') is True, data
          PY

          for i in $(seq 1 100); do
            status_file="$(mktemp)"
            status_code="$(curl -L -sS --connect-timeout 10 --max-time 60 -o "$status_file" -w '%{http_code}' "$parity_api" -H "origin: $base" -H "referer: $parity_page")"
            test "$status_code" = '200'
            state="$(STATUS_FILE="$status_file" python - <<'PY'
          import json, os
          with open(os.environ['STATUS_FILE'], encoding='utf-8') as f:
              data=json.load(f)
          print((data.get('status') or {}).get('state') or '')
          PY
          )"
            echo "STATUS $i $state"
            if [ "$state" = 'MATCH' ] || [ "$state" = 'MISMATCH' ] || [ "$state" = 'FAILED' ]; then
              STATUS_FILE="$status_file" python - <<'PY'
          import json, os, sys
          with open(os.environ['STATUS_FILE'], encoding='utf-8') as f:
              data=json.load(f)
          s=data.get('status') or {}; r=s.get('report') or {}
          summary={
              'requestId': s.get('requestId'), 'state': s.get('state'),
              'analysisAsOf': r.get('analysisAsOf'),
              'canonicalRowCount': r.get('canonicalRowCount'),
              'directManagedRowCount': r.get('directManagedRowCount'),
              'sharedRowCount': r.get('sharedRowCount'),
              'exactRowCount': r.get('exactRowCount'),
              'unitMismatchCount': r.get('unitMismatchCount'),
              'revenueMismatchCount': r.get('revenueMismatchCount'),
              'missingDirectCount': r.get('missingDirectCount'),
              'directOnlyManagedCount': r.get('directOnlyManagedCount'),
              'canonicalManagedUnits': r.get('canonicalManagedUnits'),
              'directManagedUnits': r.get('directManagedUnits'),
              'canonicalManagedRevenue': r.get('canonicalManagedRevenue'),
              'directManagedRevenue': r.get('directManagedRevenue'),
              'blockerCount': r.get('blockerCount'),
              'canonicalContentFingerprint': r.get('canonicalContentFingerprint'),
              'parityFingerprint': r.get('parityFingerprint'),
          }
          print('FINAL_POST_APPLY_PARITY', json.dumps(summary, ensure_ascii=False))
          print('MISMATCH_SAMPLES', json.dumps((r.get('mismatchSamples') or [])[:50], ensure_ascii=False))
          if s.get('state') == 'FAILED': raise SystemExit(2)
          PY
              exit 0
            fi

            step_file="$(mktemp)"
            step_code="$(curl -L -sS --connect-timeout 10 --max-time 120 \
              -o "$step_file" -w '%{http_code}' \
              -X POST "$parity_api" \
              -H 'content-type: application/json' \
              -H "origin: $base" -H "referer: $parity_page" \
              --data '{"action":"run-next"}' || true)"
            echo "STEP $i HTTP $step_code"
            if [ "$step_code" != '200' ]; then
              cat "$step_file"
              sleep 5
              continue
            fi
            STEP_FILE="$step_file" python - <<'PY'
          import json, os, sys
          with open(os.environ['STEP_FILE'], encoding='utf-8') as f:
              data=json.load(f)
          if data.get('ok') is not True:
              print(data, file=sys.stderr); raise SystemExit(1)
          print(json.dumps(data.get('result') or {}, ensure_ascii=False)[:2500])
          PY
            sleep 1
          done
          echo 'Post-apply parity runner exhausted before terminal state.' >&2
          exit 1
