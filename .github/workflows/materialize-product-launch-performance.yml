name: Materialize product launch performance

on:
  push:
    branches:
      - agent/product-launch-tracker-performance
    paths:
      - "scripts/.product-launch-performance.part*"
      - "scripts/materialize-product-launch-performance.mjs"
      - ".github/workflows/materialize-product-launch-performance.yml"

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out performance branch
        uses: actions/checkout@v4
        with:
          ref: agent/product-launch-tracker-performance

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Materialize and verify optimized tracker
        run: node scripts/materialize-product-launch-performance.mjs

      - name: Commit optimized tracker files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/lib/productLaunchTrackerOptimized.ts \
            src/app/api/product-launch-tracker/optimized/route.ts \
            src/app/api/product-launch-tracker/state/route.ts \
            public/product-launch-tracker-app/optimized-app.js \
            public/product-launch-tracker-app/app.js \
            tests/productLaunchTrackerOptimized.test.mjs \
            tests/productLaunchTrackerOptimizedContracts.test.mjs
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Optimize product launch tracker data flow"
          git push
