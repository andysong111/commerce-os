name: Product Lifecycle Slot Engine CI

on:
  pull_request:
    paths:
      - "src/lib/productLifecyclePolicy.ts"
      - "src/lib/productLifecycleEngine.ts"
      - "src/lib/productLifecyclePurchaseOverlay.ts"
      - "src/lib/integrations/productDecisionAgent.ts"
      - "src/lib/extendedModuleRegistry.ts"
      - "src/app/product-lifecycle/**"
      - "src/app/api/cron/product-lifecycle-refresh/**"
      - "src/app/api/shopling-lifecycle-bridge/**"
      - "tests/productLifecyclePolicy.test.mjs"
      - "supabase/migrations/202608310001_product_lifecycle_slot_engine_v1.sql"
      - ".github/workflows/product-lifecycle-slot-engine-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: product-lifecycle-slot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lifecycle-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Lint lifecycle control plane
        run: >-
          npx eslint
          src/lib/productLifecyclePolicy.ts
          src/lib/productLifecycleEngine.ts
          src/lib/productLifecyclePurchaseOverlay.ts
          src/lib/integrations/productDecisionAgent.ts
          src/lib/extendedModuleRegistry.ts
          src/app/product-lifecycle/page.tsx
          src/app/api/cron/product-lifecycle-refresh/route.ts
          src/app/api/shopling-lifecycle-bridge/route.ts
          tests/productLifecyclePolicy.test.mjs
      - name: Run lifecycle regressions
        run: >-
          node --experimental-strip-types --test
          tests/productLifecyclePolicy.test.mjs
      - name: Build Ops Center
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://product-lifecycle-build-check.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_product_lifecycle_build_check
          SUPABASE_SECRET_KEY: sb_secret_product_lifecycle_build_check
          PRODUCT_MASTER_BASE_URL: https://commerce-os-product-master.vercel.app
          PRODUCT_MASTER_INTEGRATION_SECRET: ci-product-master-secret
          SHOPLING_LOGIN_ID: ci-shopling-id
          SHOPLING_COMPANY_ID: ci-shopling-company
          SHOPLING_API_AUTH_KEY: ci-shopling-key
          CRON_SECRET: ci-cron-secret
          PRODUCT_LIFECYCLE_ENFORCEMENT_MODE: shadow
