name: Patch sales-event resume typing

on:
  push:
    branches:
      - fix/canonical-sales-event-resume-partial

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/canonical-sales-event-resume-partial
          fetch-depth: 0
      - name: Use deterministic request ranges for reusable chunk gate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/lib/productMasterShoplingSalesEventRecovery.ts')
          text = path.read_text(encoding='utf-8')
          old = '  const allowed = new Set(child.ranges.map(rangeKey));'
          new = '''  const allowed = new Set(
    splitShoplingDateRange(
      child.analysisStartDate,
      child.analysisEndDate,
      child.chunkDays,
    ).map(rangeKey),
  );'''
          if old not in text:
            raise SystemExit('reusable range gate target not found')
          text = text.replace(old, new, 1)
          old_unused = '''  const recoveryRequest: RecoveryRequest = {
    ...latest,
    ranges: splitShoplingDateRange(
      latest.analysisStartDate,
      latest.analysisEndDate,
      latest.chunkDays,
    ),
  };
'''
          text = text.replace(old_unused, '', 1)
          text = text.replace('  void recoveryRequest;\n', '', 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'commerce-os-bot'
          git config user.email 'commerce-os-bot@users.noreply.github.com'
          git add src/lib/productMasterShoplingSalesEventRecovery.ts
          git commit -m 'Fix reusable sales-event range typing'
          git push origin HEAD:fix/canonical-sales-event-resume-partial
