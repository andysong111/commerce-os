name: BBA4-1 Unmapped Evidence Probe

on:
  pull_request:

permissions:
  contents: read

jobs:
  production-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read BBA4-1 production evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import html
          import re
          import subprocess
          from pathlib import Path

          pages = [
              ('DIAG', 'https://commerce-os-ops-center.vercel.app/product-master/shopling-diagnostic'),
              ('APPLY', 'https://commerce-os-ops-center.vercel.app/product-master/shopling-diagnostic/apply'),
              ('DIRECT', 'https://commerce-os-ops-center.vercel.app/product-master/shopling-sales-backfill/direct-code-evidence'),
              ('BACKFILL', 'https://commerce-os-ops-center.vercel.app/product-master/shopling-sales-backfill'),
          ]
          for label, url in pages:
              out=Path(f'/tmp/{label}.html')
              p=subprocess.run(['curl','-L','-sS','--connect-timeout','10','--max-time','30','-o',str(out),'-w','%{http_code}',url],capture_output=True,text=True)
              print(f'{label}_HTTP={p.stdout.strip()}')
              if p.stdout.strip()!='200':
                  continue
              raw=out.read_text(encoding='utf-8',errors='ignore')
              raw=re.sub(r'<script[\s\S]*?</script>',' ',raw,flags=re.I)
              raw=re.sub(r'<style[\s\S]*?</style>',' ',raw,flags=re.I)
              raw=re.sub(r'<[^>]+>',' ',raw)
              clean=re.sub(r'\s+',' ',html.unescape(raw)).strip()
              for needle in ['BBA4-1','28162748','120097','2838726']:
                  starts=[]
                  pos=0
                  while True:
                      idx=clean.find(needle,pos)
                      if idx<0 or len(starts)>=10:
                          break
                      starts.append(idx)
                      pos=idx+len(needle)
                  for n,idx in enumerate(starts,1):
                      print(f'{label}_{needle}_{n}: {clean[max(0,idx-500):idx+1200]}')
          PY