name: Temporary Canonical Full Audit Seven Day Patch

on:
  push:
    branches:
      - fix/canonical-full-audit-seven-day-ranges

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[full-audit-7d-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/canonical-full-audit-seven-day-ranges
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Patch full audit source policy
        shell: python
        run: |
          from pathlib import Path

          engine = Path('src/lib/canonicalSalesEventFullAudit.ts')
          s = engine.read_text(encoding='utf-8')
          replacements = [
            ('export const CANONICAL_EVENT_FULL_AUDIT_RANGE_DAYS = 30;', 'export const CANONICAL_EVENT_FULL_AUDIT_RANGE_DAYS = 7;\nexport const CANONICAL_EVENT_FULL_AUDIT_POLICY_VERSION = "v2-seven-day-source";'),
            ('  baselineReconciliationFingerprint: string;\n  createdAt: string;', '  baselineReconciliationFingerprint: string;\n  sourcePolicyVersion: string;\n  sourceRangeDays: number;\n  createdAt: string;'),
            ('  const baselineReconciliationFingerprint = text(value.baselineReconciliationFingerprint);', '  const baselineReconciliationFingerprint = text(value.baselineReconciliationFingerprint);\n  const sourcePolicyVersion = text(value.sourcePolicyVersion);\n  const sourceRangeDays = integer(value.sourceRangeDays);'),
            ('    !/^sha256:[a-f0-9]{64}$/.test(baselineReconciliationFingerprint)\n  ) return null;', '    !/^sha256:[a-f0-9]{64}$/.test(baselineReconciliationFingerprint) ||\n    sourcePolicyVersion !== CANONICAL_EVENT_FULL_AUDIT_POLICY_VERSION ||\n    sourceRangeDays !== CANONICAL_EVENT_FULL_AUDIT_RANGE_DAYS\n  ) return null;'),
            ('    baselineReconciliationFingerprint,\n    createdAt,', '    baselineReconciliationFingerprint,\n    sourcePolicyVersion,\n    sourceRangeDays,\n    createdAt,'),
            ('    baselineReconciliationFingerprint: reconciliation.reconciliationFingerprint,\n    createdAt: analysisAsOf,', '    baselineReconciliationFingerprint: reconciliation.reconciliationFingerprint,\n    sourcePolicyVersion: CANONICAL_EVENT_FULL_AUDIT_POLICY_VERSION,\n    sourceRangeDays: CANONICAL_EVENT_FULL_AUDIT_RANGE_DAYS,\n    createdAt: analysisAsOf,'),
            ('      analysisDays: PRODUCT_MASTER_SALES_EVENT_ANALYSIS_DAYS,\n      writesEnabled: false,', '      analysisDays: PRODUCT_MASTER_SALES_EVENT_ANALYSIS_DAYS,\n      sourcePolicyVersion: request.sourcePolicyVersion,\n      sourceRangeDays: request.sourceRangeDays,\n      writesEnabled: false,'),
            ('      message: `${completedRanges}/${request.ranges.length}개 30일 source range를 읽었습니다.`,', '      message: `${completedRanges}/${request.ranges.length}개 7일 source range를 읽었습니다.`,'),
          ]
          for old, new in replacements:
            if new in s:
              continue
            if old not in s:
              raise SystemExit(f'engine patch marker missing: {old[:80]}')
            s = s.replace(old, new, 1)
          engine.write_text(s, encoding='utf-8')

          cron = Path('src/app/api/cron/stage8-canonical-sales-event-full-audit/route.ts')
          c = cron.read_text(encoding='utf-8')
          c = c.replace('const MAX_STEPS_PER_INVOCATION = 2;', 'const MAX_STEPS_PER_INVOCATION = 3;')
          c = c.replace('const EXTRA_STEP_START_BUDGET_MS = 20_000;', 'const EXTRA_STEP_START_BUDGET_MS = 35_000;')
          cron.write_text(c, encoding='utf-8')

          page = Path('src/app/stage8-canonical-sales-event-full-audit/page.tsx')
          p = page.read_text(encoding='utf-8')
          p = p.replace('30일 단위로 다시 읽고', '7일 단위로 다시 읽고')
          p = p.replace('label="30일 Source range"', 'label="7일 Source range"')
          page.write_text(p, encoding='utf-8')

          test = Path('tests/canonicalSalesEventFullAudit.test.mjs')
          t = test.read_text(encoding='utf-8')
          t = t.replace('/CANONICAL_EVENT_FULL_AUDIT_RANGE_DAYS = 30/', '/CANONICAL_EVENT_FULL_AUDIT_RANGE_DAYS = 7/')
          if 'CANONICAL_EVENT_FULL_AUDIT_POLICY_VERSION' not in t:
            marker = '  assert.match(engine, /CANONICAL_EVENT_FULL_AUDIT_RANGE_DAYS = 7/);\n'
            t = t.replace(marker, marker + '  assert.match(engine, /CANONICAL_EVENT_FULL_AUDIT_POLICY_VERSION = "v2-seven-day-source"/);\n', 1)
          test.write_text(t, encoding='utf-8')
      - name: Focused tests
        run: node --experimental-strip-types --test tests/canonicalSalesEventFullAudit.test.mjs tests/canonicalSalesEventIncrementalShadow.test.mjs
      - name: Lint
        run: npx eslint src/lib/canonicalSalesEventFullAudit.ts src/app/api/cron/stage8-canonical-sales-event-full-audit/route.ts src/app/stage8-canonical-sales-event-full-audit/page.tsx
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://price-auth-build-check.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_price_auth_build_check
          PRICE_ADJUSTMENT_ENGINE_INTEGRATION_SECRET: ci-price-adjustment-secret
          PRICE_ADJUSTMENT_AUTOMATION_OWNER_ID: 0c23a96b-1cda-44b6-9c08-1fa1c1b45a36
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/canonicalSalesEventFullAudit.ts src/app/api/cron/stage8-canonical-sales-event-full-audit/route.ts src/app/stage8-canonical-sales-event-full-audit/page.tsx tests/canonicalSalesEventFullAudit.test.mjs
          if git diff --cached --quiet; then echo 'No patch needed.'; exit 0; fi
          git commit -m "Use proven seven-day source ranges for full audit [full-audit-7d-patched]"
          git push origin HEAD:fix/canonical-full-audit-seven-day-ranges
