name: Apply Keyword FINAL RESULT Cockpit Once

on:
  push:
    branches:
      - feat/keyword-final-result-cockpit-20260821
    paths:
      - ".github/workflows/keyword-final-result-cockpit-once.yml"

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/keyword-final-result-cockpit-20260821
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Apply FINAL RESULT cockpit patch
        run: python scripts/apply-keyword-final-result-cockpit.py

      - name: Install dependencies
        run: npm ci

      - name: Lint changed Keyword Lab files
        run: >-
          npx eslint
          src/app/keyword-engine-elon-lab/layout.tsx
          src/app/keyword-engine-elon-lab/KeywordElonAutoRunToStep4.tsx
          src/app/keyword-engine-elon-lab/KeywordElonCollapsibleSection.tsx

      - name: Test Keyword Lab contracts
        run: >-
          node --experimental-strip-types --test
          tests/keywordEngineElonLab.test.mjs
          tests/keywordEngineElonLabRuntime.test.mjs
          tests/keywordEngineElonLabClientScoringBridge.test.mjs
          tests/keywordEngineElonLabStep3.test.mjs
          tests/keywordEngineElonLabStep4.test.mjs
          tests/keywordEngineElonLabRoundsAndAuto.test.mjs
          tests/keywordEngineElonLabOneClickResume.test.mjs
          tests/keywordEngineElonLabDiversitySupplement.test.mjs
          tests/keywordEngineElonLabRecovery.test.mjs

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://price-auth-build-check.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_price_auth_build_check
          PRICE_ADJUSTMENT_ENGINE_INTEGRATION_SECRET: ci-price-adjustment-secret
          PRICE_ADJUSTMENT_AUTOMATION_OWNER_ID: 0c23a96b-1cda-44b6-9c08-1fa1c1b45a36

      - name: Commit validated cockpit
        shell: bash
        run: |
          rm -f scripts/apply-keyword-final-result-cockpit.py
          rm -f .github/workflows/keyword-final-result-cockpit-once.yml
          git config user.name "commerce-os-automation"
          git config user.email "commerce-os-automation@users.noreply.github.com"
          git add -A
          git commit -m "feat: add one-click FINAL RESULT cockpit and collapsed details"
          git push origin HEAD:feat/keyword-final-result-cockpit-20260821
